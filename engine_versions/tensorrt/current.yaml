# Per-engine version pin for tensorrt-llm. Renovate-writable input only.
#
# Renovate updates `library.current_version` on each upstream release. The
# codegen and schema tooling reads the pin to select which mined snapshot under
# `engine_versions/tensorrt/v<version>/outputs/` to project into the shipped
# typed models and schema shadow. This file stays input-only so Renovate is the
# sole writer.
schema_version: 1
engine: tensorrt
library:
  pep503_name: tensorrt-llm
  current_version: "1.0.0"
source_tarball:
  # Template for the upstream release tarball. Tooling that mines TRT-LLM source
  # files substitutes `{version}` with `library.current_version`. Single locus
  # to update if NVIDIA changes their tag scheme. See #532.
  url_template: "https://github.com/NVIDIA/TensorRT-LLM/archive/refs/tags/v{version}.tar.gz"
