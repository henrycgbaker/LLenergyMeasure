# Per-engine version-bundle SSOT for tensorrt-llm. Renovate-writable input only.
#
# Renovate updates `library.current_version` on each upstream release; the
# dispatcher (engine_versions/_dispatcher.load_producer) resolves which
# vendored producer to run, falling back to the most-recent prior version
# when no exact-match archive exists at the bumped version. The probe
# (scripts/_drift.py) verifies the dispatched producer's LANDMARKS still
# resolve under the live library; probe verdict is the runtime gate.
#
# Cross-run fingerprint state lives in engine_versions/<engine>.compat.json
# (cache, not SSOT). GitHub Actions records per-run probe history; this
# file stays input-only so Renovate is the sole writer.
schema_version: 1
engine: tensorrt
library:
  pep503_name: tensorrt-llm
  current_version: "0.21.0"
  current_commit_sha: null
image:
  base_image_ref: "nvcr.io/nvidia/tensorrt-llm/release:0.21.0"
  llem_image_ref: null
source_tarball:
  # Template for the upstream release tarball. Workflow cells that need to
  # mine TRT-LLM source files (the static miner + introspector) read it via
  # `yq`, then substitute `{version}` with `library.current_version`. Single
  # locus to update if NVIDIA changes their tag scheme. See #532.
  url_template: "https://github.com/NVIDIA/TensorRT-LLM/archive/refs/tags/v{version}.tar.gz"
artefact_paths:
  engine_invariants: src/llenergymeasure/engines/tensorrt/invariants.proposed.yaml
  validated_invariants: src/llenergymeasure/engines/tensorrt/invariants.validated.yaml
  discovered_schemas: src/llenergymeasure/engines/tensorrt/schema.discovered.json
