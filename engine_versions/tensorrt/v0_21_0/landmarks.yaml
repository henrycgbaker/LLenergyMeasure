# Per-version landmark data for the tensorrt static invariant miner (0.21.0).
#
# Externalised from the v0_21_0 producer's module-level tuples. This file is
# the reference side of the producer-dedup gate: the rewired v1_0_0 producer
# loads it when the pin resolves to 0.21.0 and is expected to reproduce the
# v0_21_0 reference producer's output.
#
# probe_landmarks  -> the dotted attribute paths scripts/_drift.py resolves
#                     under the installed library (the runtime drift gate).
# source.root      -> template for the extracted source tree; {version} is
#                     substituted with the requested library version.
# class_targets    -> classes the miner expects to find in source (fail-loud).
# method_landmarks -> validator methods whose bodies are walked.
# strenum_fields   -> StrEnum class -> the TrtLlmArgs field it constrains.
schema_version: 1
engine: tensorrt
library_version: "0.21.0"
source:
  root: "/tmp/trt-llm-{version}/tensorrt_llm"
  files:
    llm_args: "llmapi/llm_args.py"
    builder: "builder.py"
probe_landmarks:
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs.validate_dtype
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs.validate_model
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs.validate_model_format_misc
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs.set_runtime_knobs_from_build_config
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs.validate_build_config_with_runtime_params
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs.validate_build_config_remaining
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs.validate_speculative_config
  - tensorrt_llm.llmapi.llm_args.BaseLlmArgs.validate_lora_config_consistency
  - tensorrt_llm.llmapi.llm_args.TrtLlmArgs
  - tensorrt_llm.llmapi.llm_args.TrtLlmArgs.validate_enable_build_cache
  - tensorrt_llm.llmapi.llm_args.LookaheadDecodingConfig
  - tensorrt_llm.llmapi.llm_args.LookaheadDecodingConfig.validate_positive_values
  - tensorrt_llm.llmapi.llm_args.CalibConfig
  - tensorrt_llm.llmapi.llm_args.BatchingType
  - tensorrt_llm.llmapi.llm_args.CapacitySchedulerPolicy
  - tensorrt_llm.llmapi.llm_args.ContextChunkingPolicy
  - tensorrt_llm.builder.Builder
  - tensorrt_llm.builder.Builder.build_engine
class_targets:
  - {class: BaseLlmArgs, file: llm_args}
  - {class: TrtLlmArgs, file: llm_args}
  - {class: LookaheadDecodingConfig, file: llm_args}
  - {class: CalibConfig, file: llm_args}
  - {class: BatchingType, file: llm_args}
  - {class: CapacitySchedulerPolicy, file: llm_args}
  - {class: ContextChunkingPolicy, file: llm_args}
method_landmarks:
  - {class: BaseLlmArgs, method: validate_dtype}
  - {class: BaseLlmArgs, method: validate_model}
  - {class: BaseLlmArgs, method: validate_model_format_misc}
  - {class: BaseLlmArgs, method: set_runtime_knobs_from_build_config}
  - {class: BaseLlmArgs, method: validate_build_config_with_runtime_params}
  - {class: BaseLlmArgs, method: validate_build_config_remaining}
  - {class: BaseLlmArgs, method: validate_speculative_config}
  - {class: BaseLlmArgs, method: validate_lora_config_consistency}
  - {class: TrtLlmArgs, method: validate_enable_build_cache}
  - {class: LookaheadDecodingConfig, method: validate_positive_values}
strenum_fields:
  - {enum: BatchingType, field: batching_type}
  - {enum: CapacitySchedulerPolicy, field: capacity_scheduler_policy}
  - {enum: ContextChunkingPolicy, field: context_chunking_policy}
