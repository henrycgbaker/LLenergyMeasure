# Exposure allowlist for tensorrt-llm 1.2.1 (curation as data).
#
# Field names llem exposes as first-class typed fields on the generated
# Config class. Non-curated engine fields stay reachable through the
# extra="allow" passthrough with soft validation against the full
# discovered schema. Curation is an exposure-time decision; mining never
# narrows.
#
# Carried forward unchanged from the v1_0_0 allowlist: every curated field
# is still present in the 1.2.1 discovered schema (the 1.0.0 -> 1.2.1 diff
# removed only the non-curated deprecated auto_parallel pair). TensorRT-LLM
# has no llem-orchestration residual (HarnessConfig is empty for tensorrt).
#
# Each entry is cross-checked against schema.discovered.json for this pin.
# Every curated field is present in the discovered schema; this pin carries
# no discovery debt.
schema_version: 1.0.0
engine: tensorrt
engine_version: 1.2.1
exposed_fields:
  engine_params:
    - max_batch_size
    - tensor_parallel_size
    - pipeline_parallel_size
    - max_input_len
    - max_seq_len
    - max_num_tokens
    - dtype
    - fast_build
    - backend
    - quant_config
    - kv_cache_config
    - scheduler_config
  sampling_params:
    - temperature
    - top_k
    - top_p
    - repetition_penalty
    - min_p
    - min_tokens
    - n
    - ignore_eos

# Exposure-time narrowings applied to the generated Config only; the mined
# schema.discovered.json is untouched (the mined `backend` type stays `str`,
# because construction accepts arbitrary strings so a runtime-literal
# recording would be unsound). backend selects the constructor CLASS at
# construction (pytorch/None -> tensorrt_llm.LLM / TorchLlmArgs; trt ->
# tensorrt_llm._tensorrt_engine.LLM / TrtLlmArgs), so llem exposes exactly the
# two backends it dispatches, defaulting to pytorch. _autodeploy is upstream
# but not exposed. Cross-backend field applicability (e.g. fast_build /
# quant_config require backend trt) is enforced by loud corpus rules + the
# plugin guards, never by narrowing here.
exposure_overrides:
  engine_params:
    backend:
      enum: [pytorch, trt]
      default: pytorch
