# Per-engine version pin for transformers. Renovate-writable input only.
#
# Renovate updates `library.current_version` on each upstream release. The
# codegen and schema tooling reads the pin to select which mined snapshot under
# `engine_versions/transformers/v<version>/outputs/` to project into the shipped
# typed models and schema shadow. This file stays input-only so Renovate is the
# sole writer.
schema_version: 1
engine: transformers
library:
  pep503_name: transformers
  current_version: "5.14.1"
