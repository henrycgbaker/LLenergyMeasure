# Per-engine version-bundle SSOT for vllm. Renovate-writable input only.
#
# Renovate updates `library.current_version` on each upstream release; the
# dispatcher (engine_versions/_dispatcher.load_producer) resolves which
# vendored producer to run, falling back to the most-recent prior version
# when no exact-match archive exists at the bumped version. The probe
# (scripts/_drift.py) verifies the dispatched producer's LANDMARKS still
# resolve under the live library; probe verdict is the runtime gate.
#
# Cross-run fingerprint state lives in engine_versions/<engine>.compat.json
# (cache, not SSOT). GitHub Actions records per-run probe history; this
# file stays input-only so Renovate is the sole writer.
schema_version: 1
engine: vllm
library:
  pep503_name: vllm
  current_version: "0.7.3"
  current_commit_sha: null
image:
  base_image_ref: "vllm/vllm-openai:v0.7.3"
  llem_image_ref: null
artefact_paths:
  engine_invariants: src/llenergymeasure/engines/vllm/invariants.proposed.yaml
  validated_invariants: src/llenergymeasure/engines/vllm/invariants.validated.yaml
  discovered_schemas: src/llenergymeasure/engines/vllm/schema.discovered.json
