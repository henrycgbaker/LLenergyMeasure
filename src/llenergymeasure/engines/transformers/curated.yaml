# Per-version curation: which schema-discovered fields llem exposes as
# a typed Pydantic config.
#
# Phase 2-T scope expanded 2026-05-24 (Move 1 kwargs-docstring walker
# + BitsAndBytesConfig LANDMARK landed): 11 new engine_params fields
# are now mineable from PreTrainedModel.from_pretrained's docstring +
# BitsAndBytesConfig's docstring. Curated set grows from 14 -> 25
# fields, matching ~73% of the hand-written TransformersConfig surface.
#
# Still not mined (stay in hand-written or future llem-domain wrapper):
# - batch_size: llem concept (not in transformers API)
# - torch_compile / torch_compile_mode / torch_compile_backend: llem
#   applies torch.compile() post-load; not in transformers API surface
# - allow_tf32 / autocast_enabled / autocast_dtype: torch global state
# - low_cpu_mem_usage: dropped from HF docstring in 4.57.3 (was
#   present in earlier versions; walker correctly reflects the upstream
#   reality)
schema_version: 1.0.0
engine: transformers
engine_version: 4.57.3
exposed_fields:
  engine_params:
    # from PreTrainedModel.from_pretrained kwargs (Move 1 docstring walker)
    - dtype
    - attn_implementation
    - device_map
    - max_memory
    - tp_plan
    - tp_size
    # from BitsAndBytesConfig docstring (Move 1 BNB LANDMARK)
    - load_in_4bit
    - load_in_8bit
    - bnb_4bit_compute_dtype
    - bnb_4bit_quant_type
    - bnb_4bit_use_double_quant
  sampling_params:
    - cache_implementation
    - do_sample
    - early_stopping
    - length_penalty
    - min_new_tokens
    - min_p
    - no_repeat_ngram_size
    - num_beams
    - prompt_lookup_num_tokens
    - repetition_penalty
    - temperature
    - top_k
    - top_p
    - use_cache
    # CompileConfig now mined via #671 nested-dataclass walker; was overlay
    # completion prior. Surfaces as $ref into the $defs block.
    - compile_config
