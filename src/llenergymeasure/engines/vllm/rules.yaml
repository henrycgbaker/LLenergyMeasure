# Shipped engine validation rules. Single runtime source per engine.
# Schema + loader: src/llenergymeasure/config/engine_rules/loader.py
# severity is closed {error, dormant}; provenance is metadata only.
schema_version: 1.0.0
engine: vllm
engine_version: 0.7.3
rules:
- id: vllm_samplingparams_dormant_seed_eq_neg1
  engine: vllm
  severity: dormant
  match:
    fields:
      vllm.sampling.seed: -1
  normalised_fields:
  - seed
  provenance:
    source: deterministic_miner
    verified: construction
    engine_version: 0.7.3
    citation: sampling_params.py:311
    date: '2026-04-27'
- id: vllm_samplingparams_raises_best_of_lt_ref_n
  engine: vllm
  severity: error
  match:
    fields:
      vllm.sampling.best_of:
        present: true
        <: '@n'
  message_template: best_of must be greater than or equal to n, got n={n} and best_of={best_of}.
  provenance:
    source: deterministic_miner
    verified: construction
    engine_version: 0.7.3
    citation: sampling_params.py:296
    date: '2026-05-13'
- id: vllm_samplingparams_raises_min_tokens_gt_ref_max_tokens
  engine: vllm
  severity: error
  match:
    fields:
      vllm.sampling.max_tokens:
        present: true
      vllm.sampling.min_tokens:
        '>': '@max_tokens'
  message_template: min_tokens must be less than or equal to max_tokens={max_tokens}, got {min_tokens}.
  provenance:
    source: deterministic_miner
    verified: construction
    engine_version: 0.7.3
    citation: sampling_params.py:388
    date: '2026-04-27'
