    max_num_batched_tokens: 2
    enable_chunked_prefill: false
    max_num_seqs: 1
    is_encoder_decoder: false
  expected_outcome:
    outcome: error
    emission_channel: none
    normalised_fields: []
  message_template: max_num_batched_tokens ({max_num_batched_tokens}) is smaller than max_model_len ({max_model_len}).
