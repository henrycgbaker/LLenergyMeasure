- id: vllm_schedulerconfig_raises_max_num_batched_tokens_lt_ref_max_model_len
  engine: vllm
  library: vllm
  invariant_under_test: 'SchedulerConfig.verify_max_model_len: raises when max_num_batched_tokens < @max_model_len
    AND enable_chunked_prefill absent (cross-field; sibling-neutralising is_encoder_decoder/max_num_seqs
    kwargs hand-supplied)'
  severity: error
  native_type: vllm.config.SchedulerConfig
  miner_source:
    path: scheduler.py
    method: verify_max_model_len
    line_at_scan: 264
  match:
    engine: vllm
    fields:
      vllm.engine_params.max_num_batched_tokens:
        <: '@max_model_len'
      vllm.engine_params.enable_chunked_prefill:
        absent: true
  kwargs_positive:
