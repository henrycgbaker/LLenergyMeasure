# Tutorial: multi-engine implementation-parameter study.
#
# Goal: measure how four implementation choices - dtype, batching,
# attention backend, KV-cache reuse - affect energy and efficiency for
# the same model across three inference engines (Transformers, vLLM,
# TensorRT-LLM).
#
# Walkthrough: docs/tutorials/multi-engine-study.md
#
# Run:
#   llem run configs/tutorials/tutorial-multi-engine.yaml
#
# Expected experiment count: ~36 (after dedup; depends on engine availability).
# Wall-clock: ~30 min on a single A100-class GPU once images are pulled
# (TensorRT-LLM compilation adds ~5 min on first run).

study_name: tutorial-multi-engine

# Serving mode is required (no default): this tutorial is offline batch inference.
serving_mode: offline

runners:
  transformers: container
  vllm: container
  tensorrt: container

study_execution:
  n_cycles: 1
  experiment_order: shuffle
  experiment_gap_seconds: 10.0
  cycle_gap_seconds: 30.0
  max_consecutive_failures: 3
  experiment_timeout_seconds: 600.0

# Same model across all three engines; small enough to compile + run quickly.
task:
  model: Qwen/Qwen2.5-0.5B
  random_seed: 42
  dataset:
    source: aienergyscore
    n_prompts: 30
    order: interleaved
  max_input_tokens: 256
  max_output_tokens: 256

measurement:
  energy_sampler: auto
  baseline:
    enabled: true
    duration_seconds: 30.0
  warmup:
    enabled: true
    n_prompts: 3
    thermal_floor_seconds: 30.0

output:
  results_dir: ./results
  save_timeseries: true

# ---------------------------------------------------------------------
# Sweep - four implementation-parameter axes, expanded per engine.
# ---------------------------------------------------------------------
# Independent axes (lists of scalars) are crossed; engines for which an
# axis has no meaning are simply omitted from that axis. Cross-engine
# comparison uses the universal output metrics (mJ/token, tokens/sec).
sweep:
  # 1. Numerical precision - applies to all three engines.
  transformers.engine_params.dtype: [float16, bfloat16]
  vllm.engine_params.dtype: [float16, bfloat16]
  tensorrt.engine_params.dtype: [float16, bfloat16]

  # 2. Batching strategy - engine-native parameter names.
  #    Transformers: explicit batch_size at generation time (llem-owned execution knob).
  #    vLLM: max_num_seqs (continuous batching cap).
  #    TensorRT-LLM: max_batch_size (compile-time engine parameter).
  transformers.llem_execution.batch_size: [4, 16]
  vllm.engine_params.max_num_seqs: [64, 256]
  tensorrt.engine_params.max_batch_size: [4, 16]

  # 3. Attention backend - measurable energy effect on prefill-heavy work.
  #    Transformers: attn_implementation is an engine_params field.
  #    vLLM: attention is Any-typed; swept as a whole-dict value ending at the
  #    declared `attention` leaf (path cannot continue past an Any-typed field).
  #    TensorRT-LLM uses its own fused attention; no axis here.
  transformers.engine_params.attn_implementation: [sdpa, flash_attention_2]
  vllm.attention_backend:
    - vllm.engine_params.attention: {backend: flash_attn}
    - vllm.engine_params.attention: {backend: flashinfer}

  # 4. KV-cache reuse - affects steady-state throughput and energy.
  vllm.engine_params.enable_prefix_caching: [true, false]
  tensorrt.kv_cache_reuse:
    - {}                                              # baseline
    - tensorrt.engine_params.kv_cache_config: {enable_block_reuse: true, free_gpu_memory_fraction: 0.9}
