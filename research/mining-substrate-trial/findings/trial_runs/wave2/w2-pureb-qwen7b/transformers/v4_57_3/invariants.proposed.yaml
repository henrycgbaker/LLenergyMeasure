schema_version: 1.0.0
engine: transformers
engine_version: 4.57.3
invariants:
- id: quantization_config_auto_round_not_supported
  engine: transformers
  library: transformers
  invariant_under_test: quant_method not in ['gptqv1', 'awq', 'auto-round']
  severity: error
  native_type: transformers.quantization.AutoRoundConfig
  miner_source:
    path: quantization_config.py
    method: from_dict.from_dict
    line_at_scan: 10
  match:
    engine: transformers
    fields:
      transformers.quantization.AutoRoundConfig.quant_method:
        not_in:
        - gptqv1
        - awq
        - auto-round
  added_by: llm_pure_b
- id: quantization_config_gptq_meta_not_supported
  engine: transformers
  library: transformers
  invariant_under_test: quant_method == 'gptq' and 'meta' in config_dict
  severity: error
  native_type: transformers.quantization.AutoRoundConfig
  miner_source:
    path: quantization_config.py
    method: from_dict.from_dict
    line_at_scan: 15
  match:
    engine: transformers
    fields:
      transformers.quantization.AutoRoundConfig.quant_method: gptq
      transformers.quantization.AutoRoundConfig.meta:
        present: true
  added_by: llm_pure_b
