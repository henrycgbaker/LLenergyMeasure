# Wave 2 model pins (cost-frontier rewrite).
#
# Per WAVE2_PROTOCOL section 5 discipline F: all Wave 2 model references
# pin by sha256 digest, not by floating tag. This file is the single
# source of truth for which model bytes ran which cell.
#
# Models grouped by tier:
#   - Tier A small models (W2f sweep; 1xA100 each)
#   - Tier B medium models (Wave 1 baseline + similar scale)
#   - Tier C benchmark models (full 4xA100 footprint; ceiling-finding)
#
# Workflow:
# 1. Pull model via `ollama pull <tag>` on the trial host.
# 2. Resolve digest: `ollama show <tag> --modelfile | head -1` produces
#    `FROM <ref>@sha256:<digest>`. Copy the digest.
# 3. Update the matching `digest_sha256` field below.
# 4. The wave2 runner verifies the served model's digest against this
#    file before running any cell; mismatches halt the run.
#
# tree-sitter version is pinned here too because the a_treesitter
# substrate's query results depend on grammar version.

[meta]
protocol_version = "wave2-2.0-cost-frontier"
authored = "2026-06-04"
schema_version = "1"

# -----------------------------------------------------------------------
# Tier A small models (Wave 2f sweep). Each fits on 1xA100-40G.
# Goal: find the smallest model that gives CI-acceptable coverage.
# -----------------------------------------------------------------------

