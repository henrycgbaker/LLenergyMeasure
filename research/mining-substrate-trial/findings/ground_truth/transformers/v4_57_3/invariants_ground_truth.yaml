schema_version: 2.0.0
engine: transformers
engine_version: 4.57.3
ground_truth_built_at: '2026-06-05'
ground_truth_method: |
  Hand-curated against transformers v4.57.3 source. Three sources:
    1. GenerationConfig.validate() / WatermarkingConfig.validate() /
       SynthIDTextWatermarkingConfig.validate()
       (transformers/generation/configuration_utils.py).
    2. Every QuantizationConfigMixin subclass __init__ and post_init in
       transformers/utils/quantization_config.py.
    3. PreTrainedModel.from_pretrained pre-flight gates
       (transformers/modeling_utils.py).
  Every invariant has a citation with file + line.

# Invariant envelope per item:
#   id: stable slug
#   native_field: dotted path under transformers.{section}.{field}
#   predicate_kind: type_check | enum | numeric_range | cross_field | mutual_exclusion | required | identity
#   predicate_value: structured description of the predicate
#   severity: error | warning | dormant | normalisation
#   message_template: literal string from source (or summarised)
#   kwargs_positive: a minimal kwarg dict that TRIGGERS the invariant
#   kwargs_negative: a minimal kwarg dict that does NOT trigger it
#   source: {file, line, qualname}

invariants:

# ============================================================
# GenerationConfig.validate() - individual attribute gates
# ============================================================

- id: generationconfig_early_stopping_allowlist
  native_field: transformers.sampling.early_stopping
  predicate_kind: enum
  predicate_value:
    in: [true, false, 'never']
  severity: error
  message_template: "`early_stopping` must be a boolean or 'never', but is {early_stopping}."
  kwargs_positive: {early_stopping: 1.5}
  kwargs_negative: {early_stopping: false}
  source: {file: transformers/generation/configuration_utils.py, line: 543, qualname: GenerationConfig.validate}

- id: generationconfig_max_new_tokens_positive
  native_field: transformers.sampling.max_new_tokens
  predicate_kind: numeric_range
  predicate_value:
    exclusiveMinimum: 0
    null_allowed: true
  severity: error
  message_template: "`max_new_tokens` must be greater than 0, but is {max_new_tokens}."
  kwargs_positive: {max_new_tokens: -1}
  kwargs_negative: {max_new_tokens: 16}
  source: {file: transformers/generation/configuration_utils.py, line: 545, qualname: GenerationConfig.validate}

- id: generationconfig_pad_token_id_non_negative
