  severity: error
  message_template: "Invalid `cache_implementation` ({value}). Choose one of: {ALL_CACHE_IMPLEMENTATIONS}"
  kwargs_positive: {cache_implementation: nonsense}
  kwargs_negative: {cache_implementation: null}
