schema_version: 2.0.0
engine: transformers
engine_version: 5.6.2
ground_truth_built_at: '2026-06-05'
ground_truth_method: |
  Hand-curated against transformers v5.6.2 source (pip wheel 5.6.2, source-only). Sources:
    1. GenerationConfig.validate() / WatermarkingConfig.validate() /
       SynthIDTextWatermarkingConfig.validate() / GenerationConfig.save_pretrained /
       GenerationConfig.from_model_config
       (transformers/generation/configuration_utils.py).
    2. Every QuantizationConfigMixin subclass __init__ and post_init in
       transformers/utils/quantization_config.py (22 classes).
    3. PreTrainedModel.from_pretrained pre-flight gates
       (transformers/modeling_utils.py) plus the device_map and tensor-parallel
       helpers in transformers/integrations/accelerate.py and
       transformers/integrations/tensor_parallel.py (relocated in v5).
  Every invariant has a citation with file + line. Lines verified against the
  installed 5.6.2 wheel.

# Invariant envelope per item:
#   id: stable slug
#   native_field: dotted path under transformers.{section}.{field}
#   predicate_kind: type_check | enum | numeric_range | cross_field | mutual_exclusion | required | identity | normalisation
#   predicate_value: structured description of the predicate
#   severity: error | warning | dormant | normalisation
#   message_template: literal string from source (or summarised)
#   kwargs_positive: a minimal kwarg dict that TRIGGERS the invariant
#   kwargs_negative: a minimal kwarg dict that does NOT trigger it
#   source: {file, line, qualname}

invariants:

# ============================================================
# GenerationConfig.validate() - individual attribute gates
# ============================================================

- id: generationconfig_early_stopping_allowlist
  native_field: transformers.sampling.early_stopping
  predicate_kind: enum
  predicate_value:
    in: [null, true, false, 'never']
  severity: error
  message_template: "`early_stopping` must be a boolean or 'never', but is {early_stopping}."
  kwargs_positive: {early_stopping: 1.5}
  kwargs_negative: {early_stopping: false}
  source: {file: transformers/generation/configuration_utils.py, line: 605, qualname: GenerationConfig.validate}

- id: generationconfig_max_new_tokens_positive
  native_field: transformers.sampling.max_new_tokens
  predicate_kind: numeric_range
  predicate_value:
    exclusiveMinimum: 0
    null_allowed: true
  severity: error
  message_template: "`max_new_tokens` must be greater than 0, but is {max_new_tokens}."
  kwargs_positive: {max_new_tokens: -1}
  kwargs_negative: {max_new_tokens: 16}
  source: {file: transformers/generation/configuration_utils.py, line: 607, qualname: GenerationConfig.validate}

- id: generationconfig_pad_token_id_non_negative
  native_field: transformers.sampling.pad_token_id
  predicate_kind: numeric_range
  predicate_value:
    minimum: 0
    null_allowed: true
  severity: dormant
  message_template: |
    `pad_token_id` should be positive but got {pad_token_id}. This will cause errors when batch generating, if there is padding. Please set `pad_token_id` explicitly as `model.generation_config.pad_token_id=PAD_TOKEN_ID` to avoid errors in generation
  kwargs_positive: {pad_token_id: -1}
  kwargs_negative: {pad_token_id: 0}
  source: {file: transformers/generation/configuration_utils.py, line: 609, qualname: GenerationConfig.validate}

- id: generationconfig_cache_implementation_allowlist
  native_field: transformers.sampling.cache_implementation
  predicate_kind: enum
  predicate_value:
    in: [static, offloaded_static, sliding_window, hybrid, hybrid_chunked, offloaded_hybrid, offloaded_hybrid_chunked, dynamic, dynamic_full, offloaded, quantized, paged]
    null_allowed: true
    note: "v5 adds 'paged' to the validate-time allowlist (ALL_CACHE_IMPLEMENTATIONS + ('paged',)); 'paged' re-routes to continuous batching."
  severity: error
  message_template: "Invalid `cache_implementation` ({value}). Choose one of: {valid_cache_implementations}"
  kwargs_positive: {cache_implementation: nonsense}
  kwargs_negative: {cache_implementation: paged}
  source: {file: transformers/generation/configuration_utils.py, line: 619, qualname: GenerationConfig.validate}

- id: generationconfig_compile_config_type
  native_field: transformers.sampling.compile_config
  predicate_kind: type_check
  predicate_value:
    isinstance: CompileConfig
    null_allowed: true
  severity: error
  message_template: "You provided `compile_config` as an instance of {type}, but it must be an instance of `CompileConfig`."
  kwargs_positive: {compile_config: 42}
  kwargs_negative: {compile_config: null}
  source: {file: transformers/generation/configuration_utils.py, line: 625, qualname: GenerationConfig.validate}

- id: generationconfig_watermarking_config_validate_delegated
  native_field: transformers.sampling.watermarking_config
  predicate_kind: cross_field
  predicate_value:
    delegate: BaseWatermarkingConfig.validate()
    note: "v5: validate() is called directly on the instance (self.watermarking_config.validate()); the value is expected to already be a BaseWatermarkingConfig instance."
  severity: error
  message_template: "(Delegates to WatermarkingConfig / SynthIDTextWatermarkingConfig validate; see those invariants.)"
  kwargs_positive: {}
  kwargs_negative: {watermarking_config: null}
  source: {file: transformers/generation/configuration_utils.py, line: 631, qualname: GenerationConfig.validate}

