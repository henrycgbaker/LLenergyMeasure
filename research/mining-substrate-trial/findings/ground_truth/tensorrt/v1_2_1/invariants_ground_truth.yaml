scope_notes:
- Each invariant captures a validation predicate enforced at config construction
  (pydantic field_validator / model_validator / dataclass __post_init__ / _validate).
  Predicates that fire only later inside the C++ engine are out of source-walk scope.
- predicate_kind taxonomy is identical to the v0.21.0 ground truth
  (literal_in, strenum_in, range, type_is, file_exists, presence_conflict,
  mutual_exclusion_soft, allowlist_constant, assert_positive, decode_dispatch),
  plus backend_dispatch (NEW at v1.2.1) - speculative_config.supports_backend(backend)
  gates which decoding config is legal on a given backend; mismatch raises ValueError.
- v1.2.1 structural note - speculative dispatch moved from isinstance-based
  instance-REPLACEMENT in the parent validator (v0.21) to per-subclass
  supports_backend() methods + per-subclass model_validator asserts. Each
  *DecodingConfig now self-validates.

