# === Speculative-decoding backend dispatch + per-class asserts (TorchLlmArgs.validate_speculative_config) ===

- id: tensorrt_speculative_config_supports_backend
  native_field: BaseLlmArgs.speculative_config
  predicate_kind: backend_dispatch
  predicate_value: {must: "speculative_config.supports_backend(backend)"}
  severity: error
  message_template: "Speculation type {decoding_type} does not support backend {backend}"
  citation:
    file: tensorrt_llm/llmapi/llm_args.py
    line: 3042
    qualname: TorchLlmArgs.validate_speculative_config
  notes: |
    REPLACES the v0.21 isinstance-based instance-replacement mechanism. Per-class supports_backend:
    Medusa/Lookahead -> not pytorch/_autodeploy; NGram/MTP/Auto -> pytorch only;
    DraftTarget -> pytorch or _autodeploy; SaveHiddenStates -> pytorch only (with side effects).
