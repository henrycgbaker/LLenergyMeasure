scope_notes:
- Each invariant captures a validation predicate that the Pydantic / dataclass /
  metaclass machinery enforces at config construction (i.e. before engine build
  or request submission). Predicates that fire only later (inside the C++ engine
  during build/runtime) are NOT included - they are out of source-walk scope and
  flagged in methodology.md as cpp_runtime_only.
- predicate_kind taxonomy
  - literal_in - Pydantic Literal[...] allowlist on a typed field; out-of-set
    values raise ValidationError at construct time.
  - strenum_in - StrEnum allowlist; values outside enum members raise.
  - range - numeric range predicate (lt / le / gt / ge), enforced by a
    field_validator / model_validator / __post_init__ assertion.
  - type_is - value type check, raises if isinstance() check fails.
  - file_exists - path-must-exist check (raises FileNotFoundError).
  - presence_conflict - raised when two mutually-exclusive fields are both set.
  - mutual_exclusion_soft - WARNS (logger.warning) rather than raises.
  - allowlist_constant - Allowlist sourced from a module-level constant
    (e.g. KV_CACHE_QUANT_ALGO_LIST). Source uses runtime membership check
    (e.g. inside .from_quant_algo).
  - assert_positive - asserted > 0 (or > 0 with custom message) in a validator;
    falsy values raise.
  - decode_dispatch - DecodingBaseConfig.from_dict dispatches by decoding_type
    string; unknown raises.

