established_at: '2026-06-05'
established_by: human-supervised LLM, vllm 0.19.1 source-walk (subpackage layout)
methodology_ref: research/mining-substrate-trial/findings/ground_truth/vllm/v0_19_1/methodology.md

scope_notes:
- Invariants here are constraints vLLM 0.19.1 enforces at config / params construction time
  (raise ValueError/TypeError/RuntimeError/NotImplementedError, warn-and-clamp, silently normalise).
- STRUCTURAL DELTA vs v0.7.3 - the flat vllm/config.py is gone. Each invariant now lives in a
  per-concern module under vllm/config/* (model.py, cache.py, scheduler.py, speculative.py, ...) or
  in a @model_validator / @field_validator (pydantic) instead of an imperative _verify_* method.
- A full source sweep found ~200 raise/assert/warn sites across vllm/config/*, sampling_params.py,
  pooling_params.py and vllm/platforms/* (vs ~60 enumerated for v0.7.3). This catalogue captures the
  LLEM-scope subset (caller-touchable, config-construction-time, energy/fairness-relevant), matching the
  v0.7.3 GT scope. The long tail (compile-internal asserts, distributed-init races, kernel-dispatch
  NotImplementedError) is intentionally OUT of scope - flagged in methodology.md.
- Severity vocabulary - error, warning, dormant, deprecated. Outcome vocabulary - error, warning_emit,
  dormant_silent, deprecation_warning.
- in_baseline refers to the v0.7.3 LLEM baseline; for v0.19.1 there is NO engine_versions baseline yet,
  so in_baseline encodes "was this invariant present (by predicate) in the v0.7.3 GROUND TRUTH" to keep
  version-delta traceability. delta_v073 explains add/remove/rename vs the v0.7.3 GT.

predicate_kind_legend:
  lt: <
  le: <=
  gt: '>'
  ge: '>='
  eq: ==
  ne: '!='
  in: in_set
  not_in: not_in_set
  type_check: isinstance check
  cross_field_lt: x < @other
  cross_field_gt: x > @other
  mutually_exclusive: at-most-one-of fields may be set

