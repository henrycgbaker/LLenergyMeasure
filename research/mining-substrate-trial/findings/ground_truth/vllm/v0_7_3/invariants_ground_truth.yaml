schema_version: ground_truth/1.0.0
engine: vllm
engine_version: 0.7.3
engine_git_tag: v0.7.3
venv_src_root: /tmp/trial_vllm_v0_7_3_venv/src/vllm
established_at: '2026-06-05'
established_by: human-supervised LLM, vllm 0.7.3 source-walk
methodology_ref: research/mining-substrate-trial/findings/ground_truth/vllm/v0_7_3/methodology.md

scope_notes:
- Invariants here are constraints that vLLM 0.7.3 enforces at config / params construction time
  (raise ValueError, raise TypeError, warn-and-clamp, silently normalise).
- Each entry cites the file:line:qualname pair where the predicate lives.
- Severity vocabulary (matches baseline) - error, warning, dormant, deprecated.
- Outcome vocabulary - error, warning_emit, dormant_silent, deprecation_warning.
- kwargs_positive triggers the predicate; kwargs_negative is the minimally-different control.

predicate_kind_legend:
  lt: <
  le: <=
  gt: '>'
  ge: '>='
  eq: ==
  ne: '!='
  in: in_set
  not_in: not_in_set
  type_check: isinstance check
  cross_field_lt: x < @other
  cross_field_gt: x > @other
  mutually_exclusive: at-most-one-of fields may be set

invariants:

