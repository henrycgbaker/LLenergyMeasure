scope_notes: |
  Strategy B enumerates the transformers config surface by TYPE. The config
  class tree walked at this version:
    - GenerationConfig (generation/configuration_utils.py) and its nested
      validatable members WatermarkingConfig / SynthIDTextWatermarkingConfig
      (BaseWatermarkingConfig subclasses) and CompileConfig.
    - PretrainedConfig (configuration_utils.py), the @strict-dataclass base of
      the whole model-config tree.
    - The quantization config family (utils/quantization_config.py):
      QuantizationConfigMixin base + AutoRoundConfig, HqqConfig,
      BitsAndBytesConfig, GPTQConfig, AwqConfig (GPTQConfig subclass), AqlmConfig,
      VptqLayerConfig, VptqConfig, QuantoConfig, EetqConfig,
      CompressedTensorsConfig, FbgemmFp8Config, HiggsConfig, FPQuantConfig,
      TorchAoConfig, BitNetQuantConfig, SpQRConfig, FineGrainedFP8Config,
      QuarkConfig, Mxfp4Config, MetalConfig, FourOverSixConfig, SinqConfig.
  For each class every __init__ / post_init / validate body raise, assert,
  logger.warning(_once), silent normalisation, and every Literal / enum-typed
  field membership rule was read in source context and classified.

  transformers idiom note: this library validates LATER and SOFTER than a
  pydantic engine. GenerationConfig.validate() collects "minor issues" into a
  dict and, with the default strict=False, emits ONE accumulated
  logger.warning_once rather than raising (only a hard subset raise). Quant
  configs raise from post_init. Outcomes recorded as observed, not assumed.

  outcome taxonomy: "invalid" = raises at construction; "warn" = emits a warning
  but constructs; "normalise" = silently mutates a field (no raise/warn);
  "meta" unused here.

  native_type is a DOTTED IMPORTABLE PATH. The gate special-cases
  transformers.GenerationConfig (calls .validate()) and
  transformers.BitsAndBytesConfig; all other transformers.<Class> are
  constructed directly. kwargs construct CPU-only with NO torch installed in
  this venv (confirmed: torch absent). Any check that touches torch, a model
  directory, or an optional 3rd-party backend (optimum, hqq, torchao,
  compressed_tensors, quark) before its predicate can fire carries a
  dormant_reason and NO kwargs - a fabricated pair would make the gate reject an
  otherwise-valid entry. Every emitted kwargs pair was REPLAYED in this venv
  (positive raised/warned; negative constructed clean).

  Strategy-B-specific gain over an entry-point walk: the declarative
  Literal-typed strict-dataclass field (PretrainedConfig.problem_type) and the
  full quantization config class tree (20+ *Config classes, most never touched
  by a generate/load entry-point walk), whose post_init field-allowlist raises
  are pure type-tree surface.

