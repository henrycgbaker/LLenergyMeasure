scope_notes: |
  Strategy A starts from the public surface a benchmark harness actually
  constructs and follows the call graph to every construction-time validation:
    1. transformers.GenerationConfig(...) -> __init__ (calls validate() at
       generation/configuration_utils.py:491) -> validate() (line 612): every
       range / allowlist / mutual-exclusion / cross-field check on sampling and
       decoding params, every warn (minor_issues), the generate-only-kwarg
       rejections, plus the delegated watermarking_config.validate().
    2. transformers.BitsAndBytesConfig(...) (quantization_config.py:439) - the
       gate special-cases this class.
    3. transformers.PretrainedConfig (== PreTrainedConfig) base construction:
       __post_init__ (configuration_utils.py:241) + the huggingface_hub @strict
       validators (validate_output_attentions / validate_architecture /
       validate_layer_type / validate_token_ids) that fire on construction.
  Idiom note: transformers validates LATER and SOFTER than tensorrt/vllm.
  GenerationConfig.validate(strict=False) (the default the gate hits) routes
  many checks to a minor_issues dict that WARNS (logger.warning_once) rather
  than raising; only a subset raise. Each entry records the TRUE outcome from
  source (invalid = raise, warn = logged warning, normalise = silent mutation).
  outcome=warn entries CONSTRUCT successfully (gate must accept construction and
  observe the warning), so kwargs_positive is the warn-triggering combo and
  kwargs_negative the clean combo.
  Replayability: this gate env has NO torch installed. GenerationConfig,
  WatermarkingConfig and PretrainedConfig construct CPU-only. BitsAndBytesConfig,
  SynthIDTextWatermarkingConfig and any check that touches a torch dtype / a real
  model_config / an instantiated config object cannot be replayed and are marked
  dormant (kwargs omitted).
  provenance: all entries are net_new for this version pass (no prior-version PoC
  ground truth folded into this output).

