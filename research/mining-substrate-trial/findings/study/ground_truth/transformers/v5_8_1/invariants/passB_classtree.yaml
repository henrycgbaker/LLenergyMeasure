scope_notes: |
  Strategy B enumerates the transformers config surface by TYPE, not by the
  public generate/load call path. The whole config class tree was walked:
    - The PreTrainedConfig base (configuration_utils.py). PreTrainedConfig is
      @strict-decorated, so its registered validators (validate_output_attentions,
      validate_architecture, validate_token_ids, validate_layer_type) FIRE at
      plain construction, raising StrictDataclassClassValidationError. An
      entry-point generate/load walk does not reach these as standalone raises -
      they are the headline Strategy-B gain here.
    - GenerationConfig.validate() (and its strict-mode aggregation +
      save_pretrained gate), the watermarking config family
      (BaseWatermarkingConfig -> WatermarkingConfig / SynthIDTextWatermarkingConfig,
      each with its own validate()), and CompileConfig / ContinuousBatchingConfig
      (plain dataclasses, no validators - confirmed, none emitted).
    - The full QuantizationConfigMixin subclass tree in
      utils/quantization_config.py (28 classes): every __init__ / post_init
      raise, assert, normalisation and warning.
  An invariant = a rule that makes a config VALID or INVALID (or warns / silently
  normalises) at construction or at .validate().
  outcome taxonomy: "invalid" for raise/error severity, "warn" for a
  logger.warning(_once)/advisory, "normalise" for a silent value rewrite.
  transformers validates LATER and SOFTER than tensorrt: many checks are
  warnings or clamps, and several GenerationConfig checks are "minor issues"
  that only warn unless validate(strict=True) (or save_pretrained) promotes them
  to a raise; those are recorded with their TRUE default outcome (warn).
  native_type is a DOTTED IMPORTABLE PATH. The gate special-cases
  transformers.GenerationConfig (constructs then calls .validate()) and
  transformers.BitsAndBytesConfig; every other class named here is importable
  from the transformers top-level namespace and is constructed directly (its
  __init__/post_init runs the check). kwargs construct CPU-only with NO torch in
  the env (the 5.8.1 venv has no torch): checks that touch torch.dtype, require
  an external backend package (hqq, torchao, optimum), or are GPU/runtime-gated
  carry a dormant_reason and no kwargs.
  All net_new: there is no prior PoC ground truth for v5_8_1 under
  findings/ground_truth/transformers/ (only v4_57_3 and v5_6_2 exist), so nothing
  is folded. Every predicate and citation line was re-derived and re-verified
  against the installed 5.8.1 source.

