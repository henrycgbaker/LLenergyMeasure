scope_notes: |
  Strategy A starts from the public surface a benchmark harness constructs:
  transformers.GenerationConfig(...) (its __init__ calls self.validate() at
  line 469, so every range/allowlist/mutual-exclusion in validate() fires at
  construction), the transformers.*Config quantization classes (each runs
  __init__/post_init validation at construction), and the
  PreTrainedModel.from_pretrained / device_map / tensor-parallel pre-flight
  gates reached on the model-loading path.

  transformers validates LATER and SOFTER than tensorrt/vllm. Many
  GenerationConfig.validate() checks accumulate into a minor_issues dict and
  emit a single logger.warning_once at construction (outcome=warn), only being
  promoted to a raised ValueError when validate(strict=True) runs (which
  save_pretrained forces). The hard raises (early_stopping allowlist,
  max_new_tokens>0, cache_implementation allowlist, compile_config type,
  num_return_sequences cross-checks, generate-only-kwarg rejection) fire
  unconditionally. Outcome is recorded per actual source behaviour.

  Replayability for the CPU-only, no-torch gate (verified by constructing each
  native_type in the 5.6.2 venv WITHOUT torch installed):
    - GenerationConfig: fully replayable. Raises raise; warn-path constructs and
      emits warning_once.
    - Most *Config quant classes: replayable (pure ValueError/TypeError in
      post_init, no torch import at construction).
    - DORMANT (cannot construct CPU-no-torch): BitsAndBytesConfig (its __init__
      sets bnb_4bit_compute_dtype = torch.float32 unconditionally when the kwarg
      is None -> NameError before any type check), HqqConfig (requires the hqq
      package), TorchAoConfig type-check arm (requires torchao; the bare
      "torchao not installed" guard DOES fire and is replayable).
    - DORMANT: WatermarkingConfig / SynthIDTextWatermarkingConfig .validate()
      (the gate special-cases only GenerationConfig + BitsAndBytesConfig and
      otherwise bare-constructs; it does not auto-call .validate() on a
      watermarking instance, and the GenerationConfig path needs a real
      BaseWatermarkingConfig object, not plain kwargs).
    - DORMANT: every from_pretrained / device_map / tensor_parallel gate (needs
      torch, accelerate, a model dir, or a live distributed/device context).
    - DORMANT: GenerationConfig do_sample/num_beams greedy/beam-strip,
      no-cache, and output-flag-without-return-dict checks are warn-at-
      construction and constructible, but their "fire" is a logger.warning_once
      the gate may not capture; recorded outcome=warn, flagged replay-soft.

  provenance: fold = present in the PoC ground truth
  (findings/ground_truth/transformers/v5_6_2), citation re-resolved against this
  venv source; net_new = surfaced by this entry-point walk and absent from the
  PoC GT.

  predicate_kind taxonomy (inherited from the PoC GT, transformers idiom):
  enum, numeric_range, type_check, cross_field, mutual_exclusion, required,
  identity, normalisation.

