scope_notes: |
  Strategy B enumerates the transformers config surface by TYPE, not by call
  path. Starting from the public config class trees the walk descends into:
    - GenerationConfig (transformers/generation/configuration_utils.py) and its
      .validate() body, .save_pretrained(), .from_model_config(); the
      BaseWatermarkingConfig tree (WatermarkingConfig,
      SynthIDTextWatermarkingConfig) and CompileConfig.
    - The QuantizationConfigMixin tree in transformers/utils/quantization_config.py
      (every subclass __init__/post_init: BitsAndBytesConfig, GPTQConfig, AwqConfig
      (a GPTQConfig subclass), AqlmConfig, VptqConfig/VptqLayerConfig, QuantoConfig,
      EetqConfig, HqqConfig, AutoRoundConfig, HiggsConfig, FPQuantConfig,
      TorchAoConfig, BitNetQuantConfig, SpQRConfig, FineGrainedFP8Config,
      MetalConfig, SinqConfig, CompressedTensorsConfig, FbgemmFp8Config,
      QuarkConfig, Mxfp4Config, FourOverSixConfig).
    - The PreTrainedConfig base (transformers/configuration_utils.py): v5 made it a
      strict-dataclass base; its property-setter validators and @strict validate_*
      hooks fire for EVERY config subclass and are entirely absent from the
      entry-point/quant-only PoC GT. This is the principal Strategy-B gain.
  An invariant = a rule that makes a config VALID or INVALID at construction
  (or at .validate()). outcome is "invalid" for raise/assert, "warn" for a
  logger.warning(_once) advisory (transformers idiom: validate LATER and SOFTER),
  "normalise" for a silent clamp/coercion.
  native_type is a DOTTED IMPORTABLE PATH so the gate can construct it directly
  (GenerationConfig special-cased to .validate(); BitsAndBytesConfig special-cased;
  others constructed CPU-only). kwargs pairs are emitted ONLY where the predicate
  is reachable at plain construction on this TORCHLESS CPU host. Empirically
  verified in the 5.6.2 venv: BitsAndBytesConfig post_init and its compute-dtype
  defaults dereference torch (NameError without torch); HqqConfig requires the hqq
  package; TorchAoConfig requires torchao. Those carry dormant_reason and NO kwargs
  rather than a fabricated, gate-breaking pair.
  Strategy-B-specific gain over an entry-point walk: the PreTrainedConfig
  property-setter / @strict class-tree validators (output_attentions-vs-eager,
  validate_architecture head_dim*num_heads==embed_dim, validate_layer_type
  ALLOWED_LAYER_TYPES membership, num_labels/id2label length mismatch) that no
  generate/load call path touches, plus the GenerationConfig __init__-time
  self.validate() coupling (every GenerationConfig field rule fires at construction,
  not only when .validate() is called explicitly).

