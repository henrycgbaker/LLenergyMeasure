scope_notes: |
  Strategy A starts from the public generation/load entry points a benchmark
  harness actually constructs and follows the call graph to every
  construction-time validation site:
    1. transformers.GenerationConfig(...) -> __init__ (generation/
       configuration_utils.py:368) which sets attributes then calls
       self.validate(user_set_attributes=...) at line 490. validate() (line 611)
       holds every range / allowlist / mutual-exclusion / sampling-vs-greedy /
       beam-only check, plus the watermarking_config.validate() dispatch.
    2. transformers.BitsAndBytesConfig(...) -> __init__ (utils/
       quantization_config.py:439) + post_init() (line 520).
    3. transformers.PreTrainedConfig(...) (alias PretrainedConfig). At 5.10.2 it
       is a huggingface_hub @strict dataclass (configuration_utils.py:121
       @strict(accept_kwargs=True)). Construction runs init_with_validate
       (huggingface_hub/dataclasses.py:273): the wrapped __init__ sets each field
       via @strict's __setattr__ (which runs the per-field TYPE validator,
       enforcing the problem_type Literal), runs __post_init__ (line 243), then
       runs every validate_* class validator. __post_init__ also carries direct
       raises/warns.
  Idiom note: transformers validates LATER and SOFTER than tensorrt/vllm. Many
  GenerationConfig checks WARN (logger.warning_once via the minor_issues bucket,
  configuration_utils.py:823) rather than raise. The true outcome is recorded
  per source line: invalid (raise) | warn (logger.warning) | normalise (silent
  mutation). Sampling-/beam-only-flag conflicts are WARN, not raise.
  Replay model: the gate calls GenerationConfig.validate() after construction;
  for GenerationConfig the validation also runs inside __init__, so plain
  construction already fires the rule. PreTrainedConfig validators run at
  construction but a validate_* raise is WRAPPED in
  StrictDataclassClassValidationError whose __cause__ is the ValueError quoted in
  message_template; a field-type (Literal) violation is wrapped in
  StrictDataclassFieldValidationError (__cause__ a TypeError). The __post_init__
  raises (problem_type single_label / num_labels) are BARE ValueErrors, not
  wrapped. The gate must treat the wrapped raise as the FIRE.
  BitsAndBytesConfig: the task gate environment is declared CPU-only with NO
  torch. quantization_config.py imports torch at module load and __init__
  assigns torch.float32 / torch.uint8 at lines 468/477; post_init() type-checks
  against torch.dtype (line 541). Only the load_in_4bit/load_in_8bit conflict
  (line 455) raises BEFORE any torch use and is replayable in a no-torch gate;
  every other bnb check needs torch and is recorded dormant for the gate.
  (Empirically the source host happens to have torch 2.5.1+cpu, so all bnb
  checks were re-verified to fire as declared; the dormant flag tracks the
  gate's stated no-torch contract, not the source host.)
  provenance: net_new = surfaced by this walk (no PoC GT folded for this version;
  task specified all entries net_new).

