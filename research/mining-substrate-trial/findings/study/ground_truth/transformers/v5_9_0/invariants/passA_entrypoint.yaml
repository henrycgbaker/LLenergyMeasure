scope_notes: |
  Strategy A starts from the public generation/load entry points a benchmark
  harness actually constructs and follows the call graph to every
  construction-time validation site:
    1. transformers.GenerationConfig(...) -> __init__ (generation/
       configuration_utils.py:369) which snapshots user_set_attributes, pops
       every generation knob, sets unknown keys via setattr, converts a dict
       watermarking_config into a WatermarkingConfig (line 419-420), then at
       line 491 calls self.validate(user_set_attributes=...). So plain
       construction already runs validation; the gate's construct-then-validate
       path is consistent. validate() (line 612) holds every range / allowlist /
       mutual-exclusion / sampling-vs-greedy / beam-only check plus the
       watermarking_config.validate() dispatch (line 659).
    2. transformers.BitsAndBytesConfig(...) -> __init__ (utils/
       quantization_config.py:439) + post_init() (line 520) + load_in_4bit /
       load_in_8bit property setters.
    3. transformers.PreTrainedConfig(...) (alias PretrainedConfig). At 5.9.0 it
       is a huggingface_hub @strict dataclass (decorator at configuration_utils.py
       :121, accept_kwargs=True): __init__ runs every validate_* method
       automatically. The reachable validators are validate_output_attentions
       (line 436), validate_architecture (line 443), validate_token_ids
       (line 456), validate_layer_type (line 472). __post_init__ (line 243)
       carries additional raises (problem_type/num_labels, line 271) and warns
       (num_labels vs id2label, line 263).
  Idiom note: transformers validates LATER and SOFTER than tensorrt/vllm. Many
  GenerationConfig checks WARN (collected into the minor_issues bucket, emitted
  once via logger.warning_once at line 824) rather than raise. The true outcome
  is recorded per source line: invalid (raise) | warn (logger.warning) |
  normalise (silent mutation). Sampling-/beam-only-flag conflicts are WARN, not
  raise.
  Replay model: the gate calls GenerationConfig.validate() after construction;
  for GenerationConfig the validation also runs inside __init__, so plain
  construction already fires the rule. PreTrainedConfig validate_* raises are
  WRAPPED by huggingface_hub: validate_layer_type / validate_architecture raise
  StrictDataclassClassValidationError whose __cause__ is the quoted ValueError;
  the problem_type Literal type check raises StrictDataclassFieldValidationError
  whose __cause__ is a TypeError. The gate must treat the wrapped raise as the
  FIRE. The problem_type+num_labels raise from __post_init__ is a bare
  ValueError. GenerationConfig and WatermarkingConfig raises are bare ValueErrors.
  BitsAndBytesConfig: this venv has NO torch; quantization_config.py imports
  torch in __init__ and assigns torch.float32 / torch.uint8 at lines 467-487.
  Only the load_in_4bit/load_in_8bit conflict (line 456) raises BEFORE any torch
  use and is reachable; its kwargs_negative still needs torch, so that entry is
  dormant for the no-torch source host. Every other bnb check is unreachable
  without torch and is recorded dormant.
  provenance: net_new = surfaced by this walk. No PoC GT folded for this version
  (task specified all entries net_new). All GenerationConfig.validate() and
  WatermarkingConfig.validate() source is byte-identical to 5.8.1; PreTrainedConfig
  validators and BitsAndBytesConfig checks are logic-identical with re-resolved
  5.9.0 line numbers.

