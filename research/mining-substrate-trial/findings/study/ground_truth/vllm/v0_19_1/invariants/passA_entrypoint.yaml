  message_template: Async EPLB is only supported with the default policy.
  citation:
    file: vllm/config/parallel.py
    line: 87
    qualname: EPLBConfig._validate_eplb_config
  notes: 'EPLBConfig is a nested config reached from ParallelConfig.eplb_config. Its

    @model_validator(mode="after") carries two raises the PoC GT never enumerated

