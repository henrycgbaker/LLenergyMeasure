- batch: round0b_selfconfirm
  source: mech (improved-det-v2 + Round 0b primitives), gate-confirmed
  added_constraint_keys:
  - max_pattern_size|numeric|0
  - cache_dtype|membership|[auto,bfloat16,float16,fp8,fp8_ds_mla,fp8_e4m3,fp8_e5m2,fp8_inc]
  - mamba_ssm_cache_dtype|membership|[auto,float16,float32]
  - moe_backend|membership|[aiter,auto,cutlass,deep_gemm,flashinfer_cutedsl,flashinfer_cutlass,flashinfer_trtllm,marlin,triton]
  - logprobs_mode|membership|[processed_logits,processed_logprobs,raw_logits,raw_logprobs]
  - mm_tensor_ipc|membership|[direct_rpc,torch_shm]
  - seq_pooling_type|membership|[CLS,LAST,MEAN]
  - tok_pooling_type|membership|[ALL,STEP]
- batch: wave2_armA_llm_kwargs
  source: Opus + kwargs-emission (det-then-llm-extend), gate-confirmed + adversarially
    source-verified REAL (the eplb spurious confirm is excluded by the cross-field
    error-locus attribution fix)
  added_constraint_keys:
  - min_pattern_size|presence|[max_pattern_size,min_pattern_size]
  - json|presence|[json,regex]
  - min_tokens|presence|[max_tokens,min_tokens]
  - disable_any_whitespace|exact|[backend,disable_any_whitespace]
  - disable_additional_properties|exact|[backend,disable_additional_properties]
  - log_balancedness|exact|[log_balancedness,log_balancedness_interval]
  - max_cpu_loras|presence|[max_cpu_loras,max_loras]
