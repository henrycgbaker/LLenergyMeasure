pass: A
strategy: entry-point / call-graph walk
established_at: '2026-06-07'
established_by: opus-passA-vllm-0.22.0
methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/vllm/v0_22_0/invariants/passA_methodology.md
scope_notes: |
  Entry-point / call-graph walk of vLLM 0.22.0 starting from the public surface
  a benchmark harness constructs: vllm.LLM(...) -> EngineArgs.create_engine_config
  -> the per-aspect configs in vllm/config/*.py and their __post_init__ /
  @field_validator / @model_validator / Field(...) constraints; plus
  vllm.SamplingParams(...) -> __post_init__ -> _verify_args, and the
  structured-output / repetition-detection params dataclasses.

  An invariant = a construction-time predicate that makes a config/params object
  VALID or INVALID. Severities: error (raise), warning (logger.warning /
  warning_once / warnings.warn, construction still succeeds), normalise (silent
  mutation, no raise/warn). dormant = the check needs a real model dir, a CUDA /
  ROCm / XPU device, a resolved nested ModelConfig, a distributed world, or an
  optional package (e.g. opentelemetry) and so cannot be replayed on a CPU-only
  source host.

  No PoC ground truth exists for v0.22.0 at
  research/mining-substrate-trial/findings/ground_truth/vllm/v0_22_0/ , so every
  entry is provenance: net_new (re-derived from this version's source). native_type
  is a dotted importable path the gate constructs: vllm.SamplingParams,
  vllm.sampling_params.<Class>, or vllm.config.<Class> (all of EPLBConfig,
  PoolerConfig, OffloadConfig, UVAOffloadConfig, PrefetchOffloadConfig etc. are
  re-exported from vllm.config). kwargs_positive SHOULD trigger the rule;
  kwargs_negative should NOT.

invariants:

