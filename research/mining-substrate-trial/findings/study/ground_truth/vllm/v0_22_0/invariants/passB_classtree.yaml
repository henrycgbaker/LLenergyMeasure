engine: vllm
engine_version: 0.22.0
venv_src_root: /tmp/vllm-0.22.0/vllm
pass: B
strategy: class-hierarchy / type-tree walk
established_at: '2026-06-07'
established_by: opus-passB-vllm-0.22.0
methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/vllm/v0_22_0/invariants/passB_methodology.md
scope_notes: |
  Class-hierarchy / type-tree walk of vLLM 0.22.0. Every pydantic @config dataclass
  reachable from vllm.config plus the standalone params types (vllm.SamplingParams,
  vllm.PoolingParams, StructuredOutputsParams, RepetitionDetectionParams) was walked
  by TYPE, and for each class every field-level Literal/enum membership rule, every
  Field(gt/ge/lt/le) numeric constraint, every @field_validator / @model_validator
  body, and every __post_init__ check was extracted and read in source context.
  An invariant = a rule that makes a config VALID or INVALID at construction.
  native_type is a DOTTED IMPORTABLE PATH so the gate can construct it CPU-only.
  kwargs_positive should FIRE the predicate; kwargs_negative should PASS. Pairs are
  emitted only where the predicate is reachable at plain construction on a CPU host.
  GPU-gated, model-dir-gated, distributed/post-init-entangled, env-gated, or
  filesystem-stateful rules carry a dormant_reason and no kwargs rather than a
  fabricated unverifiable pair.
  No PoC ground truth exists for v0_22_0, so every entry is provenance net_new
  (re-derived from THIS version's source; none copied from another version).
  Strategy-B gain over an entry-point walk: the declarative Literal/enum field
  constraints (cache_dtype, kernel moe/linear backends, mamba backend, all2all
  backend, mm_tensor_ipc, pooler types, quant key allowlist) enforced by pydantic
  typing that never appear as an explicit raise on any call path.

invariants:

