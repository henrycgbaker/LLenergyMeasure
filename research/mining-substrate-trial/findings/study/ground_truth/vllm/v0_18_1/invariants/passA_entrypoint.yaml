methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/vllm/v0_18_1/invariants/passA_methodology.md
scope_notes: |
  Entry-point/call-graph walk of vLLM 0.18.1 starting from the public surfaces
  vllm.LLM(...) -> EngineArgs/AsyncEngineArgs.create_engine_config -> the per-aspect
  vllm/config/*.py dataclasses, and vllm.SamplingParams -> __post_init__ -> _verify_args.
  An invariant = a construction-time predicate that makes a config/params object VALID
  or INVALID. Severities: error (raise), warning (logger.warning/warning_once), normalise
  (silent mutation, no raise/warn). dormant = cannot be replayed on a CPU-only source host
  because it needs a real model dir (ModelConfig downloads/parses HF config in __post_init__),
  an InitVar passed only by create_engine_config (SchedulerConfig.max_model_len /
  is_encoder_decoder), a fully-assembled VllmConfig, a GPU/SM platform, or a draft model.
  kwargs_positive SHOULD trigger the rule; kwargs_negative should NOT. They replay against
  the named native_type constructor unless marked dormant.
  No PoC GT existed for vLLM 0.18.1, so every entry is provenance net_new (re-derived from
  0.18.1 source, not copied from the already-mined 0.19.1 cell).
  0.18.1 vs 0.19.1: sampling/structured-output/repetition params and the standalone config
  dataclasses are byte-for-byte equivalent in their validation logic (line numbers shift).
  The notable 0.18.1 DIFFERENCE: SamplingParams._verify_args has NO max_n / n_gt_max_n_sequences
  check (that ceiling was added after 0.18.1); top_k integer-type check still runs AFTER the
  top_k < -1 range check, so a non-int top_k that is also < -1 hits the range raise first.
invariants:

