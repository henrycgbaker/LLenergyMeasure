schema_version: ground_truth/1.0.0
engine: vllm
engine_version: 0.18.1
venv_src_root: /tmp/vllm-0.18.1/vllm
pass: B
strategy: class-hierarchy / type-tree walk
established_at: '2026-06-06'
established_by: opus-passB-vllm-0.18.1
methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/vllm/v0_18_1/invariants/passB_methodology.md
scope_notes: |
  Strategy B (class-hierarchy / type-tree walk) of vLLM 0.18.1. Every config
  dataclass in the modular vllm/config/*.py package (attention, cache,
  compilation, device, ec_transfer, kv_events, kv_transfer, lora, multimodal,
  observability, offload, parallel, profiler, scheduler, speculative,
  structured_outputs, weight_transfer) plus vllm/sampling_params.py and
  vllm/pooling_params.py was walked by TYPE. For each class every field-level
  Literal membership, every Field(ge/gt/le/lt) constraint, every
  field_validator / model_validator body, every __post_init__ / _verify_args
  check, and any raise / assert / logger.warning reachable at construction was
  extracted and read in context against the 0.18.1 source.
  An invariant = a rule that makes a config / params object VALID or INVALID at
  construction. native_type is a dotted importable path so the gate can
  construct the type directly. kwargs_positive SHOULD fire (invalid);
  kwargs_negative should PASS (valid). Pairs are only emitted where they are
  safe to replay CPU-only (no model download, no CUDA query, no distributed
  setup); rules entangled with a GPU / model-dir / distributed __post_init__
  carry dormant_reason and no kwargs rather than a fabricated pair.
  Strategy-B gain over an entry-point walk: the declarative Literal / enum
  membership field constraints (cache_dtype, prefix_caching_hash_algo,
  max_lora_rank, scheduler policy, data_parallel_backend, attention backend
  enum, etc.) that pydantic enforces by typing and that never appear as an
  explicit coded raise on any call path; plus the dead-raise observations
  (EPLBConfig.policy single-member Literal makes the async-policy raise
  unreachable; ECTransferConfig ec_role Literal makes its get_args raise
  unreachable).
  0.18.1 vs 0.19.1: structurally the same modular config package, one minor
  below. The only field-set delta found in the walked surface is
  SpeculativeConfig.rejection_sample_method, which is Literal['strict',
  'probabilistic'] at 0.18.1 (two members) and gained 'synthetic' at 0.19.1.
  SpeculativeMethod and the MTPModelTypes / EagleModelTypes unions are identical
  across the two minors. All cited line numbers are re-derived from 0.18.1
  source and differ from 0.19.1.
invariants:

