schema_version: ground_truth/1.0.0
engine: vllm
engine_version: 0.21.0
venv_src_root: /tmp/vllm-0.21.0/vllm
pass: B
strategy: class-hierarchy / type-tree walk
established_at: '2026-06-07'
established_by: opus-passB-vllm-0.21.0
methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/vllm/v0_21_0/invariants/passB_methodology.md
scope_notes: |
  Class-hierarchy / type-tree walk of the vLLM 0.21.0 config + params surface
  (version confirmed: vllm/_version.py line 21 "__version__ = version = '0.21.0'").
  Every @config pydantic dataclass reachable from vllm.config (attention, cache,
  compilation, device, ec_transfer, kernel, kv_events, kv_transfer, load, lora,
  mamba, model, multimodal, observability, offload, parallel, pooler, profiler,
  quantization, reasoning, scheduler, speculative, structured_outputs,
  weight_transfer) plus vllm.sampling_params and vllm.pooling_params was walked.
  For each class, every Literal/enum-typed field (membership rule), every
  Field(ge/gt/le/lt) numeric constraint, every @field_validator / @model_validator
  body, and every __post_init__ check was extracted and read in source context.
  An invariant = a rule that makes a config VALID or INVALID at construction.
  outcome is "invalid" for an error/raise severity, "warn" for a logger.warning,
  "normalise" for a silent value coercion that the gate should not treat as a raise.
  native_type is a DOTTED IMPORTABLE PATH so the gate can construct the owner
  directly. kwargs_positive SHOULD fire the predicate; kwargs_negative should NOT.
  Pairs are emitted ONLY where the predicate is reachable at plain construction on
  a CPU-only host (single-field declarative constraints and standalone-model
  validators). Rules that are GPU/platform-gated (current_platform probes), env-var
  dependent, filesystem-stateful, model-dir dependent, or fire only at a later
  lifecycle method carry a dormant_reason and no kwargs rather than a fabricated
  unverifiable pair. All entries are net_new (no PoC ground_truth fold file exists
  for vllm v0_21_0).
  Strategy-B gain over an entry-point walk: the declarative Literal/enum field
  constraints (cache_dtype, prefix_caching_hash_algo, MaxLoRARanks, scheduler
  policy/runner_type, structured-outputs backend, kv/ec/weight-transfer backends,
  attention/mamba backend enums, moe_backend, offload backend, parallel
  data_parallel_backend/expert_placement_strategy/dcp_comm_backend,
  compilation mode/cache-save-format, multimodal cache/tp-mode, profiler kind,
  online-quant scheme enum) that pydantic typing enforces and that never appear as
  an explicit raise on any call path.

