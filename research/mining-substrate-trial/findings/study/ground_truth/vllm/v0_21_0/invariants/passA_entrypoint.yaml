methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/vllm/v0_21_0/invariants/passA_methodology.md
scope_notes: |
  Entry-point / call-graph walk of vLLM 0.21.0 from the public surface a
  benchmark harness constructs: vllm.LLM(...) -> EngineArgs -> create_engine_config
  -> per-aspect vllm.config.* dataclasses; vllm.SamplingParams(...) and
  vllm.PoolingParams(...) plus nested params (StructuredOutputsParams,
  RepetitionDetectionParams). Source version confirmed via vllm/_version.py
  (__version__ = '0.21.0').

  All entries are provenance=net_new: there is NO PoC ground truth for v0_21_0
  (only v0_19_1 and v0_7_3 exist under findings/ground_truth/vllm/), so nothing
  was folded. Content was re-derived independently from the 0.21.0 source.

  An invariant = a predicate that makes a config/params object VALID or INVALID
  at construction time. Severities: error (raises), warning (warn + usually
  normalise), dormant (needs GPU/platform/model-dir/distributed/tokenizer so it
  cannot replay on a CPU-only source host). outcome: invalid | warn | normalise.

  CPU-replay model: kwargs_positive SHOULD trigger the rule; kwargs_negative
  should NOT. They construct the named native_type CPU-only (pure pydantic /
  dataclass validation). Most vllm.config.* leaf dataclasses (CacheConfig,
  LoRAConfig, SchedulerConfig, PoolerConfig, StructuredOutputsConfig,
  KVTransferConfig, ECTransferConfig, OffloadConfig, ObservabilityConfig,
  MultiModalConfig, EPLBConfig, CompilationConfig, ProfilerConfig,
  KVEventsConfig, AttentionConfig, KernelConfig, DeviceConfig, LoadConfig) and
  SamplingParams/PoolingParams are constructor-replayable. ModelConfig,
  SpeculativeConfig, VllmConfig and the cross-config checks in
  create_engine_config / platform check_and_update_config need a resolved
  ModelConfig (HF config load -> model dir) or a CUDA/ROCm/XPU platform and are
  marked dormant.

  Notable 0.21.0 shifts vs the v0_19_1 cell: SchedulerConfig.max_model_len /
  is_encoder_decoder are now InitVars consumed by __post_init__, so the
  verify_max_model_len cross-checks ARE CPU-replayable here (pass max_model_len=
  as a constructor kwarg) rather than dormant. PoolerConfig gained
  pooling_type/seq_pooling_type/tok_pooling_type Literals and several new
  __post_init__ raises (logit_bias/logit_mean, logit_scale/logit_sigma,
  divide-by-zero, pooling-type conflicts). CacheConfig.gpu_memory_utilization
  default moved 0.9 -> 0.92 (constraint gt=0 le=1 unchanged). New configs walked:
  MambaConfig, ProfilerConfig, OffloadConfig (restructured), AttentionConfig,
  KernelConfig, KVEventsConfig.

