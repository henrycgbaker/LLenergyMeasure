established_at: '2026-06-07'
established_by: opus-passA-vllm-0.20.0
methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/vllm/v0_20_0/invariants/passA_methodology.md
scope_notes: |
  Entry-point / call-graph walk of vLLM 0.20.0 from the public surface a
  benchmark harness constructs: vllm.LLM(...) -> EngineArgs/AsyncEngineArgs ->
  create_engine_config -> the per-aspect vllm.config.* dataclasses, plus
  vllm.SamplingParams(...) -> __post_init__ -> _verify_args and the nested
  StructuredOutputsParams / RepetitionDetectionParams.
  An invariant = a construction-time predicate that makes a config VALID or
  INVALID. Severities: error (raise) / warning (logger.warning|warning_once|
  warnings.warn, construction still succeeds) / dormant (needs a GPU/platform/
  model-dir/resolved-config and cannot be replayed CPU-only and source-only) /
  normalise (silent mutation, no raise/warn).
  No PoC ground-truth file exists for v0_20_0
  (research/mining-substrate-trial/findings/ground_truth/vllm/v0_20_0/
  invariants_ground_truth.yaml is absent), so every entry is provenance:
  net_new. Each predicate was re-derived against the v0_20_0 source; nothing was
  copied from the v0_19_1 cell without re-reading the v0_20_0 line.
  kwargs_positive SHOULD fire (raise/warn); kwargs_negative should NOT. They are
  constructor-replayable against the named native_type CPU-only unless marked
  dormant. native_type is a dotted importable path the gate constructs:
  vllm.SamplingParams, vllm.config.<Class>, or dotted vllm.<module>.<Class>.

invariants:

