schema_version: ground_truth/1.0.0
engine: vllm
engine_version: 0.20.0
venv_src_root: /tmp/vllm-0.20.0/vllm
pass: B
strategy: class-hierarchy / type-tree walk
established_at: '2026-06-07'
established_by: opus-passB-vllm-0.20.0
methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/vllm/v0_20_0/invariants/passB_methodology.md
scope_notes: |
  Strategy B (class-hierarchy / type-tree walk) over vLLM 0.20.0
  (version.py / _version.py confirm __version__ == '0.20.0'). The config surface in
  vllm/config/*.py (modular package), vllm/sampling_params.py, vllm/pooling_params.py
  was enumerated by TYPE rather than by call path. For every pydantic dataclass
  (decorated with @config = pydantic.dataclasses.dataclass, extra="forbid") and every
  msgspec.Struct param class, the following were harvested: Literal/Enum-typed field
  membership rules; inline Field(gt/ge/le/lt) numeric constraints; @field_validator /
  @model_validator bodies (every raise / logger.warning); __post_init__ (model_post_init)
  checks; from-string enum coercion (Enum[value.upper()]) that raises on unknown.
  An invariant = a rule that makes a config VALID or INVALID at construction.
  native_type is a DOTTED IMPORTABLE PATH (vllm.SamplingParams, vllm.config.<Class>,
  vllm.sampling_params.<Class>) so the gate can construct it directly. kwargs_positive
  SHOULD fire the predicate; kwargs_negative should NOT. Pairs are emitted ONLY where the
  rule is reachable at plain CPU-only construction (single-field declarative constraints,
  standalone-model validators, post_inits with all-defaultable fields). Rules that are
  GPU-gated, env-gated, model-dir-gated, or only reachable at a later lifecycle method
  carry dormant_reason and no kwargs rather than a fabricated unverifiable pair.
  No PoC ground truth exists for v0_20_0 (neither findings/study/ground_truth/vllm/v0_20_0
  nor findings/ground_truth/vllm/v0_20_0), so every invariant here is provenance net_new.
  Strategy-B-specific gain over an entry-point walk: the declarative Literal/Enum field
  constraints (cache dtypes, MoE backend, mamba backend, attention backend, plugin-style
  Literals) enforced purely by pydantic typing that never appear as an explicit raise on
  any call path, and the dead-raise observations (kv_role / ec_role get_args checks that
  are now Literal-shadowed; EPLBConfig single-member policy).
invariants:

