scope_notes:
- |
  Strategy A starts from public user entry points (LLM(...) construction ->
  LlmArgs.from_kwargs; SamplingParams(...); nested config fields) and follows the
  call graph to every validation site reachable at config construction time.
- |
  An invariant = a predicate that makes a config VALID or INVALID. We emit
  error / warning / normalisation / dormant severities. Normalisation silently
  mutates (no raise/warn); dormant needs a GPU/SM/engine-dir/ckpt-dir/model-dir
  or a deferred call so it cannot be replayed by plain CPU construction.
- |
  0.20.0 is structurally one minor BELOW 0.21 and far below the 1.2.1 PoC GT.
  There is a SINGLE LlmArgs class (no Torch/Trt split, no _TorchLLM kwargs-reject
  gate). LlmArgs subclasses pydantic BaseModel; the installed pydantic is v2
  (2.12.x) so field-level Literal validators run at cls(**kwargs) and the
  v1-style @validator import is the pydantic-v2 compatibility shim. There is no
  @field_validator / @model_validator anywhere in llm_args.py; the only
  @validator is on LookaheadDecodingConfig. SamplingParams / QuantConfig /
  LoraConfig / CalibConfig-adjacent dataclasses are plain dataclasses (no top_p /
  top_k / temperature range checks exist at 0.20). PluginConfig is a slots
  dataclass driven by PluginConfigMeta that wraps each _field as a property whose
  setter asserts; all fields are init=False so validation fires on attribute
  assignment, not on the constructor. QuantConfig allowlists are lazy: the
  asserts live in QuantMode.from_quant_algo and only fire when the .quant_mode /
  .layer_quant_mode cached_property is accessed, never at QuantConfig(...).
- |
  Every entry is provenance: net_new. There is no 0.20.0 PoC ground truth to
  fold from; the schema, predicate_kind taxonomy and field conventions are
  matched exactly to the 1.2.1 passA_entrypoint.yaml (schema/conventions only).
- |
  predicate_kind taxonomy (matched to 1.2.1): literal_in, strenum_in, range,
  type_is, file_exists, presence_conflict, allowlist_constant, assert_positive,
  decode_dispatch.
- |
  kwargs_positive SHOULD trigger the rule; kwargs_negative should NOT. They are
  runtime-replayable against the named native_type's constructor unless the entry
  is marked dormant (host-dependent / deferred / lazy) or needs a real dir.
- |
  The 0.20 LlmArgs.model_post_init (llm_args.py:969) calls
  torch.cuda.get_device_properties(0) UNCONDITIONALLY, so the whole
  LlmArgs.from_kwargs path requires a CUDA device. The gate runs --gpus all, so
  it exercises that path; the SM<80 bfloat16 guard is therefore reachable but
  outcome depends on the host SM and is flagged dormant for portability.

invariants:

