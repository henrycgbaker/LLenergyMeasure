# --- LlmArgs model_post_init: SM<80 bfloat16 guard (GPU-gated) ---

- id: tensorrt_llmArgs_dtype_bfloat16_sm_lt_80
  provenance: net_new
  native_type: tensorrt.LlmArgs
  native_field: LlmArgs.dtype
  predicate_kind: range
  predicate_value: {context: "torch.cuda.get_device_properties(0).major < 8 AND dtype == 'bfloat16'"}
  severity: error
  outcome: invalid
  message_template: "Pre SM 80 GPUs do not support bfloat16"
  citation: {file: tensorrt_llm/llmapi/llm_args.py, line: 973, qualname: LlmArgs.model_post_init}
  notes: |
    model_post_init unconditionally calls torch.cuda.get_device_properties(0)
    (line 969); when device major < 8 and dtype=='auto' it normalises to
    'float16', and dtype=='bfloat16' raises RuntimeError. The gate runs
    --gpus all so the CUDA call succeeds, but the raise only fires on a pre-SM-80
    host; flagged dormant for SM portability.
  dormant_reason: requires a CUDA device with compute capability major < 8

