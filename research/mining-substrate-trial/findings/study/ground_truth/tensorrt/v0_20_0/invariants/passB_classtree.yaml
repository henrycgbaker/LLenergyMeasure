scope_notes:
- Strategy B enumerates the config surface by TYPE, walking the class hierarchy /
  MRO of every config/args/params model as it exists in tensorrt-llm 0.20.0
  (version.py confirms __version__ == "0.20.0"). For each class in the MRO every
  field-level Literal/enum membership rule, every Field(ge/gt/le/lt) constraint,
  every @validator / @field_validator / @model_validator body, __init__ /
  __post_init__ / model_post_init check, dataclass-property setter assert, and any
  reachable raise/assert/logger.warning was extracted. Recursion descends into
  nested sub-models.
- An invariant = a rule that makes a config VALID or INVALID at construction (or,
  for class-tree mechanisms, at the lifecycle point noted in dormant_reason).
- predicate_kind taxonomy matches the 1.2.1 and 0.21.0 ground truth
  (literal_in, strenum_in, range, type_is, file_exists, presence_conflict,
  mutual_exclusion_soft, allowlist_constant, assert_positive, decode_dispatch,
  backend_dispatch).
- outcome is "invalid" for an error/raise/assert severity, "valid_with_warning"
  for a warn severity, "meta" for catalogue-completeness self-checks.
- native_type names the owning pydantic/dataclass type so the gate can construct
  it directly. kwargs_positive = the FIRING / invalid case; kwargs_negative = the
  VALID case. Pairs are emitted only where safe to replay on a CPU host (no model
  download, no CUDA query, no filesystem state, no env dependence). Cross-field /
  GPU-gated / build-time / property-access-time / construction-side-effect rules
  carry a dormant_reason note and no kwargs.
- provenance "fold" = a rule whose 0.21.0 / 1.2.1 passB analogue exists in the
  template and whose 0.20.0 form was re-derived and re-cited from 0.20.0 source.
  provenance "net_new" = a class-tree constraint not in the template OR a
  0.20.0-only mechanism.
- |
  0.20.0-vs-0.21.0 API summary (full list in methodology): the headline diff is
  that 0.20.0 has a SINGLE monolithic LlmArgs(BaseModel) class with
  model_config extra="allow". 0.21.0 split this into
  BaseLlmArgs -> TrtLlmArgs / TorchLlmArgs -> _AutoDeployLlmArgs (extra="forbid").
  Consequently every 0.21.0 BaseLlmArgs / TrtLlmArgs / TorchLlmArgs /
  _AutoDeployLlmArgs rule collapses onto LlmArgs in 0.20.0, and rules that exist
  ONLY in the later split (cuda_graph validators, moe_load_balancer validators,
  load_format LoadFormat-enum override, _AutoDeployLlmArgs Literals,
  validate_gpus_per_node before-validator) are ABSENT in 0.20.0.
- |
  Further 0.20.0-vs-0.21.0 deltas: 0.20.0 uses pydantic v1 @validator (the only
  pydantic validator in llm_args.py is LookaheadDecodingConfig.validate_positive_values).
  There is NO validate_speculative_config validator: the speculative
  max_draft_len>0 asserts live in LlmArgs._setup() (a method called from
  from_kwargs, NOT at pydantic construction), and the "Speculative config type not
  recognized" raise is also in _setup. There is NO
  validate_build_config_with_runtime_params validator: the build-config override is
  a logger.warning inside _maybe_update_config_for_consistency (a staticmethod) and
  _setup (warn on conflict), NOT a raise. There is NO validate_model_format_misc
  validator (the TLLM_ENGINE build_config-ignored warning is inline in _setup).
  DecodingBaseConfig.from_dict dispatches only 4 keys (MTP/Medusa/Eagle/Lookahead;
  0.21.0 added NGram/DraftTarget -> 6, 1.2.1 -> 9). The speculative_config Union
  has 4 members (Lookahead/Medusa/Eagle/MTP). KvCacheConfig / CacheTransceiverConfig
  / SamplingParams range checks, QuantConfig.__post_init__, PluginConfig
  pydantic-Literal migration are all 0.21.0+/1.2.1+ and absent here, exactly as in
  0.21.0. QuantAlgo has 20 members (0.21.0: 21, 1.2.1: 26).
- |
  Strategy-B-specific gain over an entry-point walk: the declarative Literal/enum
  field constraints (PluginConfig property-setter allowlists, CalibConfig.device,
  tokenizer_mode / load_format Literals, BatchingType / CapacitySchedulerPolicy /
  ContextChunkingPolicy enums) enforced by pydantic typing or dataclass-property
  asserts and never surfaced as an explicit raise on the public construction path;
  plus the LookaheadDecodingConfig.validate_positive_values validator and the
  LoraConfig / QuantConfig dataclass asserts that the entry-point walk reaches only
  indirectly.

