scope_notes:
- Strategy A starts from public user entry points (LLM(...) construction ->
  BaseLLM.__init__ -> llm_args_cls.from_kwargs; SamplingParams(...);
  KvCacheConfig/decoding configs as nested fields) and follows the call graph
  to every validation site reachable at config construction time.
- An invariant = a predicate that makes a config VALID or INVALID. We emit
  error / warning / normalisation / dormant severities. Normalisation =
  silently mutates (no raise/warn); dormant = needs GPU/SM/engine/ckpt host
  so it cannot be replayed on a CPU-only source host.
- "provenance fold = confirmed identical to the PoC ground truth (reused);
  net_new = surfaced by this entry-point walk and absent from the PoC GT."
- predicate_kind taxonomy inherited from the PoC GT - literal_in, strenum_in,
  range, type_is, file_exists, presence_conflict, mutual_exclusion_soft,
  allowlist_constant, assert_positive, decode_dispatch, backend_dispatch.
- kwargs_positive SHOULD trigger the rule; kwargs_negative should NOT. They
  are runtime-replayable against the named native_type's constructor unless
  the entry is marked dormant (host-dependent) or requires a real model dir.

