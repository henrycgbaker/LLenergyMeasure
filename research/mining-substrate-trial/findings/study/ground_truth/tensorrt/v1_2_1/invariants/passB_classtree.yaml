scope_notes:
- Strategy B enumerates the config surface by TYPE. Every pydantic BaseModel /
  StrictBaseModel / dataclass reachable from the tensorrt_llm public config
  surface (BaseLlmArgs, TrtLlmArgs, TorchLlmArgs, and every nested sub-model)
  was walked, and for each class every field-level Literal/enum membership rule,
  every Field(ge/gt/le/lt) constraint, every @field_validator / @model_validator
  body, __init__/__post_init__/model_post_init check, and any raise/warn was
  extracted. Recursion descends into nested sub-models.
- An invariant = a rule that makes a config VALID or INVALID at construction.
- predicate_kind taxonomy is identical to the PoC ground truth
  (literal_in, strenum_in, range, type_is, file_exists, presence_conflict,
  mutual_exclusion_soft, allowlist_constant, assert_positive, decode_dispatch,
  backend_dispatch).
- outcome is "invalid" for an error/raise severity, "valid_with_warning" for a
  warn severity, "meta" for catalogue-completeness self-checks.
- native_type names the owning pydantic/dataclass type so the gate can construct
  it directly. kwargs_positive SHOULD trigger the predicate; kwargs_negative
  should NOT. Pairs are only emitted where they are safe to replay on a CPU host
  (no model download, no CUDA query, no filesystem state). Cross-field /
  GPU-gated / construction-side-effect rules carry no kwargs (left to a richer
  fixture or GPU gate) rather than fabricating an unverifiable pair.
- "Strategy-B-specific gain over an entry-point walk: the declarative
  Literal/enum field constraints (plugin dtype Literals, allreduce_strategy,
  CacheTransceiver Field(gt=0), etc.) that are enforced by pydantic typing and
  never appear as an explicit raise in any call path."

