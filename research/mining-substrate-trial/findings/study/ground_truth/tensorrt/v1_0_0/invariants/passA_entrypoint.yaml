  citation: {file: tensorrt_llm/quantization/mode.py, line: 331, qualname: QuantMode.from_quant_algo}
  notes: |
    CRITICAL 1.0.0 difference: QuantConfig (models/modeling_utils.py:128) is a
    PLAIN @dataclasses.dataclass with NO __post_init__ and NO pydantic coercion.
