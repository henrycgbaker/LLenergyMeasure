# ============================================================================

- id: tensorrt_LLM_pytorch_rejects_trt_specific_kwargs
  provenance: net_new
  native_type: tensorrt.LLM
  native_field: LLM.__init__.kwargs
  predicate_kind: presence_conflict
  predicate_value: {reject_keys_in: "set(TrtLlmArgs.model_fields) - set(TorchLlmArgs.model_fields)"}
  severity: error
  outcome: invalid
  message_template: "The following arguments are specific to TensorRT backend and cannot be used with PyTorch backend: {trtllm_specific_args}."
  citation:
    file: tensorrt_llm/llmapi/llm.py
    line: 1090
    qualname: _TorchLLM._validate_args_for_torch_backend
  notes: |
    The default public LLM (tensorrt_llm.LLM == _TorchLLM) is PyTorch-backed and
    rejects any TRT-only kwarg before LlmArgs construction. First user-facing
    gate in the entry-point call graph. TRT-only fields include enable_build_cache,
    batching_type, build_config, auto_parallel, calib_config, quant_config,
    embedding_parallel_mode, fast_build, enable_prompt_adapter,
    normalize_log_probs, extended_runtime_perf_knob_config.
  kwargs_positive: {model: "facebook/opt-125m", enable_build_cache: true}
  kwargs_negative: {model: "facebook/opt-125m", tensor_parallel_size: 1}

- id: tensorrt_LLM_rejects_unknown_kwarg
  provenance: net_new
  native_type: tensorrt.LLM
  native_field: LLM.__init__.kwargs
  predicate_kind: presence_conflict
  predicate_value: {reject_keys_not_in: "set(llm_args_cls.model_fields) | {_mpi_session, backend}"}
  severity: error
  outcome: invalid
  message_template: "{cls} got invalid argument: {key}"
  citation:
    file: tensorrt_llm/llmapi/llm.py
    line: 146
    qualname: BaseLLM.__init__
  notes: |
    Reachable for both the Torch and TRT public LLM. Any kwarg not in the
    resolved args model (plus _mpi_session/backend) raises before from_kwargs.
  kwargs_positive: {model: "facebook/opt-125m", __not_a_real_arg__: 1}
  kwargs_negative: {model: "facebook/opt-125m", tensor_parallel_size: 1}
  dormant_reason: full LLM construction proceeds into BaseLlmArgs (needs CUDA); replay via LLM ctor in the GPU container

