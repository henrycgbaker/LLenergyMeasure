scope_notes:
- Strategy A starts from public user entry points (LLM(...) construction ->
  _TorchLLM.__init__ -> _validate_args_for_torch_backend -> BaseLLM.__init__ ->
  llm_args_cls.from_kwargs; SamplingParams(...); the nested config models as
  fields) and follows the call graph to every validation site reachable at
  config construction time.
- An invariant = a predicate that makes a config VALID or INVALID. Severities
  are error / warning / normalisation. Normalisation = silently mutates with no
  raise/warn. dormant = needs GPU/SM/engine-dir/ckpt-dir/model-dir/file/object
  so it cannot be replayed from pure kwargs.
- There is NO PoC ground truth for 1.0.0, so every entry is provenance=net_new
  (derived directly from the 1.0.0 source; nothing copied from 1.2.1).
- 'IMPORTANT replay-environment note. 1.0.0 BaseLlmArgs.validate_dtype
  (llm_args.py line 1373) calls torch.cuda.get_device_properties(0)
  UNCONDITIONALLY for EVERY construction, and validate_gpus_per_node
  (llm_args.py:1383) calls torch.cuda.device_count(). Therefore ANY
  TorchLlmArgs / TrtLlmArgs construction requires a live CUDA device even to
  PASS. The downstream gate replays in a real 1.0.0 container with --gpus all,
  so kwargs on the args models ARE replayable there; they are NOT replayable on
  a CPU-only host. Standalone nested configs (CudaGraphConfig, MoeConfig,
  CalibConfig, LookaheadDecodingConfig, TorchCompileConfig, the *DecodingConfig
  family, SamplingParams, GuidedDecodingParams, LoraConfig) construct without
  CUDA and replay anywhere.'
- 'predicate_kind taxonomy (same vocabulary as the 1.2.1 template): literal_in,
  strenum_in, range, type_is, file_exists, presence_conflict,
  mutual_exclusion_soft, allowlist_constant, assert_positive, decode_dispatch,
  backend_dispatch.'
- kwargs_positive SHOULD trigger the rule (firing / invalid case);
  kwargs_negative should NOT (valid case). Entries marked dormant_reason omit
  replay kwargs (the gate skips them); from_dict-dispatched entries carry
  replay_via.

