scope_notes:
- Strategy B enumerates the config surface by TYPE. Every pydantic BaseModel /
  StrictBaseModel / dataclass reachable from the tensorrt_llm 1.0.0 public config
  surface (BaseLlmArgs, TrtLlmArgs, TorchLlmArgs, and every nested sub-model)
  was walked, and for each class every field-level Literal/enum membership rule,
  every Field(ge/gt/le/lt) constraint, every @field_validator / @model_validator
  body, __init__/__post_init__/model_post_init check, and any raise/assert/warn
  was extracted. Recursion descends into nested sub-models.
- An invariant = a rule that makes a config VALID or INVALID at construction.
- predicate_kind taxonomy is identical to the 1.2.1 pass-B ground truth
  (literal_in, strenum_in, range, type_is, file_exists, presence_conflict,
  assert_positive, decode_dispatch, backend_dispatch, allowlist_constant).
- outcome is "invalid" for an error/raise severity, "valid_with_warning" for a
  warn severity, "meta" for catalogue-completeness self-checks.
- native_type names the owning pydantic/dataclass type so the gate can construct
  it directly. kwargs_positive SHOULD trigger the predicate (the FIRING/invalid
  case); kwargs_negative should NOT (the VALID case). Pairs are only emitted where
  they are safe to replay on a CPU host (no model download, no CUDA query, no
  filesystem state). Cross-field / GPU-gated / construction-side-effect rules carry
  no kwargs (a richer fixture or the GPU gate owns them) rather than fabricating an
  unverifiable pair.
- 1.0.0 is a MUCH earlier release than 1.2.1 (llm_args.py is 2441 lines vs 3416).
  Many 1.2.1 config classes and validators DO NOT EXIST yet at 1.0.0. The walk was
  re-derived entirely from 1.0.0 source; rules absent at 1.0.0 are recorded in the
  methodology delta, not emitted here.
- "Strategy-B-specific gain over an entry-point walk at 1.0.0: the declarative
  Literal/enum field constraints (MoeConfig.backend, CalibConfig.device,
  CacheTransceiverConfig.backend, the TorchLlmArgs.allreduce_strategy beta Literal,
  the BatchingType/CapacitySchedulerPolicy/ContextChunkingPolicy pybind StrEnums)
  enforced by pydantic typing and never appearing as an explicit raise in any call
  path; plus the LoraConfig.lora_ckpt_source __post_init__ assert and the
  QuantAlgo StrEnum membership that an entry-point walk on the TRT path skips."

