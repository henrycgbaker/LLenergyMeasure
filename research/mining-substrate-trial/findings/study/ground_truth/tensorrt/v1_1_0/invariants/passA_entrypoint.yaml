schema_version: ground_truth/1.0.0
engine: tensorrt
engine_version: "1.1.0"
engine_git_tag: v1.1.0
venv_src_root: /tmp/trt-llm-1.1.0/tensorrt_llm
pass: A
strategy: entry-point / call-graph walk
established_at: '2026-06-06'
established_by: opus-passA-1.1.0
methodology_ref: research/mining-substrate-trial/findings/study/ground_truth/tensorrt/v1_1_0/invariants/passA_methodology.md

scope_notes:
- Strategy A starts from public user entry points (tensorrt_llm.LLM(...) ->
  _TorchLLM.__init__ -> _validate_args_for_torch_backend(kwargs) -> BaseLLM.__init__
  -> llm_args_cls.from_kwargs; SamplingParams(...); KvCacheConfig / CudaGraphConfig /
  TorchCompileConfig / decoding configs as nested fields) and follows the call graph
  to every validation site reachable at config construction time.
- An invariant = a predicate that makes a config VALID or INVALID. We emit
  error / warning / normalisation / dormant severities. Normalisation =
  silently mutates (no raise/warn); dormant = needs GPU/SM/engine/ckpt/model dir
  so it cannot be replayed on a CPU-only source host.
- provenance fold = catalogued by the already-mined v1_2_1 Pass A AND confirmed
  present (re-derived) in 1.1.0 source; net_new = surfaced by this 1.1.0 walk and
  has no v1_1_0 PoC GT (there is NO PoC GT for 1.1.0, so EVERY entry here is
  technically net_new for 1.1.0; we use provenance to mark whether the same
  predicate also exists in the 1.2.1 sibling - fold - or is genuinely 1.1.0-local).
- predicate_kind taxonomy inherited from the 1.2.1 GT - literal_in, strenum_in,
  range, type_is, file_exists, presence_conflict, allowlist_constant,
  assert_positive, decode_dispatch, backend_dispatch.
- kwargs_positive is the FIRING / invalid case; kwargs_negative is the VALID case.
  Both are runtime-replayable against the named native_type's constructor unless
  marked dormant (host-dependent) or annotated replay_via (from_dict classmethod).
- |
  1.1.0-vs-window notes. (a) PluginConfig is a NON-pydantic @dataclass(slots=True)
  with assert-based property setters (DEFAULT_PLUGIN_DTYPE_OPTIONS allowlist), NOT
  pydantic Literals - this is the pre-pydantic stage; (b) LoraConfig is a
  @dataclass(DictConversion) with a __post_init__ assert, not a pydantic Literal;
  (c) QuantConfig is a plain @dataclass (no construction-time enum validation);
  (d) SamplingParams._validate has NO top_p/top_k/temperature range checks (those
  arrive at 1.2.1); (e) CacheTransceiverConfig.backend Literal has 4 members
  (DEFAULT/UCX/NIXL/MPI), no MOONCAKE, and there is NO timeout Field(gt=0);
  (f) validate_build_config_with_runtime_params RAISES ValueError for
  max_batch_size/max_num_tokens over build_config, and only WARNS for
  max_seq_len/max_beam_width/max_input_len (the over-shoot raise was later
  softened to warn-only by 1.2.1); (g) EagleDecodingConfig uses .validate()
  ("Draft model must be provided for EAGLE"), there is no validate_eagle_config /
  max_draft_len-required / dynamic-tree raise yet; (h) DecodingBaseConfig has NO
  acceptance_window / acceptance_length_threshold / draft_len_schedule validators
  yet; (i) no BaseSparseAttentionConfig, no Nvfp4GemmConfig, no RayPlacementConfig,
  no validate_helix, no validate_misc, no custom_tokenizer in 1.1.0.
- |
  DORMANT BaseLlmArgs note. validate_dtype and validate_gpus_per_node call
  torch.cuda.* unconditionally at construction, so ANY TorchLlmArgs/TrtLlmArgs
  field-level kwargs replay needs a CUDA host. The gate runs --gpus all so the
  args-model Literals/validators still fire; entries whose PREDICATE is itself
  SM/engine/ckpt-gated are additionally marked dormant_reason.

invariants:

# ============================================================================
# ENTRY-POINT GATE (tensorrt_llm.LLM == _TorchLLM)
# ============================================================================

- id: tensorrt_LLM_pytorch_rejects_trt_specific_kwargs
  provenance: fold
  native_type: tensorrt.LLM
  native_field: LLM.__init__.kwargs
  predicate_kind: presence_conflict
  predicate_value: {reject_keys_in: "set(TrtLlmArgs.model_fields) - set(TorchLlmArgs.model_fields)"}
  severity: error
  outcome: invalid
  message_template: "The following arguments are specific to TensorRT backend and cannot be used with PyTorch backend: {trtllm_specific_args}."
  citation:
    file: tensorrt_llm/llmapi/llm.py
    line: 1031
    qualname: _TorchLLM._validate_args_for_torch_backend
  notes: |
    The default public LLM (tensorrt_llm.LLM == _TorchLLM) is PyTorch-backed and
    rejects any TRT-only kwarg before LlmArgs construction. First user-facing gate
    in the entry-point call graph. enable_build_cache, batching_type, build_config,
    auto_parallel etc. are TRT-only fields in 1.1.0.
  kwargs_positive: {model: "facebook/opt-125m", enable_build_cache: true}
  kwargs_negative: {model: "facebook/opt-125m", tensor_parallel_size: 1}

