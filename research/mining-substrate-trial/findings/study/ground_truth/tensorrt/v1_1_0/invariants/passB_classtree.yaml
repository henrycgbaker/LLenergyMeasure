scope_notes:
- Strategy B enumerates the tensorrt-llm 1.1.0 config surface by TYPE, not by call
  path. Every pydantic StrictBaseModel / dataclass / StrEnum reachable from the
  public config classes (BaseLlmArgs, TrtLlmArgs, TorchLlmArgs and every nested
  sub-model) was read in 1.1.0 source, and for each class every field-level
  Literal / StrEnum membership rule, every Field(ge/gt/le/lt), every
  @field_validator / @model_validator body, __init__/__post_init__/model_post_init
  check, from_dict dispatch, and supports_backend override was extracted.
- An invariant = a rule that makes a config VALID or INVALID at construction.
- predicate_kind taxonomy matches the 1.2.1 pass-B catalogue (literal_in,
  strenum_in, range, type_is, file_exists, presence_conflict, decode_dispatch,
  backend_dispatch, assert_positive, allowlist_constant).
- outcome is "invalid" for error/raise, "valid_with_warning" for warn, "meta" for
  catalogue-completeness self-checks.
- >-
  provenance - "fold" = the same rule exists in the mined 1.2.1 pass-B catalogue
  (re-derived here against 1.1.0 source, lines/messages are 1.1.0's own);
  "net_new" = a class-tree rule the entry-point walk structurally misses.
- >-
  WHERE 1.1.0 SITS (1.0.0 < 1.1.0 < 1.2.1). 1.1.0 already has - MoeConfig.backend
  Literal, KvCacheConfig.mamba_ssm_cache_dtype Literal + max_gpu_total_bytes
  validator, guided_decoding_backend Literal, LoadFormat enum with VISION_ONLY,
  TorchCompileConfig validators, attention_dp / batch_wait / stream_interval
  validators, allreduce_strategy Literal. 1.1.0 does NOT yet have (these are
  1.2.1-new and are therefore ABSENT here) - PluginConfig pydantic-isation +
  per-field Literals (1.1.0 PluginConfig is a plain @dataclass with assert-based
  setters), SamplingParams top_p/top_k/temperature range checks, CacheTransceiver
  timeout Field(gt=0), Nvfp4GemmConfig, MoeLoadBalancerConfig.setup divisibility,
  RayPlacementConfig, orchestrator_type Literal, BaseSparseAttentionConfig family,
  SaveHiddenStates decoding, DecodingBaseConfig acceptance_window /
  acceptance_length_threshold / draft_len_schedule validators, KvCacheConfig
  free_gpu_memory_fraction validator, LoraConfig pydantic Literal lora_ckpt_source,
  HELIX cp_config check, ray_worker_extension_cls / ray_placement_config checks,
  NVFP4_AWQ QuantAlgo member.
- >-
  KEY BEHAVIOUR DELTA vs 1.2.1 - validate_build_config_with_runtime_params lives on
  BaseLlmArgs in 1.1.0 (not TrtLlmArgs) and RAISES ValueError when max_batch_size or
  max_num_tokens exceed build_config (the 1.0.0-style hard error); 1.2.1 demoted
  those two to warn/clamp. max_seq_len / max_beam_width / max_input_len are
  warn-only in both.

