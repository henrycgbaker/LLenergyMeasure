- id: tensorrt_BaseLLM_rejects_unknown_kwarg
  provenance: net_new
  native_type: tensorrt.LLM
  native_field: BaseLLM.__init__.kwargs
  predicate_kind: presence_conflict
  predicate_value: {reject_key_not_in: "set(llm_args_cls.model_fields) | {_mpi_session, backend}"}
  severity: error
  outcome: invalid
  message_template: "{self.__class__.__name__} got invalid argument: {key}"
  citation:
    file: tensorrt_llm/llmapi/llm.py
    line: 139
    qualname: BaseLLM.__init__
  notes: |
    First user-facing gate in the entry-point call graph. Before LlmArgs
    construction, BaseLLM.__init__ rejects any kwarg whose key is not a model
    field of the dispatched llm_args_cls (plus _mpi_session/backend). NOTE this
    is the 0.21.0 analogue of the 1.2.1 TRT-specific-reject, but the 0.21.0
    message is the GENERIC "got invalid argument" (the TRT-vs-Torch kwarg
    partitioning of later versions does not exist at 0.21.0). NOT in the PoC GT.
  dormant_reason: |
    Reaching this gate executes BaseLLM.__init__ which builds full LlmArgs;
    LlmArgs construction triggers validate_dtype -> torch.cuda on a CPU host.
    Real-engine container replay only.

- id: tensorrt_baseLlmArgs_extra_forbid_unknown_field
  provenance: net_new
  native_type: tensorrt.TorchLlmArgs
  native_field: BaseLlmArgs.<unknown_field>
  predicate_kind: presence_conflict
  predicate_value: {model_config_extra: forbid}
  severity: error
  outcome: invalid
  message_template: "Extra inputs are not permitted"
  citation:
    file: tensorrt_llm/llmapi/llm_args.py
    line: 767
    qualname: BaseLlmArgs.model_config
  notes: |
    BaseLlmArgs sets model_config extra='forbid' (llm_args.py:765-768), so any
    unknown field passed directly to the pydantic constructor raises a pydantic
    ValidationError independent of the llm.py kwarg gate. Distinct mechanism
    from BaseLLM.__init__'s pre-check. NEW, not in PoC GT.
  dormant_reason: |
    Constructing the args model triggers validate_dtype -> torch.cuda on CPU.
    Real-engine container replay only.

