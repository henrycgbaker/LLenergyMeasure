scope_notes:
- |
  Strategy A starts from public user entry points (tensorrt_llm.LLM(...) ->
  BaseLLM.__init__ -> llm_args_cls.from_kwargs; SamplingParams(...);
  nested config fields) and follows the call graph to every validation site
  reachable at config construction time, re-derived from 0.21.0 source.
- |
  0.21.0 API SHAPE (differs from 1.2.1) - the default public LLM is the
  TensorRT backend (class LLM(_TrtLLM), llm.py:897), NOT the PyTorch backend.
  llm_args_cls dispatch (llm.py:124-131) - backend=='pytorch' -> TorchLlmArgs,
  '_autodeploy' -> _AutoDeployLlmArgs, else (default) -> TrtLlmArgs.
  LlmArgs is an alias of TrtLlmArgs (llm_args.py:1594).
- |
  An invariant = a predicate that makes a config VALID or INVALID at
  construction time. Severities - error (raise) / warn (logger.warning) /
  normalise (silent mutation).
- |
  CPU-REPLAYABILITY CEILING (0.21.0 specific, critical) - EVERY BaseLlmArgs
  subclass (TorchLlmArgs/TrtLlmArgs/_AutoDeployLlmArgs) carries the
  field_validator validate_dtype (llm_args.py:1050) which calls
  torch.cuda.get_device_properties(0) UNCONDITIONALLY on the always-present
  dtype field. On a CPU-only / no-GPU host this raises before any other
  validator runs, so ALL args-model-level invariants are dormant for pure
  kwargs replay. Standalone nested configs (CalibConfig, LookaheadDecodingConfig,
  KvCacheConfig, SchedulerConfig enums, SamplingParams, GuidedDecodingParams,
  LoraConfig, QuantConfig) construct WITHOUT touching CUDA and are CPU-replayable.
- |
  provenance fold = confirmed present in the 0.21.0 PoC GT and re-resolved
  against the 0.21.0 source read here; net_new = surfaced by this entry-point
  walk and absent from the PoC GT.
- |
  predicate_kind taxonomy inherited from the PoC GT - literal_in, strenum_in,
  range, type_is, file_exists, presence_conflict, mutual_exclusion_soft,
  allowlist_constant, assert_positive, decode_dispatch.
- |
  kwargs_positive SHOULD FIRE the rule (invalid case); kwargs_negative should
  PASS (valid case). Entries needing GPU/SM/engine-dir/ckpt-dir/model-dir or a
  live tokenizer object carry dormant_reason and no replay kwargs.

