scope_notes:
- Strategy B enumerates the config surface by TYPE, walking the class hierarchy /
  MRO of every config/args/params model as it exists in tensorrt-llm 0.21.0
  (version.py confirms __version__ == "0.21.0"). For each class in the MRO every
  field-level Literal/enum membership rule, every Field(ge/gt/le/lt) constraint,
  every @field_validator / @model_validator body, __init__/__post_init__/
  model_post_init check, dataclass-property setter assert, and any reachable
  raise/assert/logger.warning was extracted. Recursion descends into nested
  sub-models.
- An invariant = a rule that makes a config VALID or INVALID at construction (or,
  for class-tree mechanisms, at the lifecycle point noted in dormant_reason).
- predicate_kind taxonomy matches the 1.2.1 ground truth
  (literal_in, strenum_in, range, type_is, file_exists, presence_conflict,
  mutual_exclusion_soft, allowlist_constant, assert_positive, decode_dispatch,
  backend_dispatch).
- outcome is "invalid" for an error/raise severity, "valid_with_warning" for a
  warn severity, "meta" for catalogue-completeness self-checks.
- native_type names the owning pydantic/dataclass type so the gate can construct
  it directly. kwargs_positive = the FIRING / invalid case; kwargs_negative = the
  VALID case. Pairs are emitted only where safe to replay on a CPU host (no model
  download, no CUDA query, no filesystem state, no env dependence). Cross-field /
  GPU-gated / build-time / property-access-time / construction-side-effect rules
  carry a dormant_reason note and no kwargs.
- provenance "fold" = a rule whose 1.2.1 analogue exists in the passB_classtree
  template and that is also present (re-derived from 0.21.0 source) here.
  provenance "net_new" = a class-tree constraint not in the 1.2.1 template OR a
  0.21.0-only mechanism.
- |
  0.21.0-vs-later API summary (full list in methodology): config models extend
  plain pydantic BaseModel (BaseLlmArgs uses model_config extra=forbid; nested
  sub-models do NOT - extra fields allowed). DecodingBaseConfig.from_dict has 6
  keys (no SaveState/UserProvided/AUTO) and DecodingBaseConfig carries NO
  acceptance_window / acceptance_length_threshold / draft_len_schedule validators.
  KvCacheConfig has NO Python field validators (free_gpu_memory_fraction etc. are
  C++-side only) and no dtype / mamba_ssm_cache_dtype fields. CacheTransceiverConfig
  has only max_num_tokens (no backend Literal, no timeout Field(gt=0) fields).
  SamplingParams._validate has only best_of/greedy/truncate checks (no top_p /
  top_k / temperature range). PluginConfig is a dataclass(slots=True) whose
  metaclass wraps every field as a property enforcing an allowlist via assert in
  the setter (1.2.1 migrated these to pydantic Literals). QuantConfig and
  LoraConfig are plain dataclasses, not pydantic. The speculative-config dispatch
  lives in one validate_speculative_config on BaseLlmArgs (1.2.1 split it across
  TrtLlmArgs/TorchLlmArgs). validate_build_config_with_runtime_params RAISES on
  max_batch_size / max_num_tokens > build_config (1.2.1 warns/clamps).
- |
  Strategy-B-specific gain over an entry-point walk: the declarative
  Literal/enum field constraints (PluginConfig property-setter allowlists,
  CalibConfig.device, _AutoDeployLlmArgs Literals, BatchingType/Capacity/Chunking
  enums) enforced by pydantic typing or dataclass-property asserts and never
  surfaced as an explicit raise on the public construction path; plus subclasses
  the entry-point walk does not route to (_AutoDeployLlmArgs).

