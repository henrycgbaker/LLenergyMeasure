- id: tensorrt_llmargs_validate_capture_num_tokens_non_positive
  engine: tensorrt
  library: tensorrt
  invariant_under_test: capture_num_tokens must contain positive integers.
  severity: error
  native_type: tensorrt.TorchCompileConfig
  miner_source:
    path: llm_args.py
    method: validate_capture_num_tokens
    line_at_scan: 200
  match:
    engine: tensorrt
    fields:
      tensorrt.capture_num_tokens:
        present: true
        not_equal:
        - 1
  kwargs_positive:
    capture_num_tokens:
    - -1
    - 0
  kwargs_negative:
    capture_num_tokens:
    - 1
    - 2
  added_by: llm_lenient_reparse
- id: tensorrt_llmargs_validate_torch_compile_max_num_streams_zero
  engine: tensorrt
  library: tensorrt
  invariant_under_test: torch_compile_config.max_num_streams must be >= 1.
  severity: error
  native_type: tensorrt.TorchCompileConfig
  miner_source:
    path: llm_args.py
    method: validate_torch_compile_max_num_streams
    line_at_scan: 250
  match:
    engine: tensorrt
    fields:
      tensorrt.torch_compile_max_num_streams:
        <: 1
  kwargs_positive:
    torch_compile_max_num_streams: 0
  kwargs_negative:
    torch_compile_max_num_streams: 1
  added_by: llm_lenient_reparse
- id: tensorrt_llmargs_validate_load_balancer_config_file_not_found
  engine: tensorrt
  library: tensorrt
  invariant_under_test: MoE load balancer config file must exist.
  severity: error
  native_type: tensorrt.TorchLlmArgs
  miner_source:
    path: llm_args.py
    method: validate_load_balancer
    line_at_scan: 500
  match:
    engine: tensorrt
    fields:
      tensorrt.moe_config.load_balancer:
        not_equal: /path/to/nonexistent/file
  kwargs_positive:
    moe_config__load_balancer: /path/to/nonexistent/file
  kwargs_negative:
    moe_config__load_balancer: /path/to/existent/file
  added_by: llm_lenient_reparse
- id: tensorrt_llmargs_validate_cuda_graph_config_batch_sizes_and_max_batch_size
  engine: tensorrt
  library: tensorrt
  invariant_under_test: If cuda_graph_config.batch_sizes is provided, cuda_graph_config.max_batch_size
    must be 0.
  severity: error
  native_type: tensorrt.TorchLlmArgs
  miner_source:
    path: llm_args.py
    method: validate_cuda_graph_config
    line_at_scan: 550
  match:
    engine: tensorrt
    fields:
      tensorrt.cuda_graph_config.batch_sizes:
        present: true
      tensorrt.cuda_graph_config.max_batch_size:
        '>': 0
  kwargs_positive:
    cuda_graph_config__batch_sizes:
    - 1
    - 2
    cuda_graph_config__max_batch_size: 1
  kwargs_negative:
    cuda_graph_config__batch_sizes: []
    cuda_graph_config__max_batch_size: 0
  added_by: llm_lenient_reparse
- id: tensorrt_llmargs_sync_quant_config_with_kv_cache_config_dtype_invalid
  engine: tensorrt
  library: tensorrt
  invariant_under_test: Cannot sync quant_config.kv_cache_quant_algo with kv_cache_config.dtype
    of 'auto'.
  severity: warning
  native_type: tensorrt.TorchLlmArgs
  miner_source:
    path: llm_args.py
    method: sync_quant_config_with_kv_cache_config_dtype
    line_at_scan: 600
  match:
    engine: tensorrt
    fields:
      tensorrt.kv_cache_config.dtype:
        present: true
        exact: auto
  kwargs_positive:
    kv_cache_config__dtype: auto
  kwargs_negative:
    kv_cache_config__dtype: fp8
  added_by: llm_lenient_reparse
- id: tensorrt_llmargs_validate_attention_dp_config_enable_balance_invalid_values
  engine: tensorrt
  library: tensorrt
  invariant_under_test: If attention_dp_config.enable_balance is true, attention_dp_config.batching_wait_iters
    and timeout_iters must be >= 0.
  severity: error
  native_type: tensorrt.TorchLlmArgs
  miner_source:
    path: llm_args.py
    method: validate_attention_dp_config
    line_at_scan: 650
  match:
    engine: tensorrt
    fields:
      tensorrt.attention_dp_config.enable_balance: true
      tensorrt.attention_dp_config.batching_wait_iters:
        <: 0
      tensorrt.attention_dp_config.timeout_iters:
        <: 0
  kwargs_positive:
    attention_dp_config__enable_balance: true
    attention_dp_config__batching_wait_iters: -1
    attention_dp_config__timeout_iters: -1
  kwargs_negative:
    attention_dp_config__enable_balance: false
    attention_dp_config__batching_wait_iters: 0
    attention_dp_config__timeout_iters: 0
  added_by: llm_lenient_reparse
