invariants:
- id: tensorrt_field_status_validation
  engine: tensorrt
  library: tensorrt
  invariant_under_test: Validates that Field.status is one of 'prototype', 'beta',
    or 'deprecated'.
  severity: error
  native_type: tensorrt.Field
  miner_source:
    path: llm_args.py
    method: Field
    line_at_scan: 10
  match:
    engine: tensorrt
    fields:
      tensorrt.Field.status:
        present: true
        not_in:
        - prototype
        - beta
        - deprecated
  kwargs_positive:
    default: None
    status: invalid
  kwargs_negative:
    default: None
    status: beta
  added_by: llm_lenient_reparse
- id: tensorrt_llmargs_validate_speculative_config_supports_backend
  engine: tensorrt
  library: tensorrt
  invariant_under_test: speculative_config.supports_backend(backend)
  severity: error
  native_type: tensorrt.TrtLlmArgs
  miner_source:
    path: llm_args.py
    method: validate_speculative_config
    line_at_scan: 1234
  match:
    engine: tensorrt
    fields:
      tensorrt.backend:
        present: true
  kwargs_positive:
    speculative_config: null
    backend: pytorch
  kwargs_negative:
    speculative_config: null
    backend: _autodeploy
  added_by: llm_wg_extend_kwargs
