invariants:
- id: tensorrt_kvcacheconfig_validate_max_attention_window_not_list_or_empty
  engine: tensorrt
  library: tensorrt
  invariant_under_test: max_attention_window must be a non-empty list of positive
    integers
  severity: error
  native_type: tensorrt.KvCacheConfig
  miner_source:
    path: llm_args.py
    method: validate_max_attention_window
    line_at_scan: 59
  match:
    engine: tensorrt
    fields:
      tensorrt.max_attention_window:
        present: true
        not_in: []
  kwargs_positive:
    max_attention_window: []
  kwargs_negative:
    max_attention_window:
    - 1
  added_by: llm_wg_extend_kwargs
- id: tensorrt_basellmargs_validate_dtype_not_supported
  engine: tensorrt
  library: tensorrt
  invariant_under_test: dtype 'bfloat16' is not supported on pre SM 80 GPUs
  severity: error
  native_type: tensorrt.BaseLlmArgs
  miner_source:
    path: llm_args.py
    method: validate_dtype
    line_at_scan: 83
  match:
    engine: tensorrt
    fields:
      tensorrt.dtype:
        present: true
        type_is_not:
        - bfloat16
  kwargs_positive:
    dtype: bfloat16
  kwargs_negative:
    dtype: float16
  added_by: llm_wg_extend_kwargs
- id: tensorrt_torchcompileconfig_validate_capture_num_tokens_lt
  engine: tensorrt
  library: tensorrt
  invariant_under_test: capture_num_tokens must contain positive integers
  severity: error
  native_type: TorchCompileConfig
  miner_source:
    path: llm_args.py
    method: validate_capture_num_tokens
    line_at_scan: 30
  match:
    engine: tensorrt
    fields:
      tensorrt.capture_num_tokens:
        <: 0
  kwargs_positive:
    capture_num_tokens:
    - 0
  kwargs_negative:
    capture_num_tokens:
    - 1
  added_by: llm_wg_extend
- id: tensorrt_torchllmargs_validate_ray_worker_extension_cls_not_supported
  engine: tensorrt
  library: tensorrt
  invariant_under_test: ray_worker_extension_cls is only supported with orchestrator_type='ray'
  severity: error
  native_type: TorchLlmArgs
  miner_source:
    path: llm_args.py
    method: validate_ray_worker_extension_cls
    line_at_scan: 100
  match:
    engine: tensorrt
    fields:
      tensorrt.ray_worker_extension_cls:
        present: true
      tensorrt.orchestrator_type:
        not_equal: ray
  kwargs_positive:
    ray_worker_extension_cls: null
    orchestrator_type: invalid
  kwargs_negative:
    ray_worker_extension_cls: null
    orchestrator_type: ray
  added_by: llm_wg_extend
- id: tensorrt_torchllmargs_validate_ray_placement_config_not_supported
  engine: tensorrt
