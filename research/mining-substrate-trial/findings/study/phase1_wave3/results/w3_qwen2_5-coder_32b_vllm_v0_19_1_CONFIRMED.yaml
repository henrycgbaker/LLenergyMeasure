  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: presence_penalty must be in [-2, 2].
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.sampling.presence_penalty:
        not_in:
        - -2
        - -1.5
        - -1
        - 0
        - 1
        - 1.5
        - 2
  kwargs_positive:
