- id: vllm_parallel_data_parallel_size_local_gt_data_parallel_size
  ckey:
  - data_parallel_size_local
  - numeric
  - data_parallel_size
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: data_parallel_size_local must be <= data_parallel_size.
  native_type: vllm.ParallelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_size_local:
        '>': data_parallel_size
  kwargs_positive:
    data_parallel_size_local: 4
    data_parallel_size: 3
  kwargs_negative:
    data_parallel_size_local: 2
    data_parallel_size: 3
  observed_outcome: error
  error: ''
- id: vllm_parallel_data_parallel_external_lb_dp_le_1
  ckey:
  - data_parallel_external_lb
  - exact
  - '[data_parallel_external_lb,data_parallel_size]'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: data_parallel_external_lb can only be set when data_parallel_size
    > 1.
  native_type: vllm.ParallelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_external_lb: true
      vllm.engine.data_parallel_size:
        <=: 1
  kwargs_positive:
    data_parallel_external_lb: true
    data_parallel_size: 1
  kwargs_negative:
    data_parallel_external_lb: false
    data_parallel_size: 2
  observed_outcome: error
  error: ''
- id: vllm_parallelconfig_data_parallel_rank_out_of_range
  ckey:
  - data_parallel_rank
  - membership
  - '[data_parallel_rank,data_parallel_size]'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: data_parallel_rank must be in the range [0, data_parallel_size).
  native_type: vllm.ParallelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_rank:
        present: true
        not_in:
        - 0
      vllm.engine.data_parallel_size: 2
  kwargs_positive:
    data_parallel_rank: 2
    data_parallel_size: 2
    pipeline_parallel_size: 1
    tensor_parallel_size: 1
    prefill_context_parallel_size: 1
  kwargs_negative:
    data_parallel_rank: 0
    data_parallel_size: 2
    pipeline_parallel_size: 1
    tensor_parallel_size: 1
    prefill_context_parallel_size: 1
  observed_outcome: error
  error: ''
- id: vllm_loraconfig_max_cpu_loras_must_be_ge_max_loras
  ckey:
  - max_cpu_loras
  - numeric
  - vllm.engine.max_loras
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: max_cpu_loras must be >= max_loras.
  native_type: vllm.LoRAConfig
  match:
    engine: vllm
    fields:
      vllm.engine.max_cpu_loras:
        <: vllm.engine.max_loras
  kwargs_positive:
    max_cpu_loras: 2
    max_loras: 3
  kwargs_negative:
    max_cpu_loras: 3
    max_loras: 2
  observed_outcome: error
  error: ''
