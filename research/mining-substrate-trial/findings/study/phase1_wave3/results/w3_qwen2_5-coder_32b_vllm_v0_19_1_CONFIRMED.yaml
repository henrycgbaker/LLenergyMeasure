confirmed:
- id: vllm_structuredoutputsparams___post_init___mutually_exclusive_fields
  ckey:
  - json
  - presence
  - '[json,regex]'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: Only one kind of structured outputs constraint can be specified.
  native_type: StructuredOutputsParams
  match:
    engine: vllm
    fields:
      vllm.sampling.json:
        present: true
      vllm.sampling.regex:
        present: true
  kwargs_positive:
    json: {}
    regex: .*
  kwargs_negative:
    json: {}
  observed_outcome: error
  error: ''
- id: vllm_repetitiondetectionparams___post_init___min_count_ge_two
  ckey:
  - min_count
  - numeric
  - '2'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: min_count must be >=2 to detect repetitive patterns.
  native_type: RepetitionDetectionParams
  match:
    engine: vllm
    fields:
      vllm.engine.min_count:
        <: 2
  kwargs_positive:
    max_pattern_size: 1
    min_count: 1
  kwargs_negative:
    max_pattern_size: 1
    min_count: 2
  observed_outcome: error
  error: ''
- id: vllm_samplingparams___verify_args_presence_penalty_range
