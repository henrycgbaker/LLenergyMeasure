invariants:
- id: engine_sparse_attention_algorithm_required
  engine: tensorrt
  library: tensorrt
  invariant_under_test: Sparse attention algorithm is required
  severity: error
  native_type: tensorrt.BaseSparseAttentionConfig
  miner_source:
    path: llm_args.py
    method: from_dict
    line_at_scan: 40
  match:
    engine: tensorrt
    fields:
      tensorrt.sparse_attention_config.algorithm:
        present: false
  kwargs_positive:
    algorithm: null
  kwargs_negative:
    algorithm: rocket
  added_by: llm_wg_extend_kwargs
- id: engine_sparse_attention_algorithm_valid
  engine: tensorrt
  library: tensorrt
  invariant_under_test: Invalid sparse attention algorithm provided
  severity: error
  native_type: tensorrt.BaseSparseAttentionConfig
  miner_source:
    path: llm_args.py
    method: from_dict
    line_at_scan: 46
  match:
    engine: tensorrt
    fields:
      tensorrt.sparse_attention_config.algorithm:
        not_in:
        - rocket
        - dsa
        - skip_softmax
  kwargs_positive:
    algorithm: invalid
  kwargs_negative:
    algorithm: rocket
  added_by: llm_wg_extend_kwargs
