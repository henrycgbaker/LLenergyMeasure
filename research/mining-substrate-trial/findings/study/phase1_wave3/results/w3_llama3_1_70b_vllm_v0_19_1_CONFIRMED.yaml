confirmed:
- id: vllm_parallelconfig_validate_parallel_config_api_process_rank_ge
  ckey:
  - _api_process_rank
  - numeric
  - '[_api_process_count,_api_process_rank]'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: _api_process_rank >= _api_process_count
  native_type: ParallelConfig
  match:
    engine: vllm
    fields:
      vllm.engine._api_process_rank:
        '>=': 0
      vllm.engine._api_process_count:
        present: true
        not_equal: 0
  kwargs_positive:
    _api_process_rank: 5
    _api_process_count: 3
  kwargs_negative:
    _api_process_rank: 2
    _api_process_count: 3
  observed_outcome: error
  error: ''
- id: vllm_parallelconfig_validate_parallel_config_data_parallel_size_local_gt
  ckey:
  - data_parallel_size_local
  - numeric
  - '[data_parallel_size,data_parallel_size_local]'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: data_parallel_size_local > data_parallel_size
  native_type: ParallelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_size_local:
        '>': 0
      vllm.engine.data_parallel_size:
        present: true
        not_equal: 0
  kwargs_positive:
    data_parallel_size_local: 5
    data_parallel_size: 3
  kwargs_negative:
    data_parallel_size_local: 2
    data_parallel_size: 3
  observed_outcome: error
  error: ''
- id: vllm_parallelconfig___post_init___data_parallel_rank_lt
  ckey:
  - data_parallel_rank
  - numeric
  - '[data_parallel_rank,data_parallel_size]'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: data_parallel_rank must be in the range [0, data_parallel_size)
  native_type: ParallelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_rank:
        <: 0
      vllm.engine.data_parallel_size:
        '>=': 1
  kwargs_positive:
    data_parallel_rank: -1
    data_parallel_size: 2
    pipeline_parallel_size: 1
    tensor_parallel_size: 1
    prefill_context_parallel_size: 1
  kwargs_negative:
    data_parallel_rank: 0
    data_parallel_size: 2
    pipeline_parallel_size: 1
    tensor_parallel_size: 1
    prefill_context_parallel_size: 1
  observed_outcome: error
  error: ''
- id: vllm_loraconfig___validate_lora_config___max_cpu_loras_lt_max_loras
  ckey:
  - max_cpu_loras
  - numeric
  - '[max_cpu_loras,max_loras]'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: max_cpu_loras must be >= max_loras
  native_type: LoRAConfig
  match:
    engine: vllm
    fields:
      vllm.engine.max_cpu_loras:
        <: 0
      vllm.engine.max_loras:
        '>=': 1
  kwargs_positive:
    max_cpu_loras: 1
    max_loras: 2
  kwargs_negative:
    max_cpu_loras: 2
    max_loras: 1
  observed_outcome: error
  error: ''
