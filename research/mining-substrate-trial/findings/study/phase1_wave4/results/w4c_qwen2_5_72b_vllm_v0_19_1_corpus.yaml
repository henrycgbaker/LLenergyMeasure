invariants:
- id: engine_tokenizer_must_be_string
  engine: vllm
  library: vllm
  invariant_under_test: tokenizer must be a string
  severity: error
  native_type: ModelConfig
  miner_source:
    path: model.py
    method: validate_model_config_after
    line_at_scan: 1234
  match:
    engine: vllm
    fields:
      vllm.engine.tokenizer:
        present: true
        type_is_not:
        - str
  kwargs_positive:
    tokenizer: 123
  kwargs_negative:
    tokenizer: valid_tokenizer
  added_by: llm_pure_kwargs
- id: engine_max_model_len_must_be_positive_integer
  engine: vllm
  library: vllm
  invariant_under_test: max_model_len must be a positive integer
  severity: error
  native_type: ModelConfig
  miner_source:
    path: model.py
    method: validate_model_config_after
    line_at_scan: 1235
  match:
    engine: vllm
    fields:
      vllm.engine.max_model_len:
        <: 1
  kwargs_positive:
    max_model_len: -1
  kwargs_negative:
    max_model_len: 2048
  added_by: llm_pure_kwargs
- id: engine_quantization_method_override_mismatch
  engine: vllm
  library: vllm
  invariant_under_test: quantization method specified in the model config does not
    match the quantization method specified in the `quantization` argument
  severity: error
  native_type: ModelConfig
  miner_source:
    path: model.py
    method: _verify_quantization
    line_at_scan: 1236
  match:
    engine: vllm
    fields:
      vllm.engine.quantization:
        present: true
        not_equal: model_config_value
  kwargs_positive:
    quantization: custom_method
  kwargs_negative:
    quantization: model_config_value
  added_by: llm_pure_kwargs
- id: engine_cuda_graph_fallback_for_encoder_decoder_on_rocm
  engine: vllm
  library: vllm
  invariant_under_test: CUDA graph is not supported for encoder-decoder models on
    ROCm, fallback to eager mode
  severity: warning
  native_type: ModelConfig
  miner_source:
    path: model.py
    method: _verify_cuda_graph
    line_at_scan: 1237
  match:
    engine: vllm
    fields:
      vllm.engine.is_encoder_decoder: true
      vllm.engine.enforce_eager: false
      vllm.engine.platform: rocm
  kwargs_positive:
    is_encoder_decoder: true
    enforce_eager: false
    platform: rocm
  kwargs_negative:
    is_encoder_decoder: true
    enforce_eager: true
    platform: rocm
  added_by: llm_pure_kwargs
- id: engine_cuda_graph_fallback_for_bitsandbytes_8bit
  engine: vllm
  library: vllm
  invariant_under_test: CUDA graph is not supported on BitsAndBytes 8bit, fallback
    to the eager mode
  severity: warning
  native_type: ModelConfig
  miner_source:
    path: model.py
    method: _verify_bnb_config
    line_at_scan: 1238
  match:
    engine: vllm
    fields:
      vllm.engine.quantization: bitsandbytes
      vllm.engine.load_in_8bit: true
      vllm.engine.enforce_eager: false
  kwargs_positive:
    quantization: bitsandbytes
    load_in_8bit: true
    enforce_eager: false
  kwargs_negative:
    quantization: bitsandbytes
    load_in_8bit: true
    enforce_eager: true
  added_by: llm_pure_kwargs
- id: engine_gpu_capability_check
  engine: vllm
  library: vllm
  invariant_under_test: Quantization method requires GPU capability >= min_capability
  severity: error
  native_type: VllmConfig
  miner_source:
    path: vllm.py
    method: _get_quantization_config
    line_at_scan: 123
  match:
    engine: vllm
    fields:
      vllm.engine.model_config.quantization:
        present: true
      vllm.engine.load_config:
        present: true
  kwargs_positive:
    model_config:
      quantization: int8
      dtype: float16
    load_config: {}
  kwargs_negative:
    model_config:
      quantization: int8
      dtype: float32
    load_config: {}
  added_by: llm_pure_kwargs
- id: engine_args_compilation_config_dict_to_obj
  engine: vllm
  library: vllm
  invariant_under_test: CompilationConfig is converted from dict if provided as such.
  severity: dormant
  native_type: EngineArgs
  miner_source:
    path: file=arg_utils.py
    method: __post_init__
    line_at_scan: 12345
  match:
    engine: vllm
    fields:
      vllm.engine.compilation_config:
        present: true
        type_is_not:
        - CompilationConfig
  kwargs_positive:
    compilation_config:
      cudagraph_capture_sizes:
      - 1024
      max_cudagraph_capture_size: 2048
  kwargs_negative:
    compilation_config: null
  added_by: llm_construct_grounded
