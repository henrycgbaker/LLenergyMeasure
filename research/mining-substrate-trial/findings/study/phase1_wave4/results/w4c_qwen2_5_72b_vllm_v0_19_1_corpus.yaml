- id: engine_check_concurrent_partial_prefill
  engine: vllm
  library: vllm
  invariant_under_test: Concurrent Partial Prefills are not supported
  severity: error
  native_type: EngineArgs
  miner_source:
    path: arg_utils.py
    method: _check_feature_supported
    line_at_scan: 10
  match:
    engine: vllm
    fields:
      vllm.engine.max_num_partial_prefills:
        present: true
        not_equal: 1
      vllm.engine.max_long_partial_prefills:
        present: true
        not_equal: 1
  kwargs_positive:
    max_num_partial_prefills: 2
    max_long_partial_prefills: 2
  kwargs_negative:
    max_num_partial_prefills: 1
    max_long_partial_prefills: 1
  added_by: llm_construct_grounded
- id: engine_check_pipeline_parallelism_support
  engine: vllm
  library: vllm
  invariant_under_test: Pipeline Parallelism requires supported distributed executor
    backend
  severity: error
  native_type: EngineArgs
  miner_source:
    path: arg_utils.py
    method: _check_feature_supported
    line_at_scan: 18
  match:
    engine: vllm
    fields:
      vllm.engine.pipeline_parallel_size:
        '>': 1
      vllm.engine.distributed_executor_backend:
        present: true
        not_in:
        - ray
        - mp
        - external_launcher
  kwargs_positive:
    pipeline_parallel_size: 2
    distributed_executor_backend: unsupported_backend
  kwargs_negative:
    pipeline_parallel_size: 2
    distributed_executor_backend: ray
  added_by: llm_construct_grounded
- id: engine_set_default_chunked_prefill_and_prefix_caching_args
  engine: vllm
  library: vllm
  invariant_under_test: Default chunked prefill and prefix caching settings are applied
    if not set
  severity: dormant
  native_type: EngineArgs
  miner_source:
    path: arg_utils.py
    method: _set_default_chunked_prefill_and_prefix_caching_args
    line_at_scan: 50
  match:
    engine: vllm
    fields:
      vllm.engine.enable_chunked_prefill:
        present: true
        not_equal: null
      vllm.engine.enable_prefix_caching:
        present: true
        not_equal: null
  kwargs_positive:
    enable_chunked_prefill: false
    enable_prefix_caching: false
  kwargs_negative:
    enable_chunked_prefill: null
    enable_prefix_caching: null
  added_by: llm_construct_grounded
