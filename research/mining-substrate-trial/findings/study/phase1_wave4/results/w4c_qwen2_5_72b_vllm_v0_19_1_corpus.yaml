    is True.
  severity: dormant
  native_type: EngineArgs
  miner_source:
    path: file=arg_utils.py
    method: __post_init__
    line_at_scan: 12345
  match:
    engine: vllm
    fields:
      vllm.engine.model:
        present: true
  kwargs_positive:
