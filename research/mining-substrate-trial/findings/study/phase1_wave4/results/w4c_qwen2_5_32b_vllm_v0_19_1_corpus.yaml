  invariant_under_test: Ensure max_pattern_size and min_pattern_size are non-negative
    with min_pattern_size <= max_pattern_size.
  severity: error
  native_type: RepetitionDetectionParams
  miner_source:
    path: sampling_params.py
    method: __post_init__
    line_at_scan: 25
  match:
    engine: vllm
    fields:
      vllm.sampling.max_pattern_size:
        <: 0
      vllm.sampling.min_pattern_size:
        '>=': 0
        <: vllm.sampling.max_pattern_size
  kwargs_positive:
    max_pattern_size: -1
    min_pattern_size: 1
  kwargs_negative:
    max_pattern_size: 5
    min_pattern_size: 3
  added_by: llm_pure_kwargs
