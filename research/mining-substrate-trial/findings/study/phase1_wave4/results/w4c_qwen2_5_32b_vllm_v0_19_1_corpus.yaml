- id: engine_structured_outputs_mutually_exclusive_constraints
  engine: vllm
  library: vllm
  invariant_under_test: Ensure only one kind of structured outputs constraint is specified.
  severity: error
  native_type: StructuredOutputsParams
  miner_source:
    path: sampling_params.py
    method: __post_init__
    line_at_scan: 10
  match:
    engine: vllm
    fields:
      vllm.sampling.json:
        present: true
      vllm.sampling.regex:
        present: true
        not_equal: null
  kwargs_positive:
    json: '{}'
    regex: .*
  kwargs_negative:
    json: '{}'
  added_by: llm_pure_kwargs
- id: engine_repetition_detection_pattern_size_bounds
