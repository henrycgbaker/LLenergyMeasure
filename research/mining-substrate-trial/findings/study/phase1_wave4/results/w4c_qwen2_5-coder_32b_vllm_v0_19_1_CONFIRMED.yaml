confirmed:
- id: structured_outputs_params_mutually_exclusive_constraints
  ckey:
  - json
  - presence
  - '[json,regex]'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: Only one kind of structured outputs constraint can be specified.
  native_type: StructuredOutputsParams
  match:
    engine: vllm
    fields:
      vllm.sampling.json:
        present: true
      vllm.sampling.regex:
        present: true
  kwargs_positive:
    json: {}
    regex: .*
  kwargs_negative:
    json: {}
  observed_outcome: error
  error: ''
- id: repetition_detection_params_max_pattern_size_non_negative
  ckey:
  - max_pattern_size
  - numeric
  - '0'
  cross_field_heuristic: true
  n_match_fields: 2
  invariant_under_test: max_pattern_size must be >=0.
  native_type: RepetitionDetectionParams
  match:
    engine: vllm
    fields:
      vllm.sampling.max_pattern_size:
        <: 0
  kwargs_positive:
    max_pattern_size: -1
  kwargs_negative:
    max_pattern_size: 0
  observed_outcome: error
  error: ''
- id: sampling_params_stop_token_ids_list_of_ints
