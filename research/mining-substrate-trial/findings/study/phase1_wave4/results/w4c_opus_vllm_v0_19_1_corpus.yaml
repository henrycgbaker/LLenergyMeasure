invariants:
- added_by: opus_construct
  engine: vllm
  id: vllm_sampling_n_min
  invariant_under_test: n must be at least 1
  kwargs_negative:
    n: 1
  kwargs_positive:
    n: 0
  match:
    engine: vllm
    fields:
      vllm.sampling.n:
        <: 1
  native_type: vllm.SamplingParams
  severity: error
- added_by: opus_construct
  engine: vllm
  id: vllm_sampling_n_greedy_must_be_one
  invariant_under_test: when temperature is ~0 (greedy), n must be 1 (cross-field)
  kwargs_negative:
    n: 2
    temperature: 1.0
  kwargs_positive:
    n: 2
    temperature: 0.0
  match:
    engine: vllm
    fields:
      vllm.sampling.n:
        '>': 1
      vllm.sampling.temperature:
        <: 1.0e-05
  native_type: vllm.SamplingParams
  severity: error
