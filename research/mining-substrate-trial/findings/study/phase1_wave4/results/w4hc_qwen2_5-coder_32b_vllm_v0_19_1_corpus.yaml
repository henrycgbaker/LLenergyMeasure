invariants:
- id: vllm_structuredoutputsparams_mutually_exclusive_fields
  invariant_under_test: Only one kind of structured outputs constraint can be specified.
  native_type: StructuredOutputsParams
  match:
    engine: vllm
    fields:
      vllm.engine.json:
        present: true
      vllm.engine.regex:
        present: true
      vllm.engine.choice:
        present: true
      vllm.engine.grammar:
        present: true
      vllm.engine.json_object:
        present: true
      vllm.engine.structural_tag:
        present: true
  kwargs_positive:
    json: '{"key": "value"}'
    regex: pattern
  kwargs_negative:
    json: '{"key": "value"}'
  added_by: llm_multistage
- id: vllm_repetitiondetectionparams_min_pattern_size_le_max_pattern_size
  invariant_under_test: min_pattern_size must be less than or equal to max_pattern_size.
  native_type: RepetitionDetectionParams
  match:
    engine: vllm
    fields:
      vllm.engine.min_pattern_size:
        <=: vllm.engine.max_pattern_size
  kwargs_positive:
    min_pattern_size: 5
    max_pattern_size: 3
  kwargs_negative:
    min_pattern_size: 3
    max_pattern_size: 5
  added_by: llm_multistage
- id: vllm_repetitiondetectionparams_min_count_ge_2_if_max_pattern_size_gt_0
  invariant_under_test: min_count must be greater than or equal to 2 if max_pattern_size
    is greater than 0.
  native_type: RepetitionDetectionParams
  match:
    engine: vllm
    fields:
      vllm.engine.min_count:
        '>=': 2
      vllm.engine.max_pattern_size:
        '>': 0
  kwargs_positive:
    min_count: 1
    max_pattern_size: 5
  kwargs_negative:
    min_count: 2
    max_pattern_size: 5
  added_by: llm_multistage
- id: vllm_samplingparams_seed_none_if_minus_one
  invariant_under_test: seed is set to None if it is -1.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.seed:
        not_equal: -1
  kwargs_positive:
    seed: -1
  kwargs_negative:
    seed: 42
  added_by: llm_multistage
- id: vllm_samplingparams_output_text_buffer_length_calculated_if_stop_and_not_include_stop_str_in_output
  invariant_under_test: output_text_buffer_length is calculated if stop is provided
    and include_stop_str_in_output is False.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.output_text_buffer_length:
        present: true
      vllm.engine.stop:
        present: true
      vllm.engine.include_stop_str_in_output:
        not_equal: true
  kwargs_positive:
    stop:
    - stop_token
    include_stop_str_in_output: false
    output_text_buffer_length: null
  kwargs_negative:
    stop:
    - stop_token
    include_stop_str_in_output: false
    output_text_buffer_length: 10
  added_by: llm_multistage
- id: vllm_samplingparams_logprobs_non_negative_or_minus_one
  invariant_under_test: logprobs must be non-negative or -1.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.logprobs:
        '>=': -1
  kwargs_positive:
    logprobs: -2
  kwargs_negative:
    logprobs: 5
  added_by: llm_multistage
- id: vllm_samplingparams_prompt_logprobs_non_negative_or_minus_one
  invariant_under_test: prompt_logprobs must be non-negative or -1.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.prompt_logprobs:
        '>=': -1
  kwargs_positive:
    prompt_logprobs: -2
  kwargs_negative:
    prompt_logprobs: 5
  added_by: llm_multistage
- id: vllm_samplingparams_stop_does_not_contain_empty_string
  invariant_under_test: stop cannot contain an empty string.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.stop:
        not_equal: ''
  kwargs_positive:
    stop:
    - ''
  kwargs_negative:
    stop:
    - stop_token
  added_by: llm_multistage
- id: vllm_samplingparams_detokenize_true_if_stop_provided
  invariant_under_test: detokenize must be True if stop is provided.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.detokenize:
        present: true
      vllm.engine.stop:
        present: true
  kwargs_positive:
    stop:
    - stop_token
    detokenize: false
  kwargs_negative:
    stop:
    - stop_token
    detokenize: true
  added_by: llm_multistage
- id: vllm_samplingparams_n_equals_one_if_temperature_zero
  invariant_under_test: n must be 1 when using greedy sampling (temperature is zero).
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.n:
        equal: 1
      vllm.engine.temperature:
        equal: 0.0
  kwargs_positive:
    n: 2
    temperature: 0.0
  kwargs_negative:
    n: 1
    temperature: 0.0
  added_by: llm_multistage
- id: vllm_samplingparams_logit_bias_within_vocabulary_range
  invariant_under_test: logit_bias token IDs must be within the vocabulary range.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.logit_bias:
        present: true
  kwargs_positive:
    logit_bias:
      100000: 2.0
  kwargs_negative:
    logit_bias:
      5000: 2.0
  added_by: llm_multistage
- id: vllm_samplingparams_allowed_token_ids_within_vocabulary_range
  invariant_under_test: allowed_token_ids must be within the vocabulary range.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.allowed_token_ids:
        present: true
  kwargs_positive:
    allowed_token_ids:
    - 100000
  kwargs_negative:
    allowed_token_ids:
    - 5000
  added_by: llm_multistage
- id: vllm_samplingparams_min_p_zero_if_logit_bias_provided
  invariant_under_test: min_p must be zero if logit_bias is provided.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.min_p:
        equal: 0.0
      vllm.engine.logit_bias:
        present: true
  kwargs_positive:
    min_p: 0.5
    logit_bias:
      5000: 2.0
  kwargs_negative:
    min_p: 0.0
    logit_bias:
      5000: 2.0
  added_by: llm_multistage
- id: vllm_samplingparams_logit_bias_not_supported_with_spec_decode
  invariant_under_test: logit_bias is not supported with speculative decoding.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.logit_bias:
        not_equal: true
      vllm.engine.speculative_config:
        present: true
  kwargs_positive:
    logit_bias:
      5000: 2.0
    speculative_config: SpeculativeConfig()
  kwargs_negative:
    logit_bias: null
    speculative_config: SpeculativeConfig()
  added_by: llm_multistage
- id: vllm_samplingparams_structured_outputs_backend_matches_initialization
  invariant_under_test: Request-level structured output backend selection is not supported.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.structured_outputs._backend:
        present: true
      vllm.engine.structured_outputs_config.backend:
        not_equal: vllm.engine.structured_outputs._backend
  kwargs_positive:
    structured_outputs: StructuredOutputsParams(_backend='guidance')
    structured_outputs_config: StructuredOutputsConfig(backend='auto')
  kwargs_negative:
    structured_outputs: StructuredOutputsParams(_backend='guidance')
    structured_outputs_config: StructuredOutputsConfig(backend='guidance')
  added_by: llm_multistage
- id: vllm_samplingparams_structured_outputs_choice_not_empty_list
  invariant_under_test: structured_outputs.choice cannot be an empty list.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.structured_outputs.choice:
        not_equal: []
  kwargs_positive:
    structured_outputs: StructuredOutputsParams(choice=[])
  kwargs_negative:
    structured_outputs: StructuredOutputsParams(choice=['choice1'])
  added_by: llm_multistage
- id: vllm_modelconfig_language_model_only_type_is_not
  invariant_under_test: language_model_only must be a boolean.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.language_model_only:
        type_is_not: bool
  kwargs_positive:
    language_model_only: not_a_boolean
  kwargs_negative:
    language_model_only: true
  added_by: llm_multistage
- id: vllm_modelconfig_limit_mm_per_prompt_type_is_not
  invariant_under_test: limit_mm_per_prompt must be a dictionary with string keys
    and integer or dictionary values.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.limit_mm_per_prompt:
        type_is_not: dict
  kwargs_positive:
    limit_mm_per_prompt: not_a_dict
  kwargs_negative:
    limit_mm_per_prompt:
      key: 123
  added_by: llm_multistage
- id: vllm_modelconfig_enable_mm_embeds_type_is_not
  invariant_under_test: enable_mm_embeds must be a boolean.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.enable_mm_embeds:
        type_is_not: bool
  kwargs_positive:
    enable_mm_embeds: not_a_boolean
  kwargs_negative:
    enable_mm_embeds: true
  added_by: llm_multistage
- id: vllm_modelconfig_media_io_kwargs_type_is_not
  invariant_under_test: media_io_kwargs must be a dictionary with string keys and
    dictionary values.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.media_io_kwargs:
        type_is_not: dict
  kwargs_positive:
    media_io_kwargs: not_a_dict
  kwargs_negative:
    media_io_kwargs:
      key: {}
  added_by: llm_multistage
- id: vllm_modelconfig_mm_processor_kwargs_type_is_not
  invariant_under_test: mm_processor_kwargs must be a dictionary.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.mm_processor_kwargs:
        type_is_not: dict
  kwargs_positive:
    mm_processor_kwargs: not_a_dict
  kwargs_negative:
    mm_processor_kwargs: {}
  added_by: llm_multistage
- id: vllm_modelconfig_mm_tensor_ipc_enum_constraint
  invariant_under_test: mm_tensor_ipc must be a valid MMTensorIPC enum value.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.mm_tensor_ipc:
        present: true
        not_in: []
  kwargs_positive:
    mm_tensor_ipc: invalid_enum_value
  kwargs_negative:
    mm_tensor_ipc: null
  added_by: llm_multistage
- id: vllm_modelconfig_hf_config_path_present
  invariant_under_test: hf_config_path must be present if it is a string.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.hf_config_path:
        present: true
  kwargs_positive:
    hf_config_path: null
  kwargs_negative:
    hf_config_path: path/to/config
  added_by: llm_multistage
- id: vllm_modelconfig_tokenizer_mode_enum_constraint
  invariant_under_test: tokenizer_mode must be one of the valid enum values.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.tokenizer_mode:
        present: true
        not_in: []
  kwargs_positive:
    tokenizer_mode: invalid_enum_value
  kwargs_negative:
    tokenizer_mode: auto
  added_by: llm_multistage
- id: vllm_modelconfig_runner_enum_constraint
  invariant_under_test: runner must be one of the valid enum values.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.runner:
        present: true
        not_in: []
  kwargs_positive:
    runner: invalid_enum_value
  kwargs_negative:
    runner: auto
  added_by: llm_multistage
- id: vllm_modelconfig_convert_enum_constraint
  invariant_under_test: convert must be one of the valid enum values.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.convert:
        present: true
        not_in: []
  kwargs_positive:
    convert: invalid_enum_value
  kwargs_negative:
    convert: auto
  added_by: llm_multistage
- id: vllm_modelconfig_quantization_enum_constraint
  invariant_under_test: quantization must be one of the valid enum values.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.quantization:
        present: true
        not_in: []
  kwargs_positive:
    quantization: invalid_enum_value
  kwargs_negative:
    quantization: null
  added_by: llm_multistage
- id: vllm_modelconfig_is_moe_expert_parallelism
  invariant_under_test: Number of experts in the model must be greater than 0 when
    expert parallelism is enabled.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.is_moe:
        present: true
      vllm.engine.num_experts:
        '>': 0
  kwargs_positive:
    hf_config:
      is_moe: true
      num_experts: 1
  kwargs_negative:
    hf_config:
      is_moe: false
      num_experts: 0
  added_by: llm_multistage
- id: vllm_modelconfig_dual_chunk_attention_config_sparse_attention_enabled
  invariant_under_test: If sparse attention config is loaded, sparse_attention_enabled
    should be set to True.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.hf_config.dual_chunk_attention_config.sparse_attention_config:
        present: true
      vllm.engine.hf_config.dual_chunk_attention_config.sparse_attention_enabled:
        not_equal: false
  kwargs_positive:
    hf_config:
      dual_chunk_attention_config:
        sparse_attention_config: {}
        sparse_attention_enabled: true
  kwargs_negative:
    hf_config:
      dual_chunk_attention_config:
        sparse_attention_config: {}
        sparse_attention_enabled: false
  added_by: llm_multistage
- id: vllm_modelconfig_total_num_attention_heads_divisible_by_tensor_parallel_size
  invariant_under_test: Total number of attention heads must be divisible by tensor
    parallel size.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.model_arch_config.total_num_attention_heads:
        present: true
      vllm.engine.parallel_config.tensor_parallel_size:
        present: true
        not_equal: 0
  kwargs_positive:
    hf_config:
      model_arch_config:
        total_num_attention_heads: 4
    parallel_config:
      tensor_parallel_size: 2
  kwargs_negative:
    hf_config:
      model_arch_config:
        total_num_attention_heads: 5
    parallel_config:
      tensor_parallel_size: 2
  added_by: llm_multistage
- id: vllm_modelconfig_pipeline_parallelism_supported_models
  invariant_under_test: Pipeline parallelism is only supported for models that implement
    the SupportsPP interface.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.parallel_config.pipeline_parallel_size:
        '>': 1
      vllm.engine.registry.is_pp_supported_model:
        present: true
  kwargs_positive:
    parallel_config:
      pipeline_parallel_size: 2
    hf_config:
      registry:
        is_pp_supported_model: true
  kwargs_negative:
    parallel_config:
      pipeline_parallel_size: 1
    hf_config:
      registry:
        is_pp_supported_model: false
  added_by: llm_multistage
- id: vllm_modelconfig_decode_context_parallelism_gqa_mqa_requirements
  invariant_under_test: Tensor parallel size must be greater than total num kv heads
    and decode context parallel size must be less than or equal to (tensor parallel
    size // total num kv heads) when enabling decode context parallel for GQA/MQA.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.parallel_config.decode_context_parallel_size:
        '>': 1
      vllm.engine.use_mla:
        present: true
        not_equal: false
  kwargs_positive:
    parallel_config:
      decode_context_parallel_size: 2
      tensor_parallel_size: 4
    hf_config:
      use_mla: true
      total_num_kv_heads: 1
  kwargs_negative:
    parallel_config:
      decode_context_parallel_size: 1
      tensor_parallel_size: 2
    hf_config:
      use_mla: false
      total_num_kv_heads: 1
  added_by: llm_multistage
- id: vllm_modelconfig_mm_tensor_ipc_compatibility
  invariant_under_test: mm_tensor_ipc='torch_shm' is not supported with data_parallel_size
    > 1 or tensor_parallel_size > 1 or pipeline_parallel_size > 1.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.multimodal_config.mm_tensor_ipc:
        equal: torch_shm
      vllm.engine.parallel_config.world_size_across_dp:
        '>': 1
  kwargs_positive:
    multimodal_config:
      mm_tensor_ipc: torch_shm
    parallel_config:
      data_parallel_size: 2
  kwargs_negative:
    multimodal_config:
      mm_tensor_ipc: other
    parallel_config:
      data_parallel_size: 2
  added_by: llm_multistage
- id: vllm_modelconfig_multimodal_config_presence_check
  invariant_under_test: The model must be multimodal if multimodal_config is accessed.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.multimodal_config:
        present: true
  kwargs_positive:
    multimodal_config:
      some_key: some_value
  kwargs_negative:
    multimodal_config: null
  added_by: llm_multistage
- id: vllm_modelconfig_generation_config_non_default_values
  invariant_under_test: The generation config should contain non-default values if
    specified.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.generation_config:
        not_equal: vllm
  kwargs_positive:
    generation_config:
      max_length: 50
  kwargs_negative:
    generation_config: null
  added_by: llm_multistage
- id: vllm_modelconfig_pooler_config_task_supported_tasks
  invariant_under_test: The pooling task must be in the list of supported tasks.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.pooler_config.task:
        present: true
  kwargs_positive:
    pooler_config:
      task: supported_task
  kwargs_negative:
    pooler_config: null
  added_by: llm_multistage
- id: vllm_modelconfig_alibi_usage_check
  invariant_under_test: The model should use ALiBi if specified in the configuration.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.hf_text_config.alibi:
        present: true
        not_equal: false
  kwargs_positive:
    hf_text_config:
      alibi: true
  kwargs_negative:
    hf_text_config:
      alibi: false
  added_by: llm_multistage
- id: vllm_modelconfig_use_sep_token_deprecation_check
  invariant_under_test: The use of use_pad_token is deprecated; use use_sep_token
    instead.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.hf_config.use_pad_token:
        present: true
  kwargs_positive:
    hf_config:
      use_pad_token: true
  kwargs_negative:
    hf_config:
      use_sep_token: true
  added_by: llm_multistage
- id: vllm_modelconfig_head_dtype_supported_dtypes_check
  invariant_under_test: The head dtype should be supported by the current platform.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.head_dtype:
        present: true
      vllm.engine.current_platform.supported_dtypes:
        present: true
  kwargs_positive:
    head_dtype: float16
    current_platform:
      supported_dtypes:
      - float16
  kwargs_negative:
    head_dtype: float32
    current_platform:
      supported_dtypes:
      - float16
  added_by: llm_multistage
- id: vllm_modelconfig_valid_dtype_check
  invariant_under_test: The model type should support the specified dtype.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.model_type:
        present: true
      vllm.engine.dtype:
        present: true
  kwargs_positive:
    model_type: model_with_float16
    dtype: float16
  kwargs_negative:
    model_type: model_with_float32
    dtype: float16
  added_by: llm_multistage
- id: vllm_modelconfig_get_and_verify_dtype_check
  invariant_under_test: The dtype should be verified and resolved based on the model
    configuration.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.model_id:
        present: true
      vllm.engine.config:
        present: true
      vllm.engine.dtype:
        present: true
  kwargs_positive:
    model_id: model_with_float16
    config:
      dtype: float16
    dtype: null
  kwargs_negative:
    model_id: model_with_float32
    config:
      dtype: float32
    dtype: float16
  added_by: llm_multistage
- id: vllm_calculate_kv_scales_deprecated
  invariant_under_test: calculate_kv_scales should not be used as it is deprecated.
  native_type: _warn_deprecated_calculate_kv_scales
  match:
    engine: vllm
    fields:
      vllm.engine.calculate_kv_scales:
        present: true
  kwargs_positive:
    calculate_kv_scales: true
  kwargs_negative:
    calculate_kv_scales: false
  added_by: llm_multistage
- id: vllm_scheduler_config_max_model_len_default
  invariant_under_test: max_model_len should default to 8192 if not provided.
  native_type: default_factory
  match:
    engine: vllm
    fields:
      vllm.engine.max_model_len:
        default_value: 8192
  kwargs_positive:
    max_model_len: null
  kwargs_negative:
    max_model_len: 8192
  added_by: llm_multistage
- id: vllm_scheduler_config_is_encoder_decoder_default
  invariant_under_test: is_encoder_decoder should default to False if not provided.
  native_type: default_factory
  match:
    engine: vllm
    fields:
      vllm.engine.is_encoder_decoder:
        default_value: false
  kwargs_positive:
    is_encoder_decoder: null
  kwargs_negative:
    is_encoder_decoder: false
  added_by: llm_multistage
- id: vllm_long_prefill_token_threshold_le_max_model_len
  invariant_under_test: long_prefill_token_threshold should be less than or equal
    to max_model_len.
  native_type: verify_max_model_len
  match:
    engine: vllm
    fields:
      vllm.engine.long_prefill_token_threshold:
        '>': vllm.engine.max_model_len
  kwargs_positive:
    long_prefill_token_threshold: 8193
    max_model_len: 8192
  kwargs_negative:
    long_prefill_token_threshold: 8192
    max_model_len: 8192
  added_by: llm_multistage
- id: vllm_eplb_config_async_default_policy
  invariant_under_test: Async EPLB is only supported with the default policy.
  native_type: _validate_eplb_config
  match:
    engine: vllm
    fields:
      vllm.engine.use_async:
        present: true
        condition:
          vllm.engine.policy: default
  kwargs_positive:
    use_async: true
    policy: custom
  kwargs_negative:
    use_async: true
