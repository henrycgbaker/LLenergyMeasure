- id: vllm_compilation_config_cudagraph_mode_check
  invariant_under_test: compilation_config.cudagraph_mode must be CUDAGraphMode.NONE
    if cudagraph_mode.requires_piecewise_compilation() and mode is not CompilationMode.VLLM_COMPILE.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.compilation_config.cudagraph_mode:
        equal: CUDAGraphMode.NONE
        condition:
          cudagraph_mode_requires_piecewise_compilation: true
          mode_not_equal: CompilationMode.VLLM_COMPILE
  kwargs_positive:
    compilation_config:
      cudagraph_mode: some_other_mode
    additional_config:
      cudagraph_mode_requires_piecewise_compilation: true
      mode: O2
  kwargs_negative:
    compilation_config:
      cudagraph_mode: NONE
    additional_config:
      cudagraph_mode_requires_piecewise_compilation: true
      mode: O2
  added_by: llm_multistage
- id: vllm_compilation_config_fast_moe_cold_start_check
  invariant_under_test: compilation_config.fast_moe_cold_start must be False if HAS_OPAQUE_TYPE
    is True.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.compilation_config.fast_moe_cold_start:
        equal: false
        condition:
          HAS_OPAQUE_TYPE: true
  kwargs_positive:
    compilation_config:
      fast_moe_cold_start: true
    additional_config:
      HAS_OPAQUE_TYPE: true
  kwargs_negative:
    compilation_config:
      fast_moe_cold_start: false
    additional_config:
      HAS_OPAQUE_TYPE: true
  added_by: llm_multistage
- id: vllm_compilation_config_max_cudagraph_capture_size_check
  invariant_under_test: compilation_config.max_cudagraph_capture_size must be 0 if
    model_config.enforce_eager is True.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.compilation_config.max_cudagraph_capture_size:
        equal: 0
        condition:
          enforce_eager: true
  kwargs_positive:
    compilation_config:
      max_cudagraph_capture_size: 1
    model_config:
      enforce_eager: true
  kwargs_negative:
    compilation_config:
      max_cudagraph_capture_size: 0
    model_config:
      enforce_eager: true
  added_by: llm_multistage
- id: vllm_compilation_config_cudagraph_num_of_warmups_check
  invariant_under_test: compilation_config.cudagraph_num_of_warmups must be 1 if model_config.enforce_eager
    is False.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.compilation_config.cudagraph_num_of_warmups:
        equal: 1
        condition:
          enforce_eager: false
  kwargs_positive:
    compilation_config:
      cudagraph_num_of_warmups: 2
    model_config:
      enforce_eager: false
  kwargs_negative:
    compilation_config:
      cudagraph_num_of_warmups: 1
    model_config:
      enforce_eager: false
  added_by: llm_multistage
- id: vllm_cache_config_kv_sharing_fast_prefill_check
  invariant_under_test: cache_config.kv_sharing_fast_prefill must be False if speculative_config.use_eagle()
    is True.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.cache_config.kv_sharing_fast_prefill:
        equal: false
        condition:
          use_eagle: true
  kwargs_positive:
    cache_config:
      kv_sharing_fast_prefill: true
    speculative_config:
      use_eagle: true
  kwargs_negative:
    cache_config:
      kv_sharing_fast_prefill: false
    speculative_config:
      use_eagle: true
  added_by: llm_multistage
- id: vllm_model_config_architecture_check
  invariant_under_test: model_config.architecture must be "WhisperForConditionalGeneration"
    only if VLLM_WORKER_MULTIPROC_METHOD is set to "spawn".
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.model_config.architecture:
        equal: WhisperForConditionalGeneration
        condition:
          env_var: VLLM_WORKER_MULTIPROC_METHOD
          not_equal: spawn
  kwargs_positive:
    model_config:
      architecture: WhisperForConditionalGeneration
    additional_config:
      VLLM_WORKER_MULTIPROC_METHOD: fork
  kwargs_negative:
    model_config:
      architecture: WhisperForConditionalGeneration
    additional_config:
      VLLM_WORKER_MULTIPROC_METHOD: spawn
  added_by: llm_multistage
- id: vllm_kv_events_config_enable_kv_cache_events_check
  invariant_under_test: kv_events_config.enable_kv_cache_events must be True if publisher
    is not "null".
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.kv_events_config.enable_kv_cache_events:
        equal: true
        condition:
          publisher_not_equal: 'null'
  kwargs_positive:
    kv_events_config:
      enable_kv_cache_events: false
    additional_config:
      publisher: some_publisher
  kwargs_negative:
    kv_events_config:
      enable_kv_cache_events: true
    additional_config:
      publisher: some_publisher
  added_by: llm_multistage
- id: vllm_compilation_config_custom_ops_rms_norm_check
  invariant_under_test: compilation_config.custom_ops must contain "+rms_norm" if
    parallel_config.pipeline_parallel_size > 1 or not is_fullgraph.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.compilation_config.custom_ops:
        contains: +rms_norm
        condition:
          pipeline_parallel_size_gt_1_or_not_is_fullgraph: true
  kwargs_positive:
    compilation_config:
      custom_ops:
      - some_other_op
    parallel_config:
      pipeline_parallel_size: 2
  kwargs_negative:
    compilation_config:
      custom_ops:
      - +rms_norm
    parallel_config:
      pipeline_parallel_size: 2
  added_by: llm_multistage
- id: vllm_scheduler_config_max_num_scheduled_tokens_consistency
  invariant_under_test: max_num_scheduled_tokens should be consistent with speculative
    decoding settings.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.scheduler_config.max_num_scheduled_tokens:
        not_equal: 0
  kwargs_positive:
    scheduler_config: Schedu(max_num_scheduled_tokens=0)
  kwargs_negative:
    scheduler_config: Schedu(max_num_scheduled_tokens=1024)
  added_by: llm_multistage
- id: vllm_compilation_config_max_cudagraph_capture_size_gt_zero
  invariant_under_test: max_cudagraph_capture_size should be greater than or equal
    to one when using CUDA graph.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.compilation_config.max_cudagraph_capture_size:
        '>=': 1
  kwargs_positive:
    compilation_config: Compil(max_cudagraph_capture_size=0)
  kwargs_negative:
    compilation_config: Compil(max_cudagraph_capture_size=1)
  added_by: llm_multistage
- id: vllm_compilation_config_cudagraph_capture_sizes_not_empty
  invariant_under_test: cudagraph_capture_sizes should contain at least one element
    when using CUDA graph.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.compilation_config.cudagraph_capture_sizes:
        present: true
        not_in:
        - []
  kwargs_positive:
    compilation_config: Compil(cudagraph_capture_sizes=[])
  kwargs_negative:
    compilation_config: Compil(cudagraph_capture_sizes=[128])
  added_by: llm_multistage
- id: vllm_parallel_config_cp_kv_cache_interleave_size_compatibility
  invariant_under_test: cp_kv_cache_interleave_size should be less than or equal to
    block_size and block_size should be divisible by cp_kv_cache_interleave_size.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.parallel_config.cp_kv_cache_interleave_size:
        <=: vllm.engine.cache_config.block_size
      vllm.engine.cache_config.block_size:
        present: true
  kwargs_positive:
    parallel_config: Parall(cp_kv_cache_interleave_size=128)
    cache_config: CacheC(block_size=64)
  kwargs_negative:
    parallel_config: Parall(cp_kv_cache_interleave_size=64)
    cache_config: CacheC(block_size=128)
  added_by: llm_multistage
- id: vllm_scheduler_config_disable_chunked_mm_input_compatibility
  invariant_under_test: disable_chunked_mm_input should be false in Mamba cache align
    mode.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.scheduler_config.disable_chunked_mm_input:
        present: true
        not_in:
        - true
  kwargs_positive:
    scheduler_config: Schedu(disable_chunked_mm_input=True)
  kwargs_negative:
    scheduler_config: Schedu(disable_chunked_mm_input=False)
  added_by: llm_multistage
- id: vllm_cache_config_mamba_block_size_prefix_caching_compatibility
  invariant_under_test: mamba_block_size can only be set with enable_prefix_caching.
  native_type: VllmConfig
  match:
    engine: vllm
    fields:
      vllm.engine.cache_config.mamba_block_size:
        present: true
      vllm.engine.cache_config.enable_prefix_caching:
        present: true
  kwargs_positive:
    cache_config: CacheC(mamba_block_size=128, enable_prefix_caching=False)
  kwargs_negative:
    cache_config: CacheC(mamba_block_size=128, enable_prefix_caching=True)
  added_by: llm_multistage
- id: vllm_modelconfig_max_logprobs_gt_zero
  invariant_under_test: max_logprobs should be greater than zero.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.max_logprobs:
        '>': 0
  kwargs_positive:
    max_logprobs: -1
  kwargs_negative:
    max_logprobs: 20
  added_by: llm_multistage
- id: vllm_modelconfig_seed_ge_zero
  invariant_under_test: seed should be greater than or equal to zero.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.seed:
        '>=': 0
  kwargs_positive:
    seed: -1
  kwargs_negative:
    seed: 0
  added_by: llm_multistage
- id: vllm_parallelconfig_prefill_context_parallel_size_ge_zero
  invariant_under_test: prefill_context_parallel_size should be greater than or equal
    to zero.
  native_type: ParallelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.prefill_context_parallel_size:
        '>=': 0
  kwargs_positive:
    prefill_context_parallel_size: -1
  kwargs_negative:
    prefill_context_parallel_size: 0
  added_by: llm_multistage
- id: vllm_cacheconfig_block_size_gt_zero
  invariant_under_test: block_size should be greater than zero.
  native_type: CacheConfig
  match:
    engine: vllm
    fields:
      vllm.engine.block_size:
        '>': 0
  kwargs_positive:
    block_size: 0
  kwargs_negative:
    block_size: 16
  added_by: llm_multistage
- id: vllm_engineargs_warning_if_v1_multiprocessing_disabled
  invariant_under_test: If VLLM_ENABLE_V1_MULTIPROCESSING is False, a warning should
    be logged about the global random seed affecting the Python process.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      envs.VLLM_ENABLE_V1_MULTIPROCESSING:
        present: true
        ==: false
      vllm.engine.seed:
        present: true
  kwargs_positive:
    seed: 42
  kwargs_negative:
    seed: null
  added_by: llm_multistage
- id: vllm_engineargs_renderer_num_workers_ge_zero
  invariant_under_test: renderer_num_workers should be greater than or equal to zero
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.renderer_num_workers:
        '>=': 0
  kwargs_positive:
    renderer_num_workers: 4
  kwargs_negative:
    renderer_num_workers: -1
  added_by: llm_multistage
- id: vllm_engineargs_data_parallel_hybrid_lb_headless_guard
  invariant_under_test: data_parallel_hybrid_lb is not applicable in headless mode
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_hybrid_lb:
        present: true
      vllm.engine.headless:
        exact: true
  kwargs_positive:
    data_parallel_hybrid_lb: true
    headless: true
  kwargs_negative:
    data_parallel_hybrid_lb: false
    headless: true
  added_by: llm_multistage
- id: vllm_engineargs_data_parallel_backend_mp_nnodes_guard
  invariant_under_test: nnodes > 1 is only supported with data_parallel_backend=mp
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.nnodes:
        '>': 1
      vllm.engine.data_parallel_backend:
        not_equal: mp
  kwargs_positive:
    nnodes: 2
    data_parallel_backend: ray
  kwargs_negative:
    nnodes: 2
    data_parallel_backend: mp
  added_by: llm_multistage
- id: vllm_engineargs_node_rank_less_than_nnodes_guard
  invariant_under_test: node_rank must be less than nnodes
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.node_rank:
        present: true
      vllm.engine.nnodes:
        '>': 0
  kwargs_positive:
    node_rank: 2
    nnodes: 1
  kwargs_negative:
    node_rank: 0
    nnodes: 1
  added_by: llm_multistage
- id: vllm_engineargs_data_parallel_size_local_one_guard
  invariant_under_test: data_parallel_size_local must be 1 or None when data_parallel_rank
    is set
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_rank:
        present: true
      vllm.engine.data_parallel_size_local:
        not_in:
        - 1
        - null
  kwargs_positive:
    data_parallel_rank: 0
    data_parallel_size_local: 2
  kwargs_negative:
    data_parallel_rank: 0
    data_parallel_size_local: 1
  added_by: llm_multistage
- id: vllm_engineargs_max_num_batched_tokens_presence_check
  invariant_under_test: max_num_batched_tokens must be set by this point
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.max_num_batched_tokens:
        present: false
  kwargs_positive:
    max_num_batched_tokens: null
  kwargs_negative:
    max_num_batched_tokens: 2048
  added_by: llm_multistage
- id: vllm_engineargs_max_num_seqs_presence_check
  invariant_under_test: max_num_seqs must be set by this point
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.max_num_seqs:
        present: false
  kwargs_positive:
    max_num_seqs: null
  kwargs_negative:
    max_num_seqs: 128
  added_by: llm_multistage
- id: vllm_engineargs_enable_chunked_prefill_presence_check
  invariant_under_test: enable_chunked_prefill must be set by this point
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.enable_chunked_prefill:
        present: false
  kwargs_positive:
    enable_chunked_prefill: null
  kwargs_negative:
    enable_chunked_prefill: true
  added_by: llm_multistage
- id: vllm_engineargs_attention_backend_mutual_exclusion
  invariant_under_test: attention_backend and attention_config.backend are mutually
    exclusive
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.attention_backend:
        present: true
      vllm.engine.attention_config.backend:
        present: true
  kwargs_positive:
    attention_backend: some_backend
    attention_config:
      backend: another_backend
  kwargs_negative:
    attention_backend: null
    attention_config:
      backend: some_backend
  added_by: llm_multistage
- id: vllm_engineargs_enable_flashinfer_autotune_mutual_exclusion
  invariant_under_test: enable_flashinfer_autotune and kernel_config.enable_flashinfer_autotune
    are mutually exclusive
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.enable_flashinfer_autotune:
        present: true
      vllm.engine.kernel_config.enable_flashinfer_autotune:
        present: true
  kwargs_positive:
    enable_flashinfer_autotune: true
    kernel_config:
      enable_flashinfer_autotune: true
  kwargs_negative:
    enable_flashinfer_autotune: false
    kernel_config:
      enable_flashinfer_autotune: true
  added_by: llm_multistage
- id: vllm_concurrent_partial_prefill_check
  invariant_under_test: max_num_partial_prefills and max_long_partial_prefills should
    match SchedulerConfig values.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.max_num_partial_prefills:
        not_equal: SchedulerConfig.max_num_partial_prefills
      vllm.engine.max_long_partial_prefills:
        not_equal: SchedulerConfig.max_long_partial_prefills
  kwargs_positive:
    max_num_partial_prefills: 2
    max_long_partial_prefills: 1
  kwargs_negative:
    max_num_partial_prefills: 2
    max_long_partial_prefills: 2
  added_by: llm_multistage
- id: vllm_chunked_prefill_default_setting
  invariant_under_test: enable_chunked_prefill defaults to model_config.is_chunked_prefill_supported.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.enable_chunked_prefill:
        type_is_not: ''
  kwargs_positive:
    enable_chunked_prefill: true
  kwargs_negative:
    enable_chunked_prefill: false
  added_by: llm_multistage
- id: vllm_prefix_caching_default_setting
  invariant_under_test: enable_prefix_caching defaults to model_config.is_prefix_caching_supported.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.enable_prefix_caching:
        type_is_not: ''
  kwargs_positive:
    enable_prefix_caching: true
  kwargs_negative:
    enable_prefix_caching: false
  added_by: llm_multistage
- id: vllm_prefix_caching_unsupported_on_riscv_cpu
  invariant_under_test: Prefix caching is not supported on RISC-V CPUs.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.enable_prefix_caching:
        present: true
      vllm.engine.cpu_architecture:
        in:
        - CpuArchEnum.RISCV
  kwargs_positive:
    enable_prefix_caching: true
    cpu_architecture: CpuArchEnum.RISCV
  kwargs_negative:
    enable_prefix_caching: false
    cpu_architecture: CpuArchEnum.X86_64
  added_by: llm_multistage
