    current_platform: unsupported
  kwargs_negative:
    override_attention_dtype: None
    current_platform: rocm
  added_by: llm_pure_kwargs
- id: vllm_quantization_method_error
  engine: vllm
  library: vllm
  invariant_under_test: Unknown quantization method
