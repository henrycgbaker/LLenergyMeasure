        present: true
        not_in:
        - supported_quantization
  kwargs_positive:
    quantization: unknown
  kwargs_negative:
    quantization: int8
  added_by: llm_pure_kwargs
- id: vllm_quantization_deprecated_warning
  engine: vllm
  library: vllm
