invariants:
- id: vllm_model_config_tokenizer_type_error
  engine: vllm
  library: vllm
  invariant_under_test: tokenizer must be a string
  severity: error
  native_type: ModelConfig
  miner_source:
    path: model.py
    method: validate_model_config_after
    line_at_scan: 1
  match:
    engine: vllm
    fields:
      vllm.tokenizer:
        present: true
        type_is_not:
        - str
  kwargs_positive:
    tokenizer: 123
    max_model_len: 2048
  kwargs_negative:
    tokenizer: my_tokenizer
    max_model_len: 2048
  added_by: llm_pure_kwargs
- id: vllm_model_config_max_model_len_type_error
  engine: vllm
  library: vllm
  invariant_under_test: max_model_len must be a positive integer
  severity: error
  native_type: ModelConfig
  miner_source:
    path: model.py
    method: validate_model_config_after
    line_at_scan: 1
  match:
    engine: vllm
    fields:
      vllm.max_model_len:
        present: true
        type_is_not:
        - int
  kwargs_positive:
    tokenizer: my_tokenizer
    max_model_len: abc
  kwargs_negative:
    tokenizer: my_tokenizer
    max_model_len: 2048
  added_by: llm_pure_kwargs
- id: vllm_sleep_mode_unsupported
  engine: vllm
  library: vllm
  invariant_under_test: Sleep mode is not supported on current platform.
  severity: error
  native_type: ModelConfig
  miner_source:
    path: model.py
    method: __post_init__
    line_at_scan: 1
  match:
    engine: vllm
    fields:
      vllm.enable_sleep_mode:
        present: true
      vllm.current_platform.is_sleep_mode_available:
        present: false
  kwargs_positive:
    enable_sleep_mode: true
    current_platform: unsupported
  kwargs_negative:
    enable_sleep_mode: false
    current_platform: supported
  added_by: llm_pure_kwargs
- id: vllm_override_attention_dtype_rocm_warning
