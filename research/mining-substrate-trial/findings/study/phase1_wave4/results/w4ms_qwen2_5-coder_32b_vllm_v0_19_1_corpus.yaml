invariants:
- id: vllm_structured_outputs_mutually_exclusive
  invariant_under_test: Only one kind of structured outputs constraint can be specified.
  native_type: StructuredOutputsParams
  match:
    engine: vllm
    fields:
      vllm.engine.json:
        present: true
      vllm.engine.regex:
        present: true
      vllm.engine.choice:
        present: true
      vllm.engine.grammar:
        present: true
      vllm.engine.json_object:
        present: true
      vllm.engine.structural_tag:
        present: true
  kwargs_positive:
    json: '{"key": "value"}'
    regex: pattern
  kwargs_negative:
    json: '{"key": "value"}'
  added_by: llm_multistage
- id: vllm_repetition_detection_params_valid_range
  invariant_under_test: max_pattern_size and min_pattern_size must be non-negative,
    with min_pattern_size <= max_pattern_size.
  native_type: RepetitionDetectionParams
  match:
    engine: vllm
    fields:
      vllm.engine.max_pattern_size:
        <: 0
      vllm.engine.min_pattern_size:
        '>': vllm.engine.max_pattern_size
  kwargs_positive:
    max_pattern_size: -1
  kwargs_negative:
    max_pattern_size: 5
    min_pattern_size: 3
  added_by: llm_multistage
- id: vllm_sampling_params_temperature_warning
  invariant_under_test: temperature should not be less than _MAX_TEMP to avoid numerical
    errors.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.temperature:
        '>': 0
        <: _MAX_TEMP
  kwargs_positive:
    temperature: -1.0
  kwargs_negative:
    temperature: 0.7
  added_by: llm_multistage
- id: vllm_sampling_params_seed_none_or_positive
  invariant_under_test: seed should be None or a positive integer.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.seed:
        not_in:
        - -1
  kwargs_positive:
    seed: -1
  kwargs_negative:
    seed: 42
  added_by: llm_multistage
- id: vllm_sampling_params_stop_list_or_string
  invariant_under_test: stop should be either a list of strings or a single string.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.stop:
        type:
        - list
        - str
  kwargs_positive:
    stop: 123
  kwargs_negative:
    stop:
    - stop1
    - stop2
  added_by: llm_multistage
- id: vllm_sampling_params_stop_token_ids_list
  invariant_under_test: stop_token_ids should be a list of integers.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.stop_token_ids:
        type: list
        elements: int
  kwargs_positive:
    stop_token_ids: not_a_list
  kwargs_negative:
    stop_token_ids:
    - 1
    - 2
    - 3
  added_by: llm_multistage
- id: vllm_sampling_params_bad_words_list
  invariant_under_test: bad_words should be a list.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.bad_words:
        type: list
  kwargs_positive:
    bad_words: not_a_list
  kwargs_negative:
    bad_words:
    - - 1
      - 2
    - - 3
      - 4
  added_by: llm_multistage
- id: vllm_sampling_params_logprobs_non_negative_or_minus_one
  invariant_under_test: logprobs must be non-negative or -1.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.logprobs:
        <: 0
        '!=': -1
  kwargs_positive:
    logprobs: -2
  kwargs_negative:
    logprobs: 5
  added_by: llm_multistage
- id: vllm_sampling_params_prompt_logprobs_non_negative_or_minus_one
  invariant_under_test: prompt_logprobs must be non-negative or -1.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.prompt_logprobs:
        <: 0
        '!=': -1
  kwargs_positive:
    prompt_logprobs: -2
  kwargs_negative:
    prompt_logprobs: 5
  added_by: llm_multistage
- id: vllm_sampling_params_n_positive_integer
  invariant_under_test: n must be a positive integer.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.n:
        type: int
        '>=': 1
  kwargs_positive:
    n: 0
  kwargs_negative:
    n: 3
  added_by: llm_multistage
- id: vllm_sampling_params_presence_penalty_range
  invariant_under_test: presence_penalty must be within the range [-2, 2].
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.presence_penalty:
        not_in:
        - <-2
        - '>2'
  kwargs_positive:
    presence_penalty: 3.0
  kwargs_negative:
    presence_penalty: 1.5
  added_by: llm_multistage
- id: vllm_sampling_params_frequency_penalty_range
  invariant_under_test: frequency_penalty must be within the range [-2, 2].
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.frequency_penalty:
        not_in:
        - <-2
        - '>2'
  kwargs_positive:
    frequency_penalty: 3.0
  kwargs_negative:
    frequency_penalty: 1.5
  added_by: llm_multistage
- id: vllm_sampling_params_repetition_penalty_positive
  invariant_under_test: repetition_penalty must be greater than zero.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.repetition_penalty:
        <=: 0
  kwargs_positive:
    repetition_penalty: 0.0
  kwargs_negative:
    repetition_penalty: 1.2
  added_by: llm_multistage
- id: vllm_sampling_params_top_p_range
  invariant_under_test: top_p must be in the range (0, 1].
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.top_p:
        not_in:
        - <=0
        - '>1'
  kwargs_positive:
    top_p: 0.0
  kwargs_negative:
    top_p: 0.9
  added_by: llm_multistage
- id: vllm_sampling_params_top_k_non_negative_or_minus_one
  invariant_under_test: top_k must be a non-negative integer or -1.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.top_k:
        <: -1
  kwargs_positive:
    top_k: -2
  kwargs_negative:
    top_k: 50
  added_by: llm_multistage
- id: vllm_sampling_params_top_k_integer
  invariant_under_test: top_k must be an integer.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.top_k:
        type: int
  kwargs_positive:
    top_k: not_an_int
  kwargs_negative:
    top_k: 50
  added_by: llm_multistage
- id: vllm_sampling_params_min_p_range
  invariant_under_test: min_p must be in the range [0, 1].
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.min_p:
        not_in:
        - <0
        - '>1'
  kwargs_positive:
    min_p: -0.1
  kwargs_negative:
    min_p: 0.5
  added_by: llm_multistage
- id: vllm_sampling_params_max_tokens_positive_or_none
  invariant_under_test: max_tokens must be a positive integer or None.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.max_tokens:
        <: 1
        '!=': null
  kwargs_positive:
    max_tokens: 0
  kwargs_negative:
    max_tokens: 50
  added_by: llm_multistage
- id: vllm_sampling_params_min_tokens_non_negative
  invariant_under_test: min_tokens must be non-negative.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.min_tokens:
        <: 0
  kwargs_positive:
    min_tokens: -1
  kwargs_negative:
    min_tokens: 5
  added_by: llm_multistage
- id: vllm_sampling_params_logit_bias_token_ids_within_vocab_range
  invariant_under_test: logit_bias token IDs must be within the vocabulary range.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.logit_bias:
        present: true
  kwargs_positive:
    logit_bias:
      -1: -2.0
  kwargs_negative:
    logit_bias:
      1: -2.0
      2: -3.0
  added_by: llm_multistage
- id: vllm_sampling_params_allowed_token_ids_non_empty
  invariant_under_test: allowed_token_ids cannot be an empty list if it is not None.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.allowed_token_ids:
        present: true
        ==: []
  kwargs_positive:
    allowed_token_ids: []
  kwargs_negative:
    allowed_token_ids:
    - 1
    - 2
    - 3
  added_by: llm_multistage
- id: vllm_sampling_params_spec_decode_min_p_and_logit_bias_not_supported
  invariant_under_test: min_p and logit_bias are not supported with speculative decoding.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.min_p:
        '>': _SAMPLING_EPS
      vllm.engine.logit_bias:
        present: true
  kwargs_positive:
    min_p: 0.1
    logit_bias:
      1: -2.0
  kwargs_negative:
    min_p: 0.0
    logit_bias: null
  added_by: llm_multistage
- id: vllm_sampling_params_structured_outputs_backend_selection_not_supported
  invariant_under_test: Request-level structured output backend selection is not supported.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.structured_outputs._backend:
        present: true
      vllm.engine.structured_outputs_config.backend:
        not_in:
        - vllm.engine.structured_outputs._backend
        - auto
  kwargs_positive:
    structured_outputs:
      _backend: custom
    structured_outputs_config:
      backend: custom
  kwargs_negative:
    structured_outputs:
      _backend: custom
    structured_outputs_config:
      backend: auto
  added_by: llm_multistage
- id: vllm_sampling_params_structured_outputs_choice_non_empty_list
  invariant_under_test: structured_outputs.choice cannot be an empty list.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.structured_outputs.choice:
        type: list
        ==: []
  kwargs_positive:
    structured_outputs:
      choice: []
  kwargs_negative:
    structured_outputs:
      choice:
      - option1
      - option2
  added_by: llm_multistage
- id: vllm_sampling_params_structured_outputs_grammar_non_empty_string
  invariant_under_test: structured_outputs.grammar cannot be an empty string.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.structured_outputs.grammar:
        type: str
        ==: ''
  kwargs_positive:
    structured_outputs:
      grammar: ''
  kwargs_negative:
    structured_outputs:
      grammar: some_grammar
  added_by: llm_multistage
- id: vllm_sampling_params_structured_outputs_backend_auto_fallback
  invariant_under_test: structured_outputs backend must be set to a valid fallback
    if auto selection fails.
  native_type: SamplingParams
  match:
    engine: vllm
    fields:
      vllm.engine.structured_outputs_config.backend:
        present: true
        ==: auto
  kwargs_positive:
    structured_outputs_config:
      backend: auto
  kwargs_negative:
    structured_outputs_config:
      backend: custom
  added_by: llm_multistage
- id: vllm_validate_tokenizer_string
  invariant_under_test: tokenizer must be a string
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.tokenizer:
        present: true
        type: str
  kwargs_positive:
    tokenizer: 12345
  kwargs_negative:
    tokenizer: Qwen/Qwen3-0.6B
  added_by: llm_multistage
- id: vllm_validate_max_model_len_positive_integer
  invariant_under_test: max_model_len must be a positive integer
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.max_model_len:
        present: true
        type: int
        '>': 0
  kwargs_positive:
    max_model_len: -1
  kwargs_negative:
    max_model_len: 512
  added_by: llm_multistage
- id: vllm_validate_sleep_mode_platform_support
  invariant_under_test: sleep mode is supported on current platform
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.enable_sleep_mode:
        present: true
        value: true
      vllm.engine.platform:
        not_in:
        - rocm
  kwargs_positive:
    enable_sleep_mode: true
    platform: rocm
  kwargs_negative:
    enable_sleep_mode: true
    platform: cuda
  added_by: llm_multistage
- id: vllm_validate_runner_generate_compatibility
  invariant_under_test: runner generate is compatible with generative model
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.runner_type:
        present: true
        value: generate
      vllm.engine.is_generative_model:
        present: true
        value: true
  kwargs_positive:
    runner: generate
    is_generative_model: false
  kwargs_negative:
    runner: generate
    is_generative_model: true
  added_by: llm_multistage
- id: vllm_validate_mm_encoder_tp_mode_support
  invariant_under_test: mm_encoder_tp_mode is supported by the model
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.mm_encoder_tp_mode:
        present: true
        value: data
      vllm.engine.model_info.supports_multimodal_encoder_tp_data:
        present: true
        value: false
  kwargs_positive:
    mm_encoder_tp_mode: data
    model_info:
      supports_multimodal_encoder_tp_data: true
  kwargs_negative:
    mm_encoder_tp_mode: data
    model_info:
      supports_multimodal_encoder_tp_data: false
  added_by: llm_multistage
- id: vllm_validate_renderer_num_workers_with_mm_processor_cache
  invariant_under_test: renderer_num_workers is set to 1 when mm_processor_cache_gb
    is greater than 0
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.renderer_num_workers:
        present: true
        '>': 1
      vllm.engine.multimodal_config.mm_processor_cache_gb:
        present: true
        '>': 0
  kwargs_positive:
    renderer_num_workers: 2
    multimodal_config:
      mm_processor_cache_gb: 1
  kwargs_negative:
    renderer_num_workers: 1
    multimodal_config:
      mm_processor_cache_gb: 1
  added_by: llm_multistage
- id: vllm_validate_multimodal_gguf_model_tokenizer
  invariant_under_test: multimodal GGUF model uses original tokenizer
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.is_multimodal_model:
        present: true
        value: true
      vllm.engine.tokenizer:
        is_gguf: true
  kwargs_positive:
    is_multimodal_model: true
    tokenizer: gguf_tokenizer
  kwargs_negative:
    is_multimodal_model: false
    tokenizer: Qwen/Qwen3-0.6B
  added_by: llm_multistage
- id: vllm_validate_quantization_method_known
  invariant_under_test: quantization method is known and supported
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.quantization:
        in:
        - <supported_quantization_methods>
  kwargs_positive:
    quantization: unknown_method
  kwargs_negative:
    quantization: bitsandbytes
  added_by: llm_multistage
- id: vllm_validate_cuda_graph_support_encoder_decoder_rocm
  invariant_under_test: CUDA graph is supported for encoder-decoder models on ROCm
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.is_encoder_decoder:
        present: true
        value: true
      vllm.engine.enforce_eager:
        present: true
        value: false
      vllm.engine.platform:
        in:
        - rocm
  kwargs_positive:
    is_encoder_decoder: true
    enforce_eager: false
    platform: cuda
  kwargs_negative:
    is_encoder_decoder: true
    enforce_eager: false
    platform: rocm
  added_by: llm_multistage
- id: vllm_is_moe_expert_parallelism_enabled
  invariant_under_test: Number of experts in the model must be greater than 0 when
    expert parallelism is enabled.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.is_moe:
        present: true
      vllm.engine.num_experts:
        '>': 0
  kwargs_positive:
    model_weights: dummy_model_with_experts
    is_moe: true
    num_experts: 0
  kwargs_negative:
    model_weights: dummy_model_with_experts
    is_moe: true
    num_experts: 1
  added_by: llm_multistage
- id: vllm_total_num_attention_heads_divisible_by_tensor_parallel_size
  invariant_under_test: Total number of attention heads must be divisible by tensor
    parallel size.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.model_arch_config.total_num_attention_heads:
        present: true
      vllm.engine.parallel_config.tensor_parallel_size:
        present: true
  kwargs_positive:
    model_weights: dummy_model
    total_num_attention_heads: 10
    tensor_parallel_size: 3
  kwargs_negative:
    model_weights: dummy_model
    total_num_attention_heads: 10
    tensor_parallel_size: 2
  added_by: llm_multistage
- id: vllm_pipeline_parallelism_supported_model
  invariant_under_test: Pipeline parallelism is not supported for this model. Supported
    models implement the `SupportsPP` interface.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.parallel_config.pipeline_parallel_size:
        '>': 1
      vllm.engine.registry.is_pp_supported_model:
        present: true
  kwargs_positive:
    model_weights: dummy_unsupported_model
    pipeline_parallel_size: 2
    is_pp_supported_model: false
  kwargs_negative:
    model_weights: dummy_supported_model
    pipeline_parallel_size: 2
    is_pp_supported_model: true
  added_by: llm_multistage
- id: vllm_tensor_parallel_size_greater_than_total_num_kv_heads_for_decode_context_parallel
  invariant_under_test: Tensor parallel size must be greater than total num kv heads
    when enable decode context parallel for GQA/MQA.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.parallel_config.tensor_parallel_size:
        present: true
      vllm.engine.get_total_num_kv_heads:
        present: true
  kwargs_positive:
    model_weights: dummy_model
    tensor_parallel_size: 2
    total_num_kv_heads: 3
  kwargs_negative:
    model_weights: dummy_model
    tensor_parallel_size: 4
    total_num_kv_heads: 3
  added_by: llm_multistage
- id: vllm_decode_context_parallel_size_within_max_dcp_size
  invariant_under_test: Decode context parallel size must less than or equal to (tensor
    parallel size // total num kv heads).
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.parallel_config.decode_context_parallel_size:
        present: true
      vllm.engine.tensor_parallel_size:
        present: true
      vllm.engine.total_num_kv_heads:
        present: true
  kwargs_positive:
    model_weights: dummy_model
    tensor_parallel_size: 6
    total_num_kv_heads: 2
    decode_context_parallel_size: 4
  kwargs_negative:
    model_weights: dummy_model
    tensor_parallel_size: 6
    total_num_kv_heads: 2
    decode_context_parallel_size: 3
  added_by: llm_multistage
- id: vllm_mm_tensor_ipc_compatibility_with_dp_tp_pp
  invariant_under_test: mm_tensor_ipc='torch_shm' is not supported with data_parallel_size
    > 1 or tensor_parallel_size > 1 or pipeline_parallel_size > 1.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.multimodal_config.mm_tensor_ipc:
        ==: torch_shm
      vllm.engine.parallel_config.world_size_across_dp:
        '>': 1
      vllm.engine.parallel_config.tensor_parallel_size:
        '>': 1
      vllm.engine.parallel_config.pipeline_parallel_size:
        '>': 1
  kwargs_positive:
    model_weights: dummy_model
    mm_tensor_ipc: torch_shm
    data_parallel_size: 2
    tensor_parallel_size: 2
    pipeline_parallel_size: 2
  kwargs_negative:
    model_weights: dummy_model
    mm_tensor_ipc: torch_shm
    data_parallel_size: 1
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
  added_by: llm_multistage
- id: vllm_model_is_multimodal
  invariant_under_test: The model is not multimodal.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.multimodal_config:
        present: false
  kwargs_positive:
    model_weights: dummy_unimodal_model
    multimodal_config: null
  kwargs_negative:
    model_weights: dummy_multimodal_model
    multimodal_config: {}
  added_by: llm_multistage
- id: vllm_valid_dtype_for_model_type
  invariant_under_test: 'The model type does not support float16. Reason: <reason>.'
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.model_type:
        present: true
      vllm.engine.dtype:
        ==: torch.float16
  kwargs_positive:
    model_weights: dummy_model
    dtype: torch.float16
    model_type: unsupported_float16_model
  kwargs_negative:
    model_weights: dummy_model
    dtype: torch.float16
    model_type: supported_float16_model
  added_by: llm_multistage
- id: vllm_head_dtype_supported_by_platform
  invariant_under_test: The current platform does not support <head_dtype> head dtype,
    fallback to model dtype.
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.head_dtype:
        present: true
      vllm.engine.current_platform.supported_dtypes:
        not_in:
        - <head_dtype>
  kwargs_positive:
    model_weights: dummy_model
    head_dtype: torch.float16
    supported_dtypes:
    - torch.float32
  kwargs_negative:
    model_weights: dummy_model
    head_dtype: torch.float16
    supported_dtypes:
    - torch.float16
    - torch.float32
  added_by: llm_multistage
- id: vllm_valid_generation_config_source
  invariant_under_test: 'Unknown dtype: <dtype>.'
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.generation_config:
        present: true
      vllm.engine._STR_DTYPE_TO_TORCH_DTYPE:
        not_in:
        - <dtype>
  kwargs_positive:
    model_weights: dummy_model
    generation_config:
      dtype: unknown_dtype
    _STR_DTYPE_TO_TORCH_DTYPE:
    - torch.float16
    - torch.float32
  kwargs_negative:
    model_weights: dummy_model
    generation_config:
      dtype: torch.float16
    _STR_DTYPE_TO_TORCH_DTYPE:
    - torch.float16
    - torch.float32
  added_by: llm_multistage
