- id: vllm_video_pruning_rate_positive_or_zero
  invariant_under_test: video_pruning_rate must be positive or zero
  native_type: ModelConfig
  match:
    engine: vllm
    fields:
      vllm.engine.video_pruning_rate:
        '>=': 0
  kwargs_positive:
    video_pruning_rate: 0.5
  kwargs_negative:
    video_pruning_rate: -1
  added_by: llm_multistage
- id: vllm_data_parallel_hybrid_lb_headless_incompatibility
  invariant_under_test: data_parallel_hybrid_lb is not applicable in headless mode
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_hybrid_lb:
        present: true
      vllm.engine.headless:
        present: true
  kwargs_positive:
    data_parallel_hybrid_lb: true
    headless: true
  kwargs_negative:
    data_parallel_hybrid_lb: false
    headless: true
  added_by: llm_multistage
- id: vllm_world_size_divisibility_by_nnodes
  invariant_under_test: world_size must be divisible by nnodes.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.nnodes:
        present: true
      vllm.engine.data_parallel_size:
        present: true
      vllm.engine.pipeline_parallel_size:
        present: true
      vllm.engine.tensor_parallel_size:
        present: true
  kwargs_positive:
    nnodes: 3
    data_parallel_size: 2
    pipeline_parallel_size: 1
    tensor_parallel_size: 1
  kwargs_negative:
    nnodes: 3
    data_parallel_size: 3
    pipeline_parallel_size: 1
    tensor_parallel_size: 1
  added_by: llm_multistage
- id: vllm_node_rank_within_nnodes
  invariant_under_test: node_rank must be less than nnodes.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.node_rank:
        present: true
      vllm.engine.nnodes:
        present: true
  kwargs_positive:
    node_rank: 3
    nnodes: 2
  kwargs_negative:
    node_rank: 1
    nnodes: 2
  added_by: llm_multistage
- id: vllm_data_parallel_external_lb_node_rank_or_rank_required
  invariant_under_test: data_parallel_rank or node_rank must be specified if data_parallel_external_lb
    is enable.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_external_lb:
        present: true
      vllm.engine.data_parallel_rank:
        not_present: true
      vllm.engine.node_rank:
        not_present: true
  kwargs_positive:
    data_parallel_external_lb: true
  kwargs_negative:
    data_parallel_external_lb: true
    node_rank: 0
  added_by: llm_multistage
- id: vllm_data_parallel_backend_ray_or_mp
  invariant_under_test: data_parallel_backend can only be ray or mp, got %s
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.data_parallel_backend:
        not_in:
        - ray
        - mp
  kwargs_positive:
    data_parallel_backend: invalid
  kwargs_negative:
    data_parallel_backend: ray
  added_by: llm_multistage
- id: vllm_max_num_batched_tokens_required
  invariant_under_test: max_num_batched_tokens must be set by this point
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.max_num_batched_tokens:
        not_present: true
  kwargs_positive: {}
  kwargs_negative:
    max_num_batched_tokens: 2048
  added_by: llm_multistage
- id: vllm_max_num_seqs_required
  invariant_under_test: max_num_seqs must be set by this point
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.max_num_seqs:
        not_present: true
  kwargs_positive: {}
  kwargs_negative:
    max_num_seqs: 128
  added_by: llm_multistage
- id: vllm_attention_backend_and_config_mutual_exclusivity
  invariant_under_test: attention_backend and attention_config.backend are mutually
    exclusive
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.attention_backend:
        present: true
      vllm.engine.attention_config.backend:
        present: true
  kwargs_positive:
    attention_backend: flashinfer
    attention_config: AttentionConfig(backend='flashinfer')
  kwargs_negative:
    attention_backend: flashinfer
    attention_config: AttentionConfig(backend=None)
  added_by: llm_multistage
- id: vllm_concurrent_partial_prefill_unsupported
  invariant_under_test: Concurrent Partial Prefill is not supported if max_num_partial_prefills
    or max_long_partial_prefills differ from SchedulerConfig values.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.max_num_partial_prefills:
        not_equal_to: SchedulerConfig.max_num_partial_prefills
      vllm.engine.max_long_partial_prefills:
        not_equal_to: SchedulerConfig.max_long_partial_prefills
  kwargs_positive:
    max_num_partial_prefills: 2
    max_long_partial_prefills: 3
  kwargs_negative:
    max_num_partial_prefills: 1
    max_long_partial_prefills: 1
  added_by: llm_multistage
- id: vllm_pipeline_parallelism_unsupported
  invariant_under_test: Pipeline Parallelism is not supported without Ray, multiprocessing,
    or external launcher if pipeline_parallel_size > 1.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.pipeline_parallel_size:
        greater_than: 1
      vllm.engine.distributed_executor_backend:
        not_in:
        - ParallelConfig.distributed_executor_backend
        - ray
        - mp
        - external_launcher
  kwargs_positive:
    pipeline_parallel_size: 2
    distributed_executor_backend: custom
  kwargs_negative:
    pipeline_parallel_size: 1
    distributed_executor_backend: ray
  added_by: llm_multistage
- id: vllm_prefix_caching_unsupported_for_riscv
  invariant_under_test: Prefix caching is not supported for RISC-V CPUs.
  native_type: EngineArgs
  match:
    engine: vllm
    fields:
      vllm.engine.enable_prefix_caching:
        present: true
      vllm.platform.cpu_architecture:
        in:
        - CpuArchEnum.RISCV
  kwargs_positive:
    enable_prefix_caching: true
    cpu_architecture: CpuArchEnum.RISCV
  kwargs_negative:
    enable_prefix_caching: false
    cpu_architecture: CpuArchEnum.X86_64
  added_by: llm_multistage
