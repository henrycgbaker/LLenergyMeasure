- id: tensorrt_model_should_be_provided
  engine: tensorrt
  library: tensorrt
  invariant_under_test: model should be provided
  severity: error
  native_type: _ModelWrapper
  miner_source:
    path: llm_args.py
    method: __post_init__
    line_at_scan: 123
  match:
    engine: tensorrt
    fields:
      tensorrt.model:
        present: false
  kwargs_positive:
    model: null
  kwargs_negative:
    model: path/to/model
  added_by: llm_pure_kwargs
