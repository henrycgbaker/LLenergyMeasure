invariants:
- id: tensorrt_field_status_none_or_valid
  engine: tensorrt
  library: tensorrt
  invariant_under_test: status must be None, 'prototype', 'beta', or 'deprecated'
  severity: error
  native_type: tensorrt.Field
  miner_source:
    path: llm_args.py
    method: Field
    line_at_scan: <approximate line number if visible>
  match:
    engine: tensorrt
    fields:
      tensorrt.status:
        present: true
        not_in:
        - None
        - prototype
        - beta
        - deprecated
  kwargs_positive:
    default: None
    status: invalid
  kwargs_negative:
    default: None
    status: None
  added_by: llm_pure_kwargs
- id: tensorrt_validate_cuda_graph_max_batch_size_non_negative
  engine: tensorrt
  library: tensorrt
  invariant_under_test: cuda_graph_config.max_batch_size must be non-negative
