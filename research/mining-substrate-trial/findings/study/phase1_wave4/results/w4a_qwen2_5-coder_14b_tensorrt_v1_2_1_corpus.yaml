  native_type: tensorrt.CudaGraphConfig
  miner_source:
    path: llm_args.py
    method: validate_cuda_graph_max_batch_size
    line_at_scan: <approximate line number if visible>
  match:
    engine: tensorrt
    fields:
      tensorrt.cuda_graph_config.max_batch_size:
        <: 0
  kwargs_positive:
    max_batch_size: -1
  kwargs_negative:
    max_batch_size: 0
  added_by: llm_pure_kwargs
- id: tensorrt_base_sparse_attention_config_algorithm_not_implemented
