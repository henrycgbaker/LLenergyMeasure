- id: vllm_repetitiondetectionparams___post_init___min_gt_max
  ckey:
  - min_pattern_size
  - presence
  - '[max_pattern_size,min_pattern_size]'
  invariant_under_test: RepetitionDetectionParams rejects min_pattern_size > max_pattern_size (cross-field)
  native_type: vllm.RepetitionDetectionParams
  match:
    vllm.engine.min_pattern_size:
      present: true
    vllm.engine.max_pattern_size:
      present: true
  kwargs_positive:
    max_pattern_size: 2
    min_pattern_size: 5
    min_count: 2
  kwargs_negative:
    max_pattern_size: 5
    min_pattern_size: 2
    min_count: 2
  cross_field: true
- id: vllm_structuredoutputsparams___post_init___count_exactly_one
  ckey:
  - json
  - presence
  - '[json,regex]'
  invariant_under_test: StructuredOutputsParams requires exactly one constraint kind (count must equal 1)
  native_type: vllm.StructuredOutputsParams
  match:
    vllm.engine.json:
      present: true
    vllm.engine.regex:
      present: true
  kwargs_positive:
    json: '{"type": "object"}'
    regex: '[0-9]+'
  kwargs_negative:
    json: '{"type": "object"}'
    regex: null
  cross_field: true
- id: vllm_samplingparams__verify_args_min_tokens_gt_max_tokens
  ckey:
  - min_tokens
  - presence
  - '[max_tokens,min_tokens]'
  invariant_under_test: SamplingParams rejects min_tokens > max_tokens (cross-field)
  native_type: vllm.SamplingParams
  match:
    vllm.sampling.min_tokens:
      present: true
    vllm.sampling.max_tokens:
      present: true
  kwargs_positive:
    min_tokens: 10
    max_tokens: 5
  kwargs_negative:
    min_tokens: 3
    max_tokens: 5
  cross_field: true
- id: vllm_structuredoutputsconfig__validate_disable_any_whitespace_backend
  ckey:
  - disable_any_whitespace
  - exact
  - '[backend,disable_any_whitespace]'
  invariant_under_test: StructuredOutputsConfig allows disable_any_whitespace only for xgrammar/guidance backends (cross-field
    gate)
  native_type: vllm.StructuredOutputsConfig
  match:
    vllm.engine.disable_any_whitespace: true
    vllm.engine.backend:
      present: true
      not_in:
      - xgrammar
      - guidance
  kwargs_positive:
    backend: outlines
    disable_any_whitespace: true
  kwargs_negative:
    backend: xgrammar
    disable_any_whitespace: true
  cross_field: true
- id: vllm_structuredoutputsconfig__validate_disable_additional_properties_backend
  ckey:
  - disable_additional_properties
  - exact
  - '[backend,disable_additional_properties]'
  invariant_under_test: StructuredOutputsConfig allows disable_additional_properties only for guidance backend (cross-field
    gate)
  native_type: vllm.StructuredOutputsConfig
  match:
    vllm.engine.disable_additional_properties: true
    vllm.engine.backend:
      present: true
      not_equal: guidance
  kwargs_positive:
    backend: xgrammar
    disable_additional_properties: true
  kwargs_negative:
    backend: guidance
    disable_additional_properties: true
  cross_field: true
- id: vllm_eplbconfig__validate_async_requires_default_policy
  ckey:
  - use_async
  - exact
  - '[policy,use_async]'
  invariant_under_test: EPLBConfig allows use_async only with the default policy (cross-field gate)
  native_type: vllm.EPLBConfig
  match:
    vllm.engine.use_async: true
    vllm.engine.policy:
      present: true
      not_equal: default
  kwargs_positive:
    use_async: true
    policy: other
  kwargs_negative:
    use_async: true
    policy: default
  cross_field: true
- id: vllm_eplbconfig__validate_log_balancedness_interval_le0
  ckey:
  - log_balancedness
  - exact
  - '[log_balancedness,log_balancedness_interval]'
  invariant_under_test: EPLBConfig requires log_balancedness_interval > 0 when log_balancedness is enabled (cross-field gate)
  native_type: vllm.EPLBConfig
  match:
    vllm.engine.log_balancedness: true
    vllm.engine.log_balancedness_interval:
      <=: 0
  kwargs_positive:
    log_balancedness: true
    log_balancedness_interval: 0
  kwargs_negative:
    log_balancedness: true
    log_balancedness_interval: 1
  cross_field: true
- id: vllm_loraconfig__validate_max_cpu_loras_lt_max_loras
  ckey:
  - max_cpu_loras
  - presence
  - '[max_cpu_loras,max_loras]'
  invariant_under_test: LoRAConfig requires max_cpu_loras >= max_loras when set (cross-field)
  native_type: vllm.LoRAConfig
  match:
    vllm.engine.lora.max_cpu_loras:
      present: true
    vllm.engine.lora.max_loras:
      present: true
  kwargs_positive:
    max_loras: 4
    max_cpu_loras: 2
  kwargs_negative:
    max_loras: 4
    max_cpu_loras: 8
  cross_field: true
