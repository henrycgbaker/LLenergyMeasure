# Docker Compose for the transformers engine image.
#
# vLLM and TensorRT-LLM run inside upstream images (vllm/vllm-openai,
# nvcr.io/nvidia/tensorrt-llm/release) with the llenergymeasure source
# bind-mounted at runtime by DockerRunner; they do not have compose
# entries because there is no first-party image to build.
#
# Quick Start:
#   uv sync                       # Install llenergymeasure + base deps
#   llem config                   # Check environment
#   make docker-build             # Build engine image (wires the GHCR cache;
#                                 # raw `docker compose build transformers` works
#                                 # but skips the per-version cache source)
#
# Manual Usage:
#   Transformers (default): docker compose run --rm transformers llem --help
#
# Examples:
#   docker compose run --rm transformers llem run configs/examples/experiment-transformers.yaml
#
#   # Development shell
#   docker compose --profile dev run --rm transformers-dev /bin/bash

# BuildKit layer cache for the transformers image.
# Two sources, in priority order:
#   1. transformers-cache:transformers-<VER>-buildcache - the mode=max cache
#      manifest exported by the local seed (make docker-seed-transformers).
#      The only ref that carries builder-stage layers (the flash-attn FA3
#      compile). <VER> is the engine pin from
#      engine_versions/transformers/current.yaml, exported as
#      TRANSFORMERS_VERSION by scripts/docker_build_with_cache_report.sh
#      (the `make docker-build` path). When unset (raw `docker compose
#      build`), the ref resolves to a nonexistent tag and BuildKit skips it
#      silently - prefer `make docker-build` for the warm path.
#   2. :latest - the merge-time promotion tag-copy (plain image, final
#      layers only; nothing publishes build cache to it). Harmless
#      last-resort reuse.
x-cache-transformers: &cache-transformers
  cache_from:
    - ghcr.io/henrycgbaker/llenergymeasure/transformers-cache:transformers-${TRANSFORMERS_VERSION:-unpinned}-buildcache
    - ghcr.io/henrycgbaker/llenergymeasure/transformers:latest

# Shared configuration anchor
x-common: &common
  # PUID/PGID pattern for host permission mapping (like LinuxServer.io)
  # Usage: PUID=$(id -u) PGID=$(id -g) docker compose run ...
  # Container starts as root, entrypoint drops to PUID/PGID user

  # GPU access with privileged mode for NVML energy metrics
  privileged: true
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [compute, utility]

  # Environment variables
  environment:
    # PUID/PGID for host permission mapping (REQUIRED - set in .env)
    # Copy .env.example to .env and set these from 'id -u' / 'id -g'
    - PUID=${PUID:?cp .env.example to .env and set PUID (run 'id -u')}
    - PGID=${PGID:?cp .env.example to .env and set PGID (run 'id -g')}
    # Standard config
    - HF_TOKEN
    # Default to GPU 0 if host has empty CUDA_VISIBLE_DEVICES (shared server setup)
    # Campaign/experiment CLI overrides this when targeting specific GPUs
    - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    # NVIDIA Container Toolkit: ensure compute capability for CUDA
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - HF_HOME=/app/.cache/huggingface
    - PIP_NO_CACHE_DIR=1
    - CODECARBON_LOG_LEVEL=warning
    - NVIDIA_DISABLE_REQUIRE=true
    # Container sees /app paths regardless of host mount source
    - LLM_ENERGY_RESULTS_DIR=/app/results
    - LLM_ENERGY_CONFIGS_DIR=/app/configs
    - LLM_ENERGY_STATE_DIR=/app/.state

  working_dir: /app

  healthcheck:
    test: ["CMD", "python", "-c", "import torch; assert torch.cuda.is_available()"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  # ==========================================================================
  # Transformers Engine - HuggingFace Transformers + Accelerate
  # ==========================================================================
  transformers:
    <<: *common
    volumes:
      # Bind mounts: user-accessible data (resume workflow requires host access)
      - ${LLM_ENERGY_CONFIGS_DIR:-./configs}:/app/configs
      - ${LLM_ENERGY_RESULTS_DIR:-./results}:/app/results
      - ${LLM_ENERGY_STATE_DIR:-./.state}:/app/.state
      - ./scripts:/app/scripts:ro
      # Named volumes: container-managed (no permission issues)
      - hf-cache:/app/.cache/huggingface
    build:
      <<: *cache-transformers
      context: .
      dockerfile: docker/Dockerfile.transformers
      target: runtime
      args:
        # Engine pin from engine_versions/transformers/current.yaml, exported
        # by scripts/docker_build_with_cache_report.sh. Keeps the local build
        # byte-aligned with the seed so its cache layers actually apply. The
        # fallback mirrors the Dockerfile ARG default (raw `docker compose
        # build` without the make wrapper).
        TRANSFORMERS_VERSION: ${TRANSFORMERS_VERSION:-4.57.3}
    image: llenergymeasure:transformers

  transformers-dev:
    <<: *common
    volumes:
      - .:/app
      - hf-cache:/app/.cache/huggingface
    profiles: ["dev"]
    build:
      <<: *cache-transformers
      context: .
      dockerfile: docker/Dockerfile.transformers
      target: dev
      args:
        TRANSFORMERS_VERSION: ${TRANSFORMERS_VERSION:-4.57.3}
    image: llenergymeasure:transformers-dev
    entrypoint: ["/app/scripts/dev-entrypoint.sh"]
    command: []

# =============================================================================
# Named Volumes (Docker-managed, persist across container restarts)
# =============================================================================
# These volumes store large caches.
# They persist unless you explicitly run: docker compose down -v
#
# To clear specific volumes:
#   docker volume rm llem-hf-cache
#
# Note: Experiment state (.state/) is now a bind mount for resume workflow.
#
volumes:
  # HuggingFace model cache (10-100+ GB)
  hf-cache:
    name: llem-hf-cache
