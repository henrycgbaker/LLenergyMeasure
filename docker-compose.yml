# Docker Compose for the transformers engine image.
#
# All three engine images (transformers, vllm, tensorrt) carry only the engine
# substrate; the project source (`src/llenergymeasure/` + `scripts/`) is bind-
# mounted at runtime via `/repo` with `PYTHONPATH=/repo/src:/repo`. vLLM and
# TensorRT-LLM run inside upstream images (vllm/vllm-openai,
# nvcr.io/nvidia/tensorrt-llm/release) and have no compose entries — they are
# pulled directly by DockerRunner.
#
# Quick Start:
#   pip install -e .                   # Install llenergymeasure on host
#   llem config                        # Check environment
#   docker compose build transformers  # Build the engine image
#
# Manual Usage:
#   Transformers: docker compose run --rm transformers python3 -m llenergymeasure.cli --help
#
# Examples:
#   docker compose run --rm transformers \
#       python3 -m llenergymeasure.cli run configs/examples/experiment-transformers.yaml
#
#   # Development shell
#   docker compose --profile dev run --rm transformers-dev /bin/bash

# BuildKit layer cache for the transformers image.
# Two sources, in priority order:
#   1. :v${LLEM_PKG_VERSION} — exact-version image layers from the matching
#      release. Note the literal `v`: published tags carry a `v` prefix (set by
#      release.yml) but LLEM_PKG_VERSION is bare semver (from _version.py), so
#      we have to add the prefix here. On dev versions (`vdev`) this entry
#      silently misses, which is fine — the next entry catches it.
#   2. :latest — rolling cache published by docker-publish.yml with mode=max,
#      which exports intermediate layers (including the flash-attn compile).
x-cache-transformers: &cache-transformers
  cache_from:
    - ghcr.io/henrycgbaker/llenergymeasure/transformers:v${LLEM_PKG_VERSION:-dev}
    - ghcr.io/henrycgbaker/llenergymeasure/transformers:latest

# Shared configuration anchor
x-common: &common
  # PUID/PGID pattern for host permission mapping (like LinuxServer.io)
  # Usage: PUID=$(id -u) PGID=$(id -g) docker compose run ...
  # Container starts as root, entrypoint drops to PUID/PGID user

  # GPU access with privileged mode for NVML energy metrics
  privileged: true
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [compute, utility]

  # Environment variables
  environment:
    # PUID/PGID for host permission mapping (REQUIRED - set in .env)
    # Auto-generated by 'lem doctor' or 'lem campaign', or set manually
    - PUID=${PUID:?Run 'lem doctor' to auto-generate .env, or set PUID manually}
    - PGID=${PGID:?Run 'lem doctor' to auto-generate .env, or set PGID manually}
    # Standard config
    - HF_TOKEN
    # Default to GPU 0 if host has empty CUDA_VISIBLE_DEVICES (shared server setup)
    # Campaign/experiment CLI overrides this when targeting specific GPUs
    - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    # NVIDIA Container Toolkit: ensure compute capability for CUDA
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - HF_HOME=/root/.cache/huggingface
    - PIP_NO_CACHE_DIR=1
    - CODECARBON_LOG_LEVEL=warning
    - NVIDIA_DISABLE_REQUIRE=true
    # Container sees /repo paths (project bind-mounted at /repo at runtime)
    - LLM_ENERGY_RESULTS_DIR=/repo/results
    - LLM_ENERGY_CONFIGS_DIR=/repo/configs
    - LLM_ENERGY_STATE_DIR=/repo/.state
    - PYTHONPATH=/repo/src:/repo

  working_dir: /repo

  healthcheck:
    test: ["CMD", "python", "-c", "import torch; assert torch.cuda.is_available()"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  # ==========================================================================
  # Transformers Engine - HuggingFace Transformers + Accelerate
  # ==========================================================================
  transformers:
    <<: *common
    volumes:
      # Bind-mount the project source at /repo; the in-container Python
      # imports llenergymeasure via PYTHONPATH (see x-common above).
      - .:/repo
      # Named volume: container-managed HF cache (no permission issues)
      - hf-cache:/root/.cache/huggingface
    build:
      <<: *cache-transformers
      context: .
      dockerfile: docker/Dockerfile.transformers
      target: runtime
      args:
        LLEM_PKG_VERSION: ${LLEM_PKG_VERSION:-dev}
        LLEM_EXPCONF_SCHEMA_FINGERPRINT: ${LLEM_EXPCONF_SCHEMA_FINGERPRINT:-unknown}
    image: llenergymeasure:transformers

  transformers-dev:
    <<: *common
    volumes:
      - .:/repo
      - hf-cache:/root/.cache/huggingface
    profiles: ["dev"]
    build:
      <<: *cache-transformers
      context: .
      dockerfile: docker/Dockerfile.transformers
      target: dev
      args:
        LLEM_PKG_VERSION: ${LLEM_PKG_VERSION:-dev}
        LLEM_EXPCONF_SCHEMA_FINGERPRINT: ${LLEM_EXPCONF_SCHEMA_FINGERPRINT:-unknown}
    image: llenergymeasure:transformers-dev
    entrypoint: ["/app/scripts/dev-entrypoint.sh"]
    command: []

  # ==========================================================================
  # Legacy aliases (backwards compatibility)
  # ==========================================================================
  llenergymeasure-app:
    extends:
      service: transformers

  llenergymeasure-dev:
    extends:
      service: transformers-dev
    profiles: ["dev"]

# =============================================================================
# Named Volumes (Docker-managed, persist across container restarts)
# =============================================================================
# These volumes store large caches.
# They persist unless you explicitly run: docker compose down -v
#
# To clear specific volumes:
#   docker volume rm lem-hf-cache
#
# Note: Experiment state (.state/) is now a bind mount for resume workflow.
#
volumes:
  # HuggingFace model cache (10-100+ GB)
  hf-cache:
    name: lem-hf-cache
