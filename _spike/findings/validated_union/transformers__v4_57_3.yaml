invariants:
- id: transformers_beam_search_num_beams_eq_1
  engine: transformers
  library: transformers
  invariant_under_test: GenerationConfig.validate flags `num_beams` (num beams eq
    1)
  severity: dormant
  native_type: transformers.GenerationConfig
  miner_source:
    path: transformers/generation/configuration_utils.py
    method: validate
    line_at_scan: 345
  match:
    engine: transformers
    fields:
      transformers.sampling.num_beams: 1
  kwargs_positive:
    num_beams: 1
    num_beam_groups: 1
    diversity_penalty: 0.0
    early_stopping: true
  kwargs_negative:
    num_beams: 1
    num_beam_groups: 1
    diversity_penalty: 0.0
    early_stopping: false
  expected_outcome:
    outcome: dormant_announced
    emission_channel: logger_warning_once
    normalised_fields: &id001 []
  message_template: '`num_beams` is set to 1. However, `early_stopping` is set to
    `True` -- this flag is only used in beam-based generation modes. You should set
    `num_beams>1` or unset `early_stopping`.'
  references:
  - "transformers.GenerationConfig.validate() \u2014 observed via validate(strict=True)"
  added_by: dynamic_miner
  added_at: '2026-04-30'
  conflict_note: 'id: dynamic_miner -> ''transformers_beam_search_num_beams_eq_1'';
    dynamic_miner -> ''transformers_early_stopping_type_num_beams_eq_1'''
