name: Clean workspace (fix root-owned files from prior Docker runs)
description: >
  Delete root-owned files left by prior container runs in the runner's
  workspace. Container-written artefacts persist as root-owned on
  self-hosted runners and break subsequent checkouts otherwise. Uses an
  Alpine container to perform the deletion as root, scoped to files not
  owned by the current runner UID. Mirrors the pattern in gpu-ci.yml.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        docker run --rm \
          -v "${GITHUB_WORKSPACE}":/workspace \
          alpine sh -c "find /workspace -not -user $(id -u) -delete 2>/dev/null || true"
