name: Synthesize passwd/group for non-root container runs
description: >
  Generate synthetic passwd/group entries for the runner UID/GID at
  /tmp/llem-passwd-synth and /tmp/llem-group-synth, ready to be mounted
  into containers as /etc/passwd and /etc/group. Required on self-hosted
  runners that resolve users via LDAP/SSSD (the runner UID isn't in
  /etc/passwd on the host, so getpwuid() fails inside the container).

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        printf 'ciuser:x:%s:%s:CI runner:/tmp:/bin/sh\n' "$(id -u)" "$(id -g)" > /tmp/llem-passwd-synth
        printf 'cigroup:x:%s:\n' "$(id -g)" > /tmp/llem-group-synth
