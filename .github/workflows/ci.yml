name: CI

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run (all, lint, type-check, test, package-validation, docs-freshness)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lint
          - type-check
          - test
          - package-validation
          - docs-freshness
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "true"
  UV_NO_PROGRESS: "1"

jobs:
  filter:
    # Always runs (including on workflow_dispatch). Cost is trivial; downstream jobs depend on its outputs.
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      docker: ${{ steps.changes.outputs.docker }}
      workflows: ${{ steps.changes.outputs.workflows }}
      docs_inputs: ${{ steps.changes.outputs.docs_inputs }}
      plugin_kwargs: ${{ steps.changes.outputs.plugin_kwargs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - 'pyproject.toml'
              # Version-bump PRs move the pin under engine_versions/ (not
              # docker/), and schema-version-check exists to gate exactly
              # those. Without this the job never runs on a bump PR.
              - 'engine_versions/**'
            workflows:
              - '.github/workflows/**'
            docs_inputs:
              # Inputs to the docs-freshness job: Pydantic models the
              # generators introspect, anything under scripts/ (generators
              # plus their transitive helpers like engine_producers/_ssot.py),
              # and this workflow file (self-test). pyproject/uv.lock
              # excluded: env-break would surface in lint / type-check /
              # test / package-validation before docs-freshness anyway.
              # docs/reference/** holds the generated pages docs-freshness
              # regenerates and diffs; an edit there must trip the check.
              - 'src/**'
              - 'scripts/**'
              - 'docs/reference/**'
              - '.github/workflows/ci.yml'
            plugin_kwargs:
              # Inputs to plugin-kwarg-check: the hand-written translation
              # layers, the mined schema surface they answer to (pin plus
              # versioned snapshot), the workspace path resolver, the checker
              # itself, and this workflow file (self-test).
              - 'src/llenergymeasure/engines/*/plugin.py'
              - 'engine_versions/_outputs.py'
              - 'engine_versions/*/current.yaml'
              - 'engine_versions/*/*/outputs/schema.discovered.json'
              - 'scripts/check_plugin_kwargs.py'
              - '.github/workflows/ci.yml'

  lint:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'lint'))
        || needs.filter.outputs.src == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: lint-3.12
          python-version: "3.12"
      - run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/engine_producers/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/engine_producers/
      - name: Architecture lint
        run: uv run lint-imports
      - name: Defensive lint - no stale Dockerfile.tensorrt
        # The pre-PR-509 first-party Dockerfile.tensorrt was deleted in
        # favour of upstream-direct nvcr.io/nvidia/tensorrt-llm dispatch
        # plus an entrypoint-prime overlay. A stale local Dockerfile.tensorrt
        # would cause llenergymeasure:tensorrt builds that link against
        # the wrong CUDA driver (the cuKernelGetName ABI bug). This guard
        # fails CI if anyone reintroduces it.
        run: |
          if [ -e docker/Dockerfile.tensorrt ]; then
            echo "::error::docker/Dockerfile.tensorrt is gone for a reason - see version_handshake.py + scripts/container_entrypoint.sh"
            exit 1
          fi

  type-check:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'type-check'))
        || needs.filter.outputs.src == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: typecheck-3.12
          python-version: "3.12"
      - run: uv sync --dev
      - name: mypy
        run: uv run mypy src/ tests/ scripts/engine_producers/

  test:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'test'))
        || needs.filter.outputs.src == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: test-3.12
          python-version: "3.12"
      - run: uv sync --dev --extra codecarbon --extra zeus
      - name: Unit + integration tests
        # Engines run only inside their Docker images; tests that import an
        # engine library (transformers/vllm/tensorrt-llm) gate themselves
        # via pytest.importorskip and are skipped on the host runner.
        # Coverage threshold is enforced via fail_under in [tool.coverage.report]
        # (pytest-cov reads it automatically); no CLI flag needed.
        run: uv run pytest tests/ -m "not gpu and not docker" -n auto -v --tb=short --durations=10 --cov=llenergymeasure --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ci-${{ github.sha }}
          path: coverage.xml
          retention-days: 30
          if-no-files-found: ignore
      - name: Import validation
        run: uv run python -c "from llenergymeasure import run_experiment, ExperimentConfig, ExperimentResult; print('OK')"

  package-validation:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'package-validation'))
        || needs.filter.outputs.src == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: pkg-3.12
          python-version: "3.12"
      - run: uv build --wheel
      - name: Install wheel and smoke-test CLI
        # Real smoke on the clean venv: the public API imports, and the `llem`
        # console entry point resolves and runs its read-only commands to a
        # zero exit. `set -e` (the default GitHub Actions shell flag) fails the
        # step on any non-zero exit. CPU-only and fast: `llem config` degrades
        # to "No GPU detected" on a device-less runner and always exits 0.
        run: |
          python -m venv /tmp/pkg-check
          /tmp/pkg-check/bin/pip install dist/*.whl --quiet
          /tmp/pkg-check/bin/python -c "from llenergymeasure import run_experiment, ExperimentConfig, ExperimentResult; print('Public API import OK')"
          /tmp/pkg-check/bin/llem --help
          /tmp/pkg-check/bin/llem config
      - name: Version sync check
        run: |
          PYPROJECT_VER=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          VERSION_VER=$(python3 -c "import re; s=open('src/llenergymeasure/_version.py').read(); print(re.search(r'__version__[^=]*=\s*\"([^\"]+)\"', s).group(1))")
          echo "pyproject.toml: ${PYPROJECT_VER}"
          echo "_version.py:    ${VERSION_VER}"
          [ "$PYPROJECT_VER" = "$VERSION_VER" ] || { echo "ERROR: Version mismatch: pyproject.toml=${PYPROJECT_VER}, _version.py=${VERSION_VER}"; exit 1; }

  docs-freshness:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'docs-freshness'))
        || needs.filter.outputs.docs_inputs == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: docs-3.12
          python-version: "3.12"
      - run: uv sync --dev
      - name: Check generated docs are current
        run: make docs-check
      - name: Check Pydantic-discovered schema alignment
        run: uv run python scripts/check_pydantic_matches_discovered.py > /dev/null

  actionlint:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'pull_request' && needs.filter.outputs.workflows == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          # github-pr-check posts findings as Check Run annotations
          # (inline file annotations + check-run summary), NOT as
          # chat-style review comments per finding. Same lint coverage,
          # without the inline-comment spam every workflow edit produced.
          reporter: github-pr-check
          # Only fail CI on errors, not warnings. SC2046 etc. surface as
          # annotations but don't gate. fail_on_error (deprecated) was
          # gating on any finding.
          fail_level: error

  schema-version-check:
    needs: filter
    if: >-
      always()
      && needs.filter.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [transformers, vllm, tensorrt]
    steps:
      - uses: actions/checkout@v6
      - name: Check ${{ matrix.engine }} schema version matches current.yaml pin
        run: python3 scripts/check_discovered_schema_versions.py --engine ${{ matrix.engine }}

  plugin-kwarg-check:
    # Standing lint between the glue code and the mined knowledge: every
    # constructor-kwarg name a plugin's translation layer hand-types as a
    # string literal must exist in that engine's discovered schema at the
    # current pin (or carry an allowlist rationale in the script). Runs on
    # the runner's bare python3 like schema-version-check; the script needs
    # only stdlib + yaml and never imports the package.
    needs: filter
    if: >-
      always()
      && needs.filter.outputs.plugin_kwargs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check hand-typed plugin kwargs against the mined schema
        run: python3 scripts/check_plugin_kwargs.py
