name: CI

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run (all, lint, type-check, test, package-validation, docs-freshness)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lint
          - type-check
          - test
          - package-validation
          - docs-freshness
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "true"
  UV_NO_PROGRESS: "1"

jobs:
  filter:
    # Always runs (including on workflow_dispatch). Cost is trivial; downstream jobs depend on its outputs.
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      docker: ${{ steps.changes.outputs.docker }}
      workflows: ${{ steps.changes.outputs.workflows }}
      docs_inputs: ${{ steps.changes.outputs.docs_inputs }}
      corpus_parity: ${{ steps.changes.outputs.corpus_parity }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - 'pyproject.toml'
            workflows:
              - '.github/workflows/**'
            docs_inputs:
              # Inputs to the docs-freshness job: Pydantic models the
              # generators introspect, anything under scripts/ (generators
              # plus their transitive helpers like engine_producers/_ssot.py),
              # and this workflow file (self-test). pyproject/uv.lock
              # excluded: env-break would surface in lint / type-check /
              # test / package-validation before docs-freshness anyway.
              - 'src/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            corpus_parity:
              # F#6: triggers the corpus + config parity checks in the
              # lint job. The `src:` filter excludes engine_versions/**
              # and scripts/engine_producers/**, so PRs editing ONLY the
              # archive (e.g. cells writeback, manual archive correction)
              # would silently bypass the parity gate. This filter closes
              # that hole without forcing test + type-check + package
              # validation to also run on pure-data PRs.
              - 'engine_versions/**'
              - 'src/llenergymeasure/engines/**'
              - 'scripts/engine_producers/regen_engine_corpus.py'
              - 'scripts/engine_producers/regen_engine_configs.py'
              - 'scripts/engine_producers/_current.py'
              - '.github/workflows/ci.yml'

  lint:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'lint'))
        || needs.filter.outputs.src == 'true'
        || needs.filter.outputs.corpus_parity == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: lint-3.12
          python-version: "3.12"
      - run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
      - name: Architecture lint
        run: uv run lint-imports
      - name: Defensive lint - no stale Dockerfile.tensorrt
        # The pre-PR-509 first-party Dockerfile.tensorrt was deleted in
        # favour of upstream-direct nvcr.io/nvidia/tensorrt-llm dispatch
        # plus an entrypoint-prime overlay. A stale local Dockerfile.tensorrt
        # would cause llenergymeasure:tensorrt builds that link against
        # the wrong CUDA driver (the cuKernelGetName ABI bug). This guard
        # fails CI if anyone reintroduces it.
        run: |
          if [ -e docker/Dockerfile.tensorrt ]; then
            echo "::error::docker/Dockerfile.tensorrt is gone for a reason - see version_handshake.py + scripts/container_entrypoint.sh"
            exit 1
          fi
      - name: Engine corpus shadow parity check
        # The loader reads from src/llenergymeasure/engines/<engine>/ (the
        # data shadow), but the SSOT lives at
        # engine_versions/<engine>/v<safe>/outputs/. Cells writeback both
        # locations atomically; this gate fails CI if a human edits one
        # without re-syncing the other.
        run: uv run python scripts/engine_producers/regen_engine_corpus.py --check

      - name: Engine config.py codegen parity check
        # Generated Pydantic class src/llenergymeasure/engines/<e>/config.py
        # must match what regen_engine_configs.py would produce from the
        # per-version schema.discovered.json + curated.yaml. Drift means
        # someone hand-edited the generated file (should NOT happen - it
        # has a DO NOT EDIT header) or forgot to regen after editing
        # curated.yaml. Either way, this gate makes it loud.
        run: uv run python scripts/engine_producers/regen_engine_configs.py --check

  type-check:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'type-check'))
        || needs.filter.outputs.src == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: typecheck-3.12
          python-version: "3.12"
      - run: uv sync --dev
      - name: mypy
        run: uv run mypy src/

  test:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'test'))
        || needs.filter.outputs.src == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: test-3.12
          python-version: "3.12"
      - run: uv sync --dev --extra codecarbon --extra zeus
      - name: Unit + integration tests
        # Engines run only inside their Docker images; tests that import an
        # engine library (transformers/vllm/tensorrt-llm) gate themselves
        # via pytest.importorskip and are skipped on the host runner.
        run: uv run pytest tests/ -m "not gpu and not docker" -n auto -v --tb=short --cov=llenergymeasure --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ci-${{ github.sha }}
          path: coverage.xml
          retention-days: 30
          if-no-files-found: ignore
      - name: Import validation
        run: uv run python -c "from llenergymeasure import run_experiment, ExperimentConfig, ExperimentResult; print('OK')"

  package-validation:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'package-validation'))
        || needs.filter.outputs.src == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: pkg-3.12
          python-version: "3.12"
      - run: uv build --wheel
      - name: Install and validate
        run: |
          python -m venv /tmp/pkg-check
          /tmp/pkg-check/bin/pip install dist/*.whl --quiet
          /tmp/pkg-check/bin/python -c "
          from llenergymeasure import run_experiment, ExperimentConfig, ExperimentResult
          print('Package install OK')
          "
      - name: Version sync check
        run: |
          PYPROJECT_VER=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          VERSION_VER=$(python3 -c "import re; s=open('src/llenergymeasure/_version.py').read(); print(re.search(r'__version__[^=]*=\s*\"([^\"]+)\"', s).group(1))")
          echo "pyproject.toml: ${PYPROJECT_VER}"
          echo "_version.py:    ${VERSION_VER}"
          [ "$PYPROJECT_VER" = "$VERSION_VER" ] || { echo "ERROR: Version mismatch: pyproject.toml=${PYPROJECT_VER}, _version.py=${VERSION_VER}"; exit 1; }

  docs-freshness:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'docs-freshness'))
        || needs.filter.outputs.docs_inputs == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: docs-3.12
          python-version: "3.12"
      - run: uv sync --dev
      - name: Verify doc generation scripts
        run: |
          uv run python scripts/generate_config_docs.py > /dev/null
          uv run python scripts/generate_cli_reference.py > /dev/null
          uv run python scripts/generate_invalid_combos_doc.py > /dev/null
          uv run python scripts/generate_curation_doc.py > /dev/null
      - name: Check Pydantic-discovered schema alignment
        run: uv run python scripts/check_pydantic_matches_discovered.py > /dev/null

  actionlint:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'pull_request' && needs.filter.outputs.workflows == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          # github-pr-check posts findings as Check Run annotations
          # (inline file annotations + check-run summary), NOT as
          # chat-style review comments per finding. Same lint coverage,
          # without the inline-comment spam every workflow edit produced.
          reporter: github-pr-check
          # Only fail CI on errors, not warnings. SC2046 etc. surface as
          # annotations but don't gate. fail_on_error (deprecated) was
          # gating on any finding.
          fail_level: error

  schema-version-check:
    needs: filter
    if: >-
      always()
      && needs.filter.outputs.docker == 'true'
      && !contains(github.event.pull_request.labels.*.name, 'renovate')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [transformers, vllm, tensorrt]
    steps:
      - uses: actions/checkout@v6
      - name: Check ${{ matrix.engine }} schema version aligns with Dockerfile
        run: python3 scripts/check_discovered_schema_versions.py --engine ${{ matrix.engine }}
