name: Publish engine image (transformers)

# Promotes the transformers runtime image (cache repo → canonical repo)
# via tag-copy. NO rebuild - the PR that just merged validated the
# image at transformers-cache:<VER>; this workflow creates new tag refs
# pointing at the same image digest. Production users get the
# bit-identical image that CI validated before merge.
#
# Triggered ONLY on push to main when SSOT or Dockerfile changed
# (i.e. a Renovate-driven version bump or a Dockerfile edit landed). On
# such pushes, the cache image at transformers-cache:<VER> is already
# in the registry from the merging PR's build. We just promote it.
#
# NOT triggered on pull_request: PR-time runtime image lives at
# transformers-cache:<VER> (build-engine-image.yml pushes it on PR);
# downstream update-engine-{invariants,schemas} cells consume it
# directly. Production tags shouldn't move during PR cycles.

on:
  push:
    branches: [main]
    paths:
      - "engine_versions/transformers.yaml"
      - "docker/Dockerfile.transformers"
  workflow_dispatch:
    # Ad-hoc trigger for re-promotion (e.g. recovering from a transient
    # registry failure, or promoting after a manual dispatch of
    # build-engine-image.yml). Reads SSOT current_version + tag-copies
    # the existing transformers-cache:<VER> to canonical tags.
    inputs:
      version:
        description: "Override version (defaults to SSOT current_version)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: engine-image-promote-${{ github.sha }}
  cancel-in-progress: false

jobs:
  promote-transformers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve transformers version from SSOT
        id: version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [[ -z "$VER" ]]; then
            VER=$(yq '.library.current_version' engine_versions/transformers.yaml)
          fi
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve transformers version from engine_versions/transformers.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote cache image to production tags via tag-copy
        # `docker buildx imagetools create` is a registry-side metadata
        # operation: creates new tag refs pointing at the existing image
        # digest. No rebuild, no layer copy. The promoted image is
        # bit-identical to the one validated by
        # update-engine-{invariants,schemas} on the PR cycle that just
        # merged - exactly what we want for a production release.
        env:
          VER: ${{ steps.version.outputs.version }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE="${REPO}/transformers-cache:transformers-${VER}"
          docker buildx imagetools create \
            -t "${REPO}/transformers:transformers-${VER}" \
            -t "${REPO}/transformers:latest" \
            "$SOURCE"

      - name: Emit promote summary
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Engine image promotion"
            echo
            echo "- Trigger: \`${{ github.event_name }}\` on \`${{ github.ref }}\`"
            echo "- Transformers version: \`${VER}\`"
            echo "- Source: \`transformers-cache:transformers-${VER}\`"
            echo "- Promoted to: \`transformers:transformers-${VER}\` + \`transformers:latest\`"
            echo "- Mechanism: \`docker buildx imagetools create\` (tag-copy; bit-identical promotion)"
          } >> "$GITHUB_STEP_SUMMARY"
