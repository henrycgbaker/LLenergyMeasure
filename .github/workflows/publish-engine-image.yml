name: Publish engine image (transformers)

# Promotes the transformers runtime image (cache repo -> canonical repo)
# via tag-copy. NO rebuild - this workflow creates new tag refs pointing
# at the same image digest, so production users get the bit-identical
# image that was seeded before the merge.
#
# The promotion source at transformers-cache:transformers-<VER> is seeded
# LOCALLY by the maintainer (make docker-seed-transformers) as part of
# the transformers bump session, before or alongside the bump PR. CI
# never builds this image: the flash-attention compile needs more memory
# than hosted runners have, and image production is a local maintainer
# task in the same way rule and schema production is.
#
# Triggered ONLY on push to main when current.yaml or Dockerfile changed
# (i.e. a version bump or a Dockerfile edit landed). If the seed was
# forgotten, the tag-copy step fails loudly (no source manifest at
# transformers-cache:transformers-<VER>); recovery is to seed locally
# and re-run via workflow_dispatch. Production tags never move during
# PR cycles.

on:
  push:
    branches: [main]
    paths:
      - "engine_versions/transformers/current.yaml"
      - "docker/Dockerfile.transformers"
  workflow_dispatch:
    # Ad-hoc trigger for re-promotion (e.g. recovering from a transient
    # registry failure, or promoting after a late local seed). Reads
    # current.yaml current_version + tag-copies the existing
    # transformers-cache:<VER> to canonical tags.
    inputs:
      version:
        description: "Override version (defaults to current.yaml current_version)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: engine-image-promote-${{ github.sha }}
  cancel-in-progress: false

jobs:
  promote-transformers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve transformers version from current.yaml
        id: version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [[ -z "$VER" ]]; then
            VER=$(yq '.library.current_version' engine_versions/transformers/current.yaml)
          fi
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve transformers version from engine_versions/transformers/current.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote cache image to production tags via tag-copy
        # `docker buildx imagetools create` is a registry-side metadata
        # operation: creates new tag refs pointing at the existing image
        # digest. No rebuild, no layer copy. The promoted image is
        # bit-identical to the locally seeded one - exactly what we want
        # for a production release. Fails here if the seed is missing.
        env:
          VER: ${{ steps.version.outputs.version }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE="${REPO}/transformers-cache:transformers-${VER}"
          docker buildx imagetools create \
            -t "${REPO}/transformers:transformers-${VER}" \
            -t "${REPO}/transformers:latest" \
            "$SOURCE"

      - name: Emit promote summary
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Engine image promotion"
            echo
            echo "- Trigger: \`${{ github.event_name }}\` on \`${{ github.ref }}\`"
            echo "- Transformers version: \`${VER}\`"
            echo "- Source: \`transformers-cache:transformers-${VER}\`"
            echo "- Promoted to: \`transformers:transformers-${VER}\` + \`transformers:latest\`"
            echo "- Mechanism: \`docker buildx imagetools create\` (tag-copy; bit-identical promotion)"
          } >> "$GITHUB_STEP_SUMMARY"
