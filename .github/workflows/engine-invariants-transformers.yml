name: Engine Invariants — transformers (Probe + Mine + Vendor)

# Transformers cell of the engine-invariants pipeline. Sequenced after
# Engine Image Build via workflow_run: the heavy Docker build happens once
# in engine-image-build.yml; this workflow pulls the resulting image and
# runs probe + mine + vendor + writeback.
#
# The vllm and tensorrt cells remain in engine-invariants.yml with the
# original pull_request: paths trigger — they pull upstream images directly
# (no first-party build) so they don't depend on engine-image-build.yml.
#
# Determinism contract:
#   The LLENERGY_MINER_FROZEN_AT and LLENERGY_VENDOR_FROZEN_AT env vars are
#   set from the author date of the most recent commit touching any INPUT
#   path. Re-runs on unchanged source emit byte-identical YAML.

on:
  workflow_run:
    workflows: ["Engine Image Build (transformers)"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  # workflow_run.head_sha distinguishes per-PR runs; head_branch is
  # available on PR-triggered runs only, so fall back to head_sha to keep
  # group strings stable for push / schedule triggers.
  group: engine-invariants-transformers-${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  CORPUS_DIR: configs/engine_invariants

jobs:
  invariants-transformers:
    # Skip the whole job if the upstream build failed: there's no image to
    # pull, so probe + mine would error anyway. Surfacing red on the build
    # workflow is sufficient.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # No build step here — pure probe + mine + vendor. 30 min is generous.
    timeout-minutes: 30
    steps:
      - name: Mint llem-ci-bot App token
        # Short-lived (~1 hour) GitHub App token. Events it produces are
        # NOT subject to the default GITHUB_TOKEN recursive-workflow guard,
        # so the commit-back below can legitimately retrigger downstream
        # CI. Skipped on fork PRs (secrets are not exposed in workflow_run
        # contexts triggered from forks) so the workflow still runs read-
        # only for external contributors.
        id: app-token
        if: github.event.workflow_run.head_repository.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout PR head
        # workflow_run runs on the default branch by default. Explicitly
        # check out the head SHA of the run that triggered us so the mine
        # + writeback operate on the right code.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve transformers version from SSOT
        id: version
        run: |
          VER=$(yq '.library.current_version' engine_versions/transformers.yaml)
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve transformers version from engine_versions/transformers.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=llenergymeasure:transformers-${VER}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number (for comments + labels + writeback)
        id: pr
        # workflow_run.pull_requests is empty for cross-fork PRs; gracefully
        # downgrade to no-comment / no-writeback in that case. Same-repo
        # PRs and push events provide what we need.
        run: |
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [[ -n "$PR_NUMBER" ]]; then
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "head_repo=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR (read-only, for image pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built transformers image and tag locally
        # PR-triggered upstream runs publish to the transformers-cache repo;
        # push-triggered upstream runs publish to the canonical repo's
        # per-version tag. Either way we re-tag to the local convenience
        # tag the rest of this job consumes.
        run: |
          if [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            UPSTREAM="ghcr.io/${{ github.repository }}/transformers-cache:transformers-${{ steps.version.outputs.version }}"
          else
            UPSTREAM="ghcr.io/${{ github.repository }}/transformers:transformers-${{ steps.version.outputs.version }}"
          fi
          docker pull "$UPSTREAM"
          docker tag "$UPSTREAM" "${{ steps.version.outputs.image }}"

      - name: Compute stable mining + vendor anchor
        id: anchor
        run: |
          PATHS=(
            "engine_versions/transformers.yaml"
            "docker/Dockerfile.transformers"
            "scripts/engine_miners/transformers_static_miner.py"
            "scripts/engine_miners/transformers_dynamic_miner.py"
            "scripts/engine_miners/transformers_miner.py"
            "scripts/engine_miners/build_corpus.py"
            "scripts/engine_miners/_base.py"
            "scripts/engine_miners/_pydantic_lift.py"
            "scripts/engine_miners/_msgspec_lift.py"
            "scripts/engine_miners/_dataclass_lift.py"
            "scripts/engine_miners/_fixpoint_test.py"
            "scripts/vendor_rules.py"
            "scripts/_invariant_vendor_common.py"
            "scripts/refresh_invariant_rules.sh"
          )
          SHA=$(git log -1 --format=%H -- "${PATHS[@]}")
          DATE=$(git log -1 --format=%aI -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          echo "sha=${SHA:-${{ github.event.workflow_run.head_sha }}}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Probe — landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts._probe --engine transformers --producer invariants \
            > /tmp/probe-transformers.json
          VERDICT=$(jq -r '.verdict' /tmp/probe-transformers.json)
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"

      - name: Save current YAMLs for diffing
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          mkdir -p /tmp/engine-invariants-diff
          for KIND in proposed vendored; do
            OLD_YAML="${CORPUS_DIR}/transformers.${KIND}.yaml"
            DEST="/tmp/engine-invariants-diff/transformers.${KIND}.old.yaml"
            if [[ -f "$OLD_YAML" ]]; then
              cp "$OLD_YAML" "$DEST"
            else
              : > "$DEST"
            fi
          done

      - name: Mine + vendor inside container
        if: steps.probe.outputs.verdict == 'pass'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ANCHOR_SHA: ${{ steps.anchor.outputs.sha }}
          ANCHOR_DATE: ${{ steps.anchor.outputs.date }}
        run: |
          docker run --rm \
            -e LLENERGY_MINER_FROZEN_AT="${ANCHOR_DATE}" \
            -e LLENERGY_VENDOR_FROZEN_AT="${ANCHOR_DATE}" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint bash \
            "$IMAGE" \
            -c "
              set -euo pipefail
              python3 -m scripts.engine_miners.build_corpus --engine transformers
              python3 scripts/vendor_rules.py \
                --engine transformers \
                --corpus '${CORPUS_DIR}/transformers.proposed.yaml' \
                --out '${CORPUS_DIR}/transformers.vendored.yaml' \
                --vendor-commit '${ANCHOR_SHA}' \
                --fail-on-divergence
            "

      - name: Set up Python (host) for doc-gen + diff
        if: steps.probe.outputs.verdict == 'pass'
        # Doc generator + differ run on the host (no engine import needed,
        # but they DO import llenergymeasure.* + scripts.engine_miners.*).
        # `uv sync --dev` installs the lean host project (no engine extras).
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-invariants-transformers-docgen-3.12
          python-version: "3.12"

      - name: Install lean host project for doc-gen
        if: steps.probe.outputs.verdict == 'pass'
        run: uv sync --dev

      - name: Regenerate invariants digest doc
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          uv run python scripts/generate_invariants_doc.py \
            --engine transformers \
            --out docs/generated/invariants-transformers.md

      - name: Classify diff (proposed + vendored)
        if: steps.probe.outputs.verdict == 'pass'
        id: diff
        run: |
          set +e
          uv run python scripts/diff_engine_invariants.py \
            /tmp/engine-invariants-diff/transformers.vendored.old.yaml \
            "${CORPUS_DIR}/transformers.vendored.yaml" \
            --out /tmp/engine-invariants-diff/transformers.vendored.md \
            --title "Transformers vendored invariants diff"
          VENDORED_EXIT=$?
          set -e

          PROPOSED_CHANGED=true
          if diff -q /tmp/engine-invariants-diff/transformers.proposed.old.yaml \
                    "${CORPUS_DIR}/transformers.proposed.yaml" >/dev/null 2>&1; then
            PROPOSED_CHANGED=false
          fi

          VENDORED_CHANGED=true
          if diff -q /tmp/engine-invariants-diff/transformers.vendored.old.yaml \
                    "${CORPUS_DIR}/transformers.vendored.yaml" >/dev/null 2>&1; then
            VENDORED_CHANGED=false
          fi

          if [[ "$PROPOSED_CHANGED" == "false" && "$VENDORED_CHANGED" == "false" ]]; then
            CLASSIFICATION="no-changes"
          elif [[ $VENDORED_EXIT -eq 1 ]]; then
            CLASSIFICATION="breaking"
          else
            CLASSIFICATION="safe"
          fi
          echo "classification=${CLASSIFICATION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Engine invariants — transformers"
            echo
            if [[ "$CLASSIFICATION" == "no-changes" ]]; then
              echo "_No changes to proposed or vendored invariants._"
            else
              if [[ "$PROPOSED_CHANGED" == "true" ]]; then
                echo "### Proposed corpus diff"
                echo
                echo '```diff'
                diff -u /tmp/engine-invariants-diff/transformers.proposed.old.yaml \
                        "${CORPUS_DIR}/transformers.proposed.yaml" | head -n 200 || true
                echo '```'
                echo
              fi
              if [[ -f /tmp/engine-invariants-diff/transformers.vendored.md ]]; then
                cat /tmp/engine-invariants-diff/transformers.vendored.md
              fi
            fi
          } > /tmp/engine-invariants-diff/transformers.summary.md

      - name: Probe-fail comment (skip downstream)
        if: steps.probe.outputs.verdict == 'fail' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          {
            echo "## Engine invariants — transformers (probe-blocked)"
            echo
            echo "**Probe failed.** Producer landmarks no longer resolve under the installed library."
            echo
            echo "**Missing landmarks:**"
            echo
            jq -r '.landmarks_missing[] | "- `" + . + "`"' /tmp/probe-transformers.json
            echo
            echo "**Downstream mine + vendor steps were skipped.** No corpus changes were committed against this PR."
            echo
            echo "**To unblock,** choose one of:"
            echo
            echo "- **Patch the producer module's landmarks** — required when the library has genuinely renamed or removed the missing symbols. The miner code needs updating to match the new library API."
            echo "- **Run \`@llem-ci-bot /approve-reuse transformers invariants\`** — widens the SSOT pin envelope to declare \"the existing miner code is valid for this library version too.\" Only useful when the library bumped *past* the miner's previously-validated version range but the landmarks still resolve."
            echo
            echo "**The probe is the canonical gate** — \`/approve-reuse\` does not bypass it. It only widens the version-pin so the version check stops blocking. If landmarks were genuinely renamed, only a producer-module patch will turn the probe green. CI stays red until the probe verdict flips to \`pass\`."
          } | gh pr comment "$PR_NUMBER" --body-file -
          gh pr edit "$PR_NUMBER" --add-label "probe-blocked" 2>/dev/null || true

      - name: Upload diff artefact
        if: steps.probe.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: engine-invariants-diff-transformers
          path: |
            /tmp/engine-invariants-diff/transformers.proposed.old.yaml
            /tmp/engine-invariants-diff/transformers.vendored.old.yaml
            /tmp/engine-invariants-diff/transformers.summary.md
            ${{ env.CORPUS_DIR }}/transformers.proposed.yaml
            ${{ env.CORPUS_DIR }}/transformers.vendored.yaml

      - name: Post per-pipeline comment (suppress on empty)
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --body-file /tmp/engine-invariants-diff/transformers.summary.md

      - name: Apply per-pipeline label
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          for L in invariants-changed invariants-breaking invariants-safe probe-blocked; do
            gh pr edit "$PR_NUMBER" --remove-label "$L" 2>/dev/null || true
          done
          case "${{ steps.diff.outputs.classification }}" in
            breaking)  gh pr edit "$PR_NUMBER" --add-label "invariants-breaking" --add-label "invariants-changed" 2>/dev/null || true ;;
            safe)      gh pr edit "$PR_NUMBER" --add-label "invariants-safe" --add-label "invariants-changed" 2>/dev/null || true ;;
            no-changes) ;;
          esac

      - name: Atomic writeback
        # Sequential pipeline ordering (build → schemas → invariants) means
        # invariants is always the second writer; pull --rebase --autostash
        # absorbs the schemas writeback that landed first.
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.app-token.outputs.token != '' && steps.pr.outputs.number != '' && steps.pr.outputs.head_repo == github.repository
        run: |
          git config user.name  "llem-ci-bot[bot]"
          git config user.email "${{ secrets.APP_ID }}+llem-ci-bot[bot]@users.noreply.github.com"

          # Pull in any sibling-pipeline writeback that landed first.
          git pull --rebase --autostash

          git add \
            "${CORPUS_DIR}/transformers.proposed.yaml" \
            "${CORPUS_DIR}/transformers.vendored.yaml" \
            docs/generated/invariants-transformers.md

          if git diff --cached --quiet; then
            echo "No engine-invariants artefact changes to commit."
            exit 0
          fi

          git commit -m "chore(invariants): refresh transformers proposed + vendored corpus"
          git push --force-with-lease

      - name: Apply cross-pipeline rollup label
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          if [[ "${{ steps.diff.outputs.classification }}" != "breaking" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "safe-bump" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --remove-label "safe-bump" 2>/dev/null || true
          fi

      - name: Probe-fail gate (red CI)
        # Probe-fail must show as a red CI check: PRs cannot merge with a
        # stale corpus. The probe-blocked comment above explains how to
        # resolve (/approve-reuse to widen the SSOT envelope, or landmark
        # patch); this gate makes that resolution mandatory rather than
        # advisory.
        if: steps.probe.outputs.verdict == 'fail'
        run: |
          echo "::error::Probe failed; downstream mining was skipped. CI is red until the probe-blocked comment is resolved."
          exit 1
