name: Engine rules check

# Verifies that the committed engine-knowledge artifacts stay internally
# consistent, on hosted CPU runners only. Producing that knowledge (reading an
# engine's source into rule and schema snapshots) is a local maintainer task;
# this workflow never mines. It only checks that what is already committed
# still hangs together:
#
#   1. config-codegen (gating): the generated config models under
#      src/llenergymeasure/engines/<engine>/config.py are byte-identical to
#      what the committed schema snapshot regenerates. A stale config fails.
#
#   2. rules-coverage (advisory): scans the pinned engine source for
#      validator sites and reports the sites no shipped rule covers. It never
#      fails the job, so coverage gaps are visible without blocking.
#
#   3. seed-image-check (gating): the transformers runtime image is seeded
#      locally before a bump lands (make docker-seed-transformers) and
#      tag-copied on merge by publish-engine-image.yml. This checks the seed
#      for the current pin already exists in GHCR, so a bump PR that forgot to
#      seed fails at PR time rather than at merge-time promotion.
#
# transformers is absent from the coverage report on purpose: its config
# validation uses imperative post-init idioms that the validator-site model
# does not recognise, so a coverage number there would be noise. It is still
# covered by the gating codegen check.

on:
  # No workflow-level paths: filter. The jobs must report a check-run context
  # on EVERY pull request so branch protection can require them - a workflow
  # that paths-skips never reports, and a required check that never reports
  # blocks the PR forever with "Expected - waiting for status". The per-job
  # filter below skips (not omits) the work on non-engine PRs, and a skipped
  # required check counts as satisfied. Mirrors the ci.yml filter-job pattern.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: engine-rules-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Named engine-filter (not filter) so its check context is distinguishable
  # from ci.yml's filter job on the PR checks tab, and so branch protection
  # can require it unambiguously (fail-closed for the codegen gates).
  engine-filter:
    # Always runs (including on workflow_dispatch). Cost is trivial; downstream
    # jobs depend on its output. `engine` is the union of the paths this
    # workflow previously used as its workflow-level paths: filter.
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.changes.outputs.engine }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          # No base: - this workflow has no push trigger, so on its only
          # events (pull_request, workflow_dispatch) the action diffs against
          # the PR base branch by default. A base: expression here would be
          # dead (ci.yml needs it only because ci.yml also runs on push).
          filters: |
            engine:
              - 'src/llenergymeasure/engines/*/config.py'
              - 'src/llenergymeasure/engines/*/rules.yaml'
              - 'src/llenergymeasure/config/engine_rules/**'
              - 'engine_versions/*/current.yaml'
              - 'engine_versions/*/*/outputs/curated.yaml'
              - 'engine_versions/*/*/outputs/schema.discovered.json'
              - 'scripts/engine_producers/**'
              - 'scripts/rules_coverage.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/engine-rules-check.yml'

  config-codegen:
    needs: engine-filter
    if: >-
      always()
      && (
        github.event_name == 'workflow_dispatch'
        || needs.engine-filter.outputs.engine == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [transformers, vllm, tensorrt]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-rules-3.12
          python-version: "3.12"
      - name: Install project
        run: uv sync --dev
      - name: Resolve pinned version
        id: pin
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          version=$(uv run python -c "import yaml; print(yaml.safe_load(open('engine_versions/${ENGINE}/current.yaml'))['library']['current_version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned ${ENGINE} version: $version"
      - name: Verify generated config matches committed snapshot
        env:
          ENGINE: ${{ matrix.engine }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          uv run python scripts/engine_producers/regen_engine_configs.py \
            --engine "$ENGINE" --version "$VERSION" --check

  rules-coverage:
    name: rules-coverage (${{ matrix.engine }})
    needs: engine-filter
    if: >-
      always()
      && (
        github.event_name == 'workflow_dispatch'
        || needs.engine-filter.outputs.engine == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: vllm
            package_dir: vllm
            source_repo: https://github.com/vllm-project/vllm.git
          - engine: tensorrt
            package_dir: tensorrt_llm
            source_repo: https://github.com/NVIDIA/TensorRT-LLM.git
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-rules-3.12
          python-version: "3.12"
      - name: Install project
        run: uv sync --dev
      - name: Resolve pinned version
        id: pin
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          version=$(uv run python -c "import yaml; print(yaml.safe_load(open('engine_versions/${ENGINE}/current.yaml'))['library']['current_version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned ${ENGINE} version: $version"
      - name: Restore cached engine source
        id: cache
        uses: actions/cache@v4
        with:
          path: engine-source
          key: engine-source-${{ matrix.engine }}-${{ steps.pin.outputs.version }}
      - name: Fetch pinned engine source
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SOURCE_REPO: ${{ matrix.source_repo }}
          PACKAGE_DIR: ${{ matrix.package_dir }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          # Blobless sparse checkout of only the engine's Python package tree.
          # The full source archive for these projects is large (hundreds of MB
          # for the compiled-kernel engine) and is not affordable to pull on
          # every relevant PR; the coverage scan only reads the .py package.
          #
          # Retry the clone: a network flake against the upstream remote would
          # otherwise read as a red gate on an unrelated PR. Retry only, never
          # continue-on-error - a genuine clone failure (bad tag, dead repo)
          # must still hard-fail after the attempts are exhausted.
          set -euo pipefail
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            rm -rf engine-source
            if git clone --filter=blob:none --no-checkout --depth 1 \
              --branch "v${VERSION}" "$SOURCE_REPO" engine-source; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::Failed to clone ${SOURCE_REPO} at v${VERSION} after ${attempts} attempts." >&2
              exit 1
            fi
            echo "Clone attempt ${attempt}/${attempts} failed; retrying in 5s..." >&2
            sleep 5
          done
          git -C engine-source sparse-checkout init --cone
          git -C engine-source sparse-checkout set "$PACKAGE_DIR"
          git -C engine-source checkout
      - name: Report uncovered validator sites (advisory)
        env:
          ENGINE: ${{ matrix.engine }}
          PACKAGE_DIR: ${{ matrix.package_dir }}
        run: |
          src="engine-source/${PACKAGE_DIR}"
          set +e
          uv run python scripts/rules_coverage.py \
            --engine "$ENGINE" --source-root "$src" > coverage.txt 2>&1
          rc=$?
          set -e
          cat coverage.txt
          {
            echo "### Rules coverage: ${ENGINE} (advisory)"
            echo ''
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rules_coverage advisory exit code: $rc (job stays green regardless)"

  seed-image-check:
    name: seed-image-check (transformers)
    needs: engine-filter
    if: >-
      always()
      && (
        github.event_name == 'workflow_dispatch'
        || needs.engine-filter.outputs.engine == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
      - name: Resolve pinned version
        id: pin
        run: |
          version=$(yq '.library.current_version' engine_versions/transformers/current.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned transformers version: $version"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify transformers seed image exists in GHCR
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE="${REPO}/transformers-cache:transformers-${VERSION}"
          echo "Checking promotion source: ${SOURCE}"
          if docker manifest inspect "${SOURCE}" > /dev/null 2>&1; then
            echo "Seed image found: ${SOURCE}"
          else
            echo "::error::Seed image missing: ${SOURCE}"
            echo "The transformers runtime image for pin ${VERSION} was not seeded." >&2
            echo "Run 'make docker-seed-transformers' locally before merging this bump," >&2
            echo "otherwise the merge-time promotion (publish-engine-image.yml) will fail." >&2
            exit 1
          fi
