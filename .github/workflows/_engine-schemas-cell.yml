name: Engine schemas cell

# Reusable workflow invoked from engine-pipeline.yml's matrix fan-out.
# Runs probe + discover-schema for ONE engine, parameterised by inputs.
# Writeback is centralised in the orchestrator (per H4-fixed); this cell
# uploads its writeback content as an artefact and the orchestrator's
# aggregate writeback job collects all cell artefacts and performs a
# single git push.

on:
  workflow_call:
    inputs:
      engine:
        description: Engine name (transformers, vllm, tensorrt)
        required: true
        type: string
      runner:
        description: Runner kind (ubuntu-latest, self-hosted)
        required: true
        type: string
      image-source:
        description: Image source mode (ghcr-cache, dockerhub, ngc)
        required: true
        type: string
      pr-number:
        description: PR number for comment / label / artefact targeting (empty if not applicable)
        required: true
        type: string
      pr-head-repo:
        description: PR head repo full_name; used to gate writeback contributions on same-repo PRs only
        required: true
        type: string

jobs:
  cell:
    name: ${{ inputs.engine }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.runner == 'ubuntu-latest' && 30 || 360 }}
    env:
      ENGINES_DIR: src/llenergymeasure/engines
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "/repo/src:/repo"
    steps:
      - name: Mint llem-ci-bot App token
        # Per-cell mint (not forwarded from orchestrator) because GitHub
        # masks secret-derived job outputs to empty when crossing job
        # boundaries. Skipped on fork PRs (App secrets aren't available
        # cross-fork).
        id: app-token
        if: inputs.pr-head-repo == github.repository || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Clean workspace (fix root-owned files from prior Docker runs)
        if: inputs.runner == 'self-hosted'
        uses: ./.github/actions/clean-self-hosted-workspace

      - name: Synthesize passwd/group for non-root container runs
        if: inputs.runner == 'self-hosted'
        uses: ./.github/actions/synthesize-passwd

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve engine version from current.yaml
        id: version
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          VER=$(yq '.library.current_version' "engine_versions/${ENGINE}/current.yaml")
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve ${ENGINE} version from engine_versions/${ENGINE}/current.yaml" >&2
            exit 1
          fi
          # Python-identifier-safe form (dots and hyphens -> underscores) used as the
          # subpackage name under engine_versions/<engine>/.
          SAFE_VER="v${VER//[.-]/_}"
          {
            echo "version=${VER}"
            echo "safe_version=${SAFE_VER}"
            echo "image=llenergymeasure:${ENGINE}-${VER}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (read-only, for image pull)
        if: inputs.image-source == 'ghcr-cache'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub auth availability
        if: inputs.image-source == 'dockerhub'
        id: dockerhub_auth
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Docker Hub (if token configured)
        if: inputs.image-source == 'dockerhub' && steps.dockerhub_auth.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull engine image and tag locally
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image }}
          VER: ${{ steps.version.outputs.version }}
          ENGINE: ${{ inputs.engine }}
          IMAGE_SOURCE: ${{ inputs.image-source }}
          REPO: ${{ github.repository }}
        run: |
          case "$IMAGE_SOURCE" in
            ghcr-cache)
              UPSTREAM="ghcr.io/${REPO}/${ENGINE}-cache:${ENGINE}-${VER}"
              ;;
            dockerhub)
              UPSTREAM="vllm/vllm-openai:v${VER}"
              ;;
            ngc)
              UPSTREAM="nvcr.io/nvidia/tensorrt-llm/release:${VER}"
              ;;
            *)
              echo "Unknown image-source: ${IMAGE_SOURCE}" >&2
              exit 1
              ;;
          esac
          if ! docker image inspect "$UPSTREAM" >/dev/null 2>&1; then
            docker pull "$UPSTREAM"
          else
            echo "Image $UPSTREAM already cached locally; skipping pull."
          fi
          docker tag "$UPSTREAM" "$IMAGE_TAG"

      - name: Fetch tensorrt-llm source tarball (host)
        if: inputs.engine == 'tensorrt'
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DEST="/tmp/trt-llm-${VER}"
          if [[ -d "${DEST}/tensorrt_llm" ]]; then
            echo "Source tree already present at ${DEST}; skipping fetch."
            exit 0
          fi
          URL_TEMPLATE=$(yq '.source_tarball.url_template' engine_versions/tensorrt/current.yaml)
          if [[ -z "$URL_TEMPLATE" || "$URL_TEMPLATE" == "null" ]]; then
            echo "Could not resolve source_tarball.url_template from engine_versions/tensorrt/current.yaml" >&2
            exit 1
          fi
          URL="${URL_TEMPLATE//\{version\}/${VER}}"
          mkdir -p "${DEST}"
          curl -fsSL "${URL}" \
            | tar -xz -C "${DEST}" --strip-components=1
          test -d "${DEST}/tensorrt_llm"

      - name: Compute stable discovery anchor
        id: anchor
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          BASE_PATHS=(
            "engine_versions/${ENGINE}/current.yaml"
            "scripts/engine_producers/_common.py"
            "scripts/engine_producers/_schemas_runner.py"
            "scripts/engine_producers/${ENGINE}_schema_introspector.py"
          )
          ENGINE_PATHS=()
          if [[ "$ENGINE" == "transformers" ]]; then
            ENGINE_PATHS=( "docker/Dockerfile.transformers" )
          fi
          PATHS=("${BASE_PATHS[@]}" "${ENGINE_PATHS[@]}")
          # Exclude bot writeback commits from anchor calculation. See
          # _engine-rules-cell.yml for the full rationale; same loop-
          # breaking pattern applies here.
          DATE=$(git log -1 --format=%aI \
            --invert-grep --grep='^chore(bot): writeback' \
            -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Probe - landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
          RUNNER: ${{ inputs.runner }}
        run: |
          mkdir -p /tmp/llem-probe-out
          DOCKER_FLAGS=()
          if [[ "$RUNNER" == "self-hosted" ]]; then
            DOCKER_FLAGS+=(
              --gpus all
              --user "$(id -u):$(id -g)"
              -v /tmp/llem-passwd-synth:/etc/passwd:ro
              -v /tmp/llem-group-synth:/etc/group:ro
              -e LD_LIBRARY_PATH
            )
          fi
          ENTRYPOINT_FLAG=(--entrypoint python3)
          CMD_PREFIX=()
          if [[ "$ENGINE" == "tensorrt" ]]; then
            DOCKER_FLAGS+=( -v "/tmp/trt-llm-${VER}:/tmp/trt-llm-${VER}:ro" )
            ENTRYPOINT_FLAG=(--entrypoint /opt/nvidia/nvidia_entrypoint.sh)
            CMD_PREFIX=(python3)
          fi
          set +e
          docker run --rm "${DOCKER_FLAGS[@]}" \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -v /tmp/llem-probe-out:/llem-probe-out:rw \
            -w /repo \
            -e PYTHONPATH \
            -e PYTHONDONTWRITEBYTECODE \
            "${ENTRYPOINT_FLAG[@]}" \
            "$IMAGE" \
            "${CMD_PREFIX[@]}" -m scripts._drift --engine "$ENGINE" --producer schemas \
              --output "/llem-probe-out/probe-${ENGINE}.json"
          DRIFT_RC=$?
          set -e
          echo "::group::Drift report (probe-${ENGINE}.json)"
          cat "/tmp/llem-probe-out/probe-${ENGINE}.json" || true
          echo "::endgroup::"
          VERDICT=$(jq -r '.verdict' "/tmp/llem-probe-out/probe-${ENGINE}.json")
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          exit "$DRIFT_RC"

      - name: Save current schema for diffing
        if: steps.probe.outputs.verdict == 'pass'
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          mkdir -p /tmp/engine-schemas-diff
          OLD="${ENGINES_DIR}/${ENGINE}/schema.discovered.json"
          DEST="/tmp/engine-schemas-diff/${ENGINE}.old.json"
          if [[ -f "$OLD" ]]; then
            cp "$OLD" "$DEST"
          else
            echo '{}' > "$DEST"
          fi

      - name: Discover schema inside container
        # Knowledge is PRODUCED in the SSOT (engine_versions/<e>/v<pin>/outputs/):
        # the introspector writes schema.discovered.json there, then
        # regen_engine_corpus DERIVES the src/ shadow from it (the one
        # derivation; design section 4). Downstream doc-gen / diff / upload read
        # the derived shadow unchanged.
        if: steps.probe.outputs.verdict == 'pass'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
          SAFE_VER: ${{ steps.version.outputs.safe_version }}
          ANCHOR_DATE: ${{ steps.anchor.outputs.date }}
          RUNNER: ${{ inputs.runner }}
        run: |
          DOCKER_FLAGS=()
          if [[ "$RUNNER" == "self-hosted" ]]; then
            DOCKER_FLAGS+=(
              --gpus all
              --user "$(id -u):$(id -g)"
              -v /tmp/llem-passwd-synth:/etc/passwd:ro
              -v /tmp/llem-group-synth:/etc/group:ro
              -e LD_LIBRARY_PATH
            )
          fi
          ENTRYPOINT_FLAG=(--entrypoint python3)
          CMD_PREFIX=()
          if [[ "$ENGINE" == "tensorrt" ]]; then
            DOCKER_FLAGS+=( -v "/tmp/trt-llm-${VER}:/tmp/trt-llm-${VER}:ro" )
            ENTRYPOINT_FLAG=(--entrypoint /opt/nvidia/nvidia_entrypoint.sh)
            CMD_PREFIX=(python3)
          fi
          docker run --rm "${DOCKER_FLAGS[@]}" \
            -e LLENERGY_DISCOVERY_FROZEN_AT="${ANCHOR_DATE}" \
            -e PYTHONDONTWRITEBYTECODE \
            -e PYTHONPATH \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "${ENTRYPOINT_FLAG[@]}" \
            "$IMAGE" \
            "${CMD_PREFIX[@]}" -m scripts.engine_producers._schemas_runner \
              --engine "${ENGINE}" \
              --image-ref "${IMAGE}" \
              --output "engine_versions/${ENGINE}/${SAFE_VER}/outputs/schema.discovered.json"

      - name: Set up Python (host) for doc-gen + diff
        if: steps.probe.outputs.verdict == 'pass'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-schemas-${{ inputs.engine }}-docgen-3.12
          python-version: "3.12"

      - name: Install lean host project for doc-gen
        if: steps.probe.outputs.verdict == 'pass'
        run: uv sync --dev

      - name: Derive src/ shadow from the SSOT
        # The introspector produced schema.discovered.json in the SSOT
        # (engine_versions/<e>/v<pin>/outputs/); derive the src/ shadow the
        # downstream doc-gen + diff read (design section 4: the one derivation).
        # Scoped to --only schema: this cell runs in PARALLEL with the rules
        # cell, so on a fresh-version bump the SSOT has no rules.*.yaml yet
        # (the sibling cell writes them on its own runner). A full sync would
        # hard-fail on the missing siblings; the writeback's full --write owns
        # the complete sync once both cells' SSOTs are rsynced together.
        if: steps.probe.outputs.verdict == 'pass'
        env:
          ENGINE: ${{ inputs.engine }}
        run: uv run python scripts/engine_producers/regen_engine_corpus.py --write --only schema --engine "${ENGINE}"

      - name: Regenerate schemas digest
        if: steps.probe.outputs.verdict == 'pass'
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          uv run python scripts/generate_curation_doc.py \
            --engine "${ENGINE}" \
            --out "docs/user/generated/curation-${ENGINE}.md"

      - name: Regenerate schema doc
        if: steps.probe.outputs.verdict == 'pass'
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          uv run python scripts/generate_schema_doc.py \
            --engine "${ENGINE}" \
            --out "docs/user/generated/schema-${ENGINE}.md"

      - name: Classify diff
        if: steps.probe.outputs.verdict == 'pass'
        id: diff
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set +e
          uv run python scripts/diff_discovered_schemas.py \
            "/tmp/engine-schemas-diff/${ENGINE}.old.json" \
            "${ENGINES_DIR}/${ENGINE}/schema.discovered.json" \
            > "/tmp/engine-schemas-diff/${ENGINE}.diff.json"
          DIFF_EXIT=$?
          set -e

          if diff -q "/tmp/engine-schemas-diff/${ENGINE}.old.json" \
                    "${ENGINES_DIR}/${ENGINE}/schema.discovered.json" >/dev/null 2>&1; then
            CLASSIFICATION="no-changes"
          elif [[ $DIFF_EXIT -eq 1 ]]; then
            CLASSIFICATION="breaking"
          else
            CLASSIFICATION="safe"
          fi
          echo "classification=${CLASSIFICATION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Engine schemas - ${ENGINE}"
            echo
            if [[ "$CLASSIFICATION" == "no-changes" ]]; then
              echo "_No changes to discovered schema._"
            else
              SUMMARY=$(jq -r '.summary // "schema diff produced"' "/tmp/engine-schemas-diff/${ENGINE}.diff.json" 2>/dev/null || echo "schema diff produced")
              echo "${SUMMARY}"
              echo
              echo "<details><summary>Structured diff</summary>"
              echo
              echo '```json'
              jq '.' "/tmp/engine-schemas-diff/${ENGINE}.diff.json" 2>/dev/null | head -n 200 || true
              echo '```'
              echo
              echo "</details>"
            fi
          } > "/tmp/engine-schemas-diff/${ENGINE}.summary.md"

      - name: Probe-fail comment (skip downstream)
        if: steps.probe.outputs.verdict == 'fail' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr-number }}
          MARKER: "bot-id: schemas-${{ inputs.engine }}-probe-blocked"
          REPO: ${{ github.repository }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          REPORT="/tmp/llem-probe-out/probe-${ENGINE}.json"
          MISSING_COUNT=$(jq -r '.landmarks_missing | length' "$REPORT")
          DRIFT_COUNT=$(jq -r '.fingerprint_drift | length' "$REPORT")
          ALIAS_COUNT=$(jq -r '.landmarks_aliased | length' "$REPORT")
          {
            echo "<!-- ${MARKER} -->"
            echo "## Engine schemas - ${ENGINE} (probe-blocked)"
            echo
            echo "**Probe failed:** ${MISSING_COUNT} landmarks no longer resolve under ${ENGINE}==${VER}."
            echo
            echo "Missing landmarks (${MISSING_COUNT}):"
            echo
            jq -r '.landmarks_missing[] | "- `" + . + "`"' "$REPORT"
            echo
            if [[ "$DRIFT_COUNT" -gt 0 ]]; then
              echo "<details><summary>Fingerprint drift (${DRIFT_COUNT} landmarks)</summary>"
              echo
              jq -r '.fingerprint_drift[] | "- `" + . + "`"' "$REPORT"
              echo
              echo "</details>"
              echo
            fi
            if [[ "$ALIAS_COUNT" -gt 0 ]]; then
              echo "<details><summary>Aliased landmarks (${ALIAS_COUNT})</summary>"
              echo
              jq -r '.landmarks_aliased[] | "- `" + . + "`"' "$REPORT"
              echo
              echo "</details>"
              echo
            fi
            echo "Downstream discovery skipped; no schema changes committed against this PR."
            echo
            echo "**To unblock**, one of:"
            echo
            echo "- Patch LANDMARKS in the fallback introspector the dispatcher resolved (the stderr log in the probe step names the version it used)."
            echo "- Vendor a fresh \`engine_versions/${ENGINE}/v\$(safe(${VER}))/producers/\` directory by copying the fallback dir and patching LANDMARKS for the new library API."
            echo
            echo "CI stays red until the probe verdict flips to \`pass\`."
          } | scripts/ci/upsert_pr_comment.sh
          gh pr edit "$PR" --add-label "probe-blocked" 2>/dev/null || true

      - name: Upload diff artefact
        if: steps.probe.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: engine-schemas-diff-${{ inputs.engine }}
          path: |
            /tmp/engine-schemas-diff/${{ inputs.engine }}.old.json
            /tmp/engine-schemas-diff/${{ inputs.engine }}.diff.json
            /tmp/engine-schemas-diff/${{ inputs.engine }}.summary.md

      - name: Upload writeback artefact
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.app-token.outputs.token != '' && inputs.pr-number != '' && inputs.pr-head-repo == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: schemas-writeback-${{ inputs.engine }}
          path: |
            engine_versions/${{ inputs.engine }}/${{ steps.version.outputs.safe_version }}/outputs/schema.discovered.json
            ${{ env.ENGINES_DIR }}/${{ inputs.engine }}/schema.discovered.json
            docs/user/generated/curation-${{ inputs.engine }}.md
            docs/user/generated/schema-${{ inputs.engine }}.md
          # SSOT path first (the produced canonical schema), then the derived
          # src/ shadow. Both always exist after a passing discover - the SSOT
          # from the introspector, the shadow from regen_engine_corpus - but
          # ``warn`` keeps a missing optional doc from failing the bundle.
          if-no-files-found: warn

      - name: Post per-pipeline comment
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr-number }}
          MARKER: "bot-id: schemas-${{ inputs.engine }}-diff"
          REPO: ${{ github.repository }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          REPORT="/tmp/llem-probe-out/probe-${ENGINE}.json"
          DRIFT_COUNT=$(jq -r '.fingerprint_drift | length' "$REPORT")
          ALIAS_COUNT=$(jq -r '.landmarks_aliased | length' "$REPORT")
          {
            echo "<!-- ${MARKER} -->"
            cat "/tmp/engine-schemas-diff/${ENGINE}.summary.md"
            if [[ "$DRIFT_COUNT" -gt 0 || "$ALIAS_COUNT" -gt 0 ]]; then
              echo
              echo "<details><summary>Probe diagnostics</summary>"
              echo
              if [[ "$DRIFT_COUNT" -gt 0 ]]; then
                echo "- Fingerprint drift: ${DRIFT_COUNT} landmarks moved between versions"
              fi
              if [[ "$ALIAS_COUNT" -gt 0 ]]; then
                echo "- Aliased landmarks: ${ALIAS_COUNT} resolve via re-export (canonical paths shifted upstream; harmless)"
              fi
              echo
              echo "Full per-landmark detail in the DriftReport JSON artefact and \`engine_versions/${ENGINE}.compat.json\`."
              echo
              echo "</details>"
            fi
          } | scripts/ci/upsert_pr_comment.sh

      - name: Clean up stale probe-blocked comment (probe now passes)
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr-number }}
          MARKER: "bot-id: schemas-${{ inputs.engine }}-probe-blocked"
          REPO: ${{ github.repository }}
          MODE: delete
        run: scripts/ci/upsert_pr_comment.sh

      - name: Apply per-pipeline label
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
          CLASSIFICATION: ${{ steps.diff.outputs.classification }}
        run: |
          for L in schemas-changed schemas-breaking schemas-safe probe-blocked; do
            gh pr edit "$PR_NUMBER" --remove-label "$L" 2>/dev/null || true
          done
          case "$CLASSIFICATION" in
            breaking)  gh pr edit "$PR_NUMBER" --add-label "schemas-breaking" --add-label "schemas-changed" 2>/dev/null || true ;;
            safe)      gh pr edit "$PR_NUMBER" --add-label "schemas-safe" --add-label "schemas-changed" 2>/dev/null || true ;;
            no-changes) ;;
          esac

      - name: Apply cross-pipeline rollup label
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
          CLASSIFICATION: ${{ steps.diff.outputs.classification }}
        run: scripts/ci/apply_rollup_label.sh

      - name: Probe-fail gate (red CI)
        # The 'accept-probe-fail' PR label bypasses this gate for
        # known-drift cases (admin escalation; tracked in #547 etc.).
        if: steps.probe.outputs.verdict == 'fail' && !contains(github.event.pull_request.labels.*.name, 'accept-probe-fail')
        run: |
          echo "::error::Probe failed; downstream mining was skipped. CI is red until the probe-blocked comment is resolved."
          exit 1
