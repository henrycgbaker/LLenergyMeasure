name: Engine rules cell

# Reusable workflow invoked from engine-pipeline.yml's matrix fan-out.
# Runs probe + mine + validate for ONE engine, parameterised by inputs.
# Writeback is centralised in the orchestrator (per H4-fixed); this cell
# uploads its writeback content as an artefact and the orchestrator's
# aggregate writeback job collects all cell artefacts and performs a
# single git push.

on:
  workflow_call:
    inputs:
      engine:
        description: Engine name (transformers, vllm, tensorrt)
        required: true
        type: string
      runner:
        description: Runner kind (ubuntu-latest, self-hosted)
        required: true
        type: string
      image-source:
        description: Image source mode (ghcr-cache, dockerhub, ngc)
        required: true
        type: string
      pr-number:
        description: PR number for comment / label / artefact targeting (empty if not applicable)
        required: true
        type: string
      pr-head-repo:
        description: PR head repo full_name; used to gate writeback contributions on same-repo PRs only
        required: true
        type: string
      run-gap-diagnose:
        description: >-
          Run the Stage-1 LLM gap-diagnose (1b) every-bump pass. Default false:
          1b is unconditional-per-bump and costs a GPU-minute, so it is opt-in
          (typically reserved for major bumps). The 1a carried-failure triage is
          NOT gated by this - it is alarm-conditional (fires on a decay residual).
          Both run only on a self-hosted GPU runner; dormant on hosted CI.
        required: false
        type: boolean
        default: false

jobs:
  cell:
    name: ${{ inputs.engine }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.runner == 'ubuntu-latest' && 30 || 360 }}
    env:
      ENGINES_DIR: src/llenergymeasure/engines
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "/repo/src:/repo"
    steps:
      - name: Mint llem-ci-bot App token
        # Per-cell mint (not forwarded from orchestrator) because GitHub
        # masks secret-derived job outputs to empty when crossing job
        # boundaries - see docs.github.com Security hardening: "If a
        # secret was used in the job to create an output, the output is
        # redacted and not accessible to a downstream job." Skipped on
        # fork PRs (App secrets aren't available cross-fork).
        id: app-token
        if: inputs.pr-head-repo == github.repository || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Clean workspace (fix root-owned files from prior Docker runs)
        if: inputs.runner == 'self-hosted'
        uses: ./.github/actions/clean-self-hosted-workspace

      - name: Synthesize passwd/group for non-root container runs
        if: inputs.runner == 'self-hosted'
        uses: ./.github/actions/synthesize-passwd

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve engine version from current.yaml
        id: version
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          VER=$(yq '.library.current_version' "engine_versions/${ENGINE}/current.yaml")
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve ${ENGINE} version from engine_versions/${ENGINE}/current.yaml" >&2
            exit 1
          fi
          # Python-identifier-safe form (dots and hyphens -> underscores) used as the
          # subpackage name under engine_versions/<engine>/.
          SAFE_VER="v${VER//[.-]/_}"
          {
            echo "version=${VER}"
            echo "safe_version=${SAFE_VER}"
            echo "image=llenergymeasure:${ENGINE}-${VER}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (read-only, for image pull)
        if: inputs.image-source == 'ghcr-cache'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub auth availability
        if: inputs.image-source == 'dockerhub'
        id: dockerhub_auth
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Docker Hub (if token configured)
        if: inputs.image-source == 'dockerhub' && steps.dockerhub_auth.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull engine image and tag locally
        id: image
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image }}
          VER: ${{ steps.version.outputs.version }}
          ENGINE: ${{ inputs.engine }}
          IMAGE_SOURCE: ${{ inputs.image-source }}
          REPO: ${{ github.repository }}
        run: |
          case "$IMAGE_SOURCE" in
            ghcr-cache)
              UPSTREAM="ghcr.io/${REPO}/${ENGINE}-cache:${ENGINE}-${VER}"
              ;;
            dockerhub)
              UPSTREAM="vllm/vllm-openai:v${VER}"
              ;;
            ngc)
              UPSTREAM="nvcr.io/nvidia/tensorrt-llm/release:${VER}"
              ;;
            *)
              echo "Unknown image-source: ${IMAGE_SOURCE}" >&2
              exit 1
              ;;
          esac
          if ! docker image inspect "$UPSTREAM" >/dev/null 2>&1; then
            docker pull "$UPSTREAM"
          else
            echo "Image $UPSTREAM already cached locally; skipping pull."
          fi
          docker tag "$UPSTREAM" "$IMAGE_TAG"
          # Resolve the immutable digest for provenance in the mined envelope.
          # RepoDigests is empty for locally-built images; degrade to "" then.
          DIGEST=$(docker image inspect "$UPSTREAM" \
            --format '{{ range .RepoDigests }}{{ println . }}{{ end }}' \
            | head -n1 | sed -n 's/.*@\(sha256:[0-9a-f]*\).*/\1/p')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Fetch tensorrt-llm source tarball (host)
        if: inputs.engine == 'tensorrt'
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DEST="/tmp/trt-llm-${VER}"
          if [[ -d "${DEST}/tensorrt_llm" ]]; then
            echo "Source tree already present at ${DEST}; skipping fetch."
            exit 0
          fi
          URL_TEMPLATE=$(yq '.source_tarball.url_template' engine_versions/tensorrt/current.yaml)
          if [[ -z "$URL_TEMPLATE" || "$URL_TEMPLATE" == "null" ]]; then
            echo "Could not resolve source_tarball.url_template from engine_versions/tensorrt/current.yaml" >&2
            exit 1
          fi
          URL="${URL_TEMPLATE//\{version\}/${VER}}"
          mkdir -p "${DEST}"
          curl -fsSL "${URL}" \
            | tar -xz -C "${DEST}" --strip-components=1
          test -d "${DEST}/tensorrt_llm"

      - name: Compute stable mining + validation anchor
        id: anchor
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          BASE_PATHS=(
            "engine_versions/${ENGINE}/current.yaml"
            "scripts/engine_producers/build_corpus.py"
            "scripts/engine_producers/_base.py"
            "scripts/engine_producers/_pydantic_lift.py"
            "scripts/engine_producers/_msgspec_lift.py"
            "scripts/engine_producers/_dataclass_lift.py"
            "scripts/engine_producers/_fixpoint_test.py"
            "scripts/validate_rules.py"
            "scripts/_rules_validation_common.py"
            "scripts/refresh_rules.sh"
          )
          ENGINE_PATHS=()
          case "$ENGINE" in
            transformers)
              ENGINE_PATHS=(
                "docker/Dockerfile.transformers"
                "scripts/engine_producers/transformers_static_invariant_miner.py"
                "scripts/engine_producers/transformers_dynamic_invariant_miner.py"
                "scripts/engine_producers/transformers_miner.py"
              )
              ;;
            vllm)
              ENGINE_PATHS=(
                "scripts/engine_producers/vllm_static_invariant_miner.py"
                "scripts/engine_producers/vllm_dynamic_invariant_miner.py"
              )
              ;;
            tensorrt)
              ENGINE_PATHS=(
                "scripts/engine_producers/tensorrt_static_invariant_miner.py"
                "scripts/engine_producers/tensorrt_miner.py"
              )
              ;;
          esac
          PATHS=("${BASE_PATHS[@]}" "${ENGINE_PATHS[@]}")
          # Exclude bot writeback commits from anchor calculation. The
          # writeback bot updates canonical mining outputs on every
          # successful run, producing a fresh git author timestamp.
          # Without this filter, the anchor shifts on each writeback,
          # mining produces a different mined_at timestamp, the diff
          # classifier fires, writeback fires, loop. Filtering bot commits
          # anchors mining to the latest substantive change instead.
          # current.yaml is excluded from the writeback bundle (Renovate is
          # its only writer) so it never trips this loop.
          SHA=$(git log -1 --format=%H \
            --invert-grep --grep='^chore(bot): writeback' \
            -- "${PATHS[@]}")
          DATE=$(git log -1 --format=%aI \
            --invert-grep --grep='^chore(bot): writeback' \
            -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          {
            echo "sha=${SHA:-${GITHUB_SHA}}"
            echo "date=${DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Probe - landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
          RUNNER: ${{ inputs.runner }}
        run: |
          mkdir -p /tmp/llem-probe-out
          # shellcheck source=scripts/ci/run_in_engine_container.sh
          source scripts/ci/run_in_engine_container.sh python3
          set +e
          docker run --rm "${DOCKER_FLAGS[@]}" \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -v /tmp/llem-probe-out:/llem-probe-out:rw \
            -w /repo \
            -e PYTHONPATH \
            -e PYTHONDONTWRITEBYTECODE \
            "${ENTRYPOINT_FLAG[@]}" \
            "$IMAGE" \
            "${CMD_PREFIX[@]}" -m scripts._drift --engine "$ENGINE" --producer invariants \
              --output "/llem-probe-out/probe-${ENGINE}.json"
          DRIFT_RC=$?
          set -e
          echo "::group::Drift report (probe-${ENGINE}.json)"
          cat "/tmp/llem-probe-out/probe-${ENGINE}.json" || true
          echo "::endgroup::"
          VERDICT=$(jq -r '.verdict' "/tmp/llem-probe-out/probe-${ENGINE}.json")
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          exit "$DRIFT_RC"

      - name: Save current YAMLs for diffing
        if: steps.probe.outputs.verdict == 'pass'
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          mkdir -p /tmp/engine-invariants-diff
          for KIND in proposed validated; do
            OLD_YAML="${ENGINES_DIR}/${ENGINE}/rules.${KIND}.yaml"
            DEST="/tmp/engine-invariants-diff/${ENGINE}.${KIND}.old.yaml"
            if [[ -f "$OLD_YAML" ]]; then
              cp "$OLD_YAML" "$DEST"
            else
              : > "$DEST"
            fi
          done

      - name: Mine + validate inside container
        # Knowledge is PRODUCED in the SSOT (engine_versions/<e>/v<pin>/outputs/):
        # build_corpus writes rules.proposed.yaml there, validate_rules writes
        # rules.validated.yaml there, then regen_engine_corpus DERIVES the src/
        # shadow from it (the one derivation; design section 4). Downstream
        # doc-gen / diff / upload read the derived shadow unchanged.
        if: steps.probe.outputs.verdict == 'pass'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
          SAFE_VER: ${{ steps.version.outputs.safe_version }}
          ANCHOR_SHA: ${{ steps.anchor.outputs.sha }}
          ANCHOR_DATE: ${{ steps.anchor.outputs.date }}
          RUNNER: ${{ inputs.runner }}
        run: |
          # shellcheck source=scripts/ci/run_in_engine_container.sh
          source scripts/ci/run_in_engine_container.sh bash
          docker run --rm "${DOCKER_FLAGS[@]}" \
            -e LLENERGY_MINER_FROZEN_AT="${ANCHOR_DATE}" \
            -e LLENERGY_VALIDATION_FROZEN_AT="${ANCHOR_DATE}" \
            -e PYTHONDONTWRITEBYTECODE \
            -e PYTHONPATH \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "${ENTRYPOINT_FLAG[@]}" \
            "$IMAGE" \
            "${CMD_PREFIX[@]}" -c "
              set -euo pipefail
              SSOT='engine_versions/${ENGINE}/${SAFE_VER}/outputs'
              # Seed the new pin's maintainer-owned inputs (curated.yaml always,
              # overlay.yaml when the prior pin had one) from the prior pin
              # BEFORE mining reads them. A bare Renovate bump edits only
              # current.yaml, so the new pin's outputs/ has no curated.yaml,
              # which build_corpus's section classifier reads (FileNotFoundError
              # otherwise). Idempotent + never clobbers maintainer edits; the
              # aggregate writeback re-runs it as the authoritative seed.
              python3 -m scripts.engine_producers._current --engine ${ENGINE} --carry-forward
              python3 -m scripts.engine_producers.build_corpus \
                --engine ${ENGINE} \
                --canonical-out \"\${SSOT}/rules.proposed.yaml\"
              python3 scripts/validate_rules.py \
                --engine ${ENGINE} \
                --corpus \"\${SSOT}/rules.proposed.yaml\" \
                --out \"\${SSOT}/rules.validated.yaml\" \
                --validation-commit '${ANCHOR_SHA}' \
                --image-ref '${IMAGE}' \
                --image-digest '${IMAGE_DIGEST}' \
                --engine-commit '${VER}' \
                --fail-on-divergence
              # Derive the src/ shadow scoped to --only rules: this cell runs in
              # PARALLEL with the schemas cell, so on a fresh-version bump the
              # SSOT has no schema.discovered.json yet (the sibling cell writes
              # it on its own runner). A full sync would hard-fail on the
              # missing sibling; the writeback's full --write owns the complete
              # sync once both cells' SSOTs are rsynced together.
              python3 scripts/engine_producers/regen_engine_corpus.py --write --only rules --engine ${ENGINE}
            "

      - name: Set up Python (host) for doc-gen + diff
        if: steps.probe.outputs.verdict == 'pass'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-invariants-${{ inputs.engine }}-docgen-3.12
          python-version: "3.12"

      - name: Install lean host project for doc-gen
        if: steps.probe.outputs.verdict == 'pass'
        run: uv sync --dev

      - name: Resolve previous pin (carried-input source for the alarms)
        # The decay alarm + surface-trend compare against the most-recent
        # PRIOR vendored pin's outputs/. Resolution is pure-filesystem (needs
        # `packaging`), so it runs host-side after uv sync and feeds the
        # path into the in-container re-gate + the host surface diff. Today
        # every engine has exactly one outputs-bearing version dir (the
        # current pin), so this resolves empty and both alarm steps skip -
        # a structural no-op until C10 populates the trailing window.
        id: prior
        if: steps.probe.outputs.verdict == 'pass'
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          # One resolution pass emits both `prev_outputs=` and `major_bump=`
          # as GITHUB_OUTPUT lines; capture them for both the step output and
          # a human log line.
          RESOLVED=$(uv run python -m scripts.engine_producers._current --engine "${ENGINE}")
          echo "$RESOLVED" >> "$GITHUB_OUTPUT"
          PREV=$(printf '%s\n' "$RESOLVED" | sed -n 's/^prev_outputs=//p')
          if [[ -n "$PREV" ]]; then
            echo "Previous pin outputs resolved: ${PREV}"
          else
            echo "No prior vendored pin with outputs/ for ${ENGINE}; decay alarm + surface trend skip."
          fi

      - name: Re-gate carried catalogue (decay alarm, in container)
        # Design section 6 signal 1: run the PREVIOUS pin's carried corpus
        # through the live gate against the NEW container. The validated
        # envelope records gate output only, so the carried input is the prior
        # pin's rules.proposed.yaml (it carries the probe kwargs). Skips when
        # no prior exists (today's state for every engine).
        if: steps.probe.outputs.verdict == 'pass' && steps.prior.outputs.prev_outputs != ''
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
          RUNNER: ${{ inputs.runner }}
          PREV_OUTPUTS: ${{ steps.prior.outputs.prev_outputs }}
        run: |
          mkdir -p /tmp/engine-rules-alarms
          # shellcheck source=scripts/ci/run_in_engine_container.sh
          source scripts/ci/run_in_engine_container.sh bash
          docker run --rm "${DOCKER_FLAGS[@]}" \
            -e PYTHONDONTWRITEBYTECODE \
            -e PYTHONPATH \
            -e PREV_OUTPUTS \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -v /tmp/engine-rules-alarms:/tmp/engine-rules-alarms:rw \
            -w /repo \
            "${ENTRYPOINT_FLAG[@]}" \
            "$IMAGE" \
            "${CMD_PREFIX[@]}" -c "
              set -euo pipefail
              python3 scripts/validate_rules.py \
                --engine ${ENGINE} \
                --carried '${PREV_OUTPUTS}/rules.proposed.yaml' \
                --fresh-validated '${ENGINES_DIR}/${ENGINE}/rules.validated.yaml' \
                --fresh-proposed '${ENGINES_DIR}/${ENGINE}/rules.proposed.yaml' \
                --regate-out /tmp/engine-rules-alarms/${ENGINE}.regate.json
            "

      - name: Persist reclassified-dormant rules into the proposed SSOT (host)
        # CR1: the decay-alarm reconciliation reclassifies a carried dormant
        # rule whose announcement decayed into a dormant_silent payload
        # (reconciliation.reclassified[].invariant). That payload is otherwise
        # only printed in the PR comment and dropped - the silent-knowledge-loss
        # bug. Fold it into the new pin's SSOT rules.proposed.yaml (existing id
        # wins) so it persists, then re-derive the src/ shadow so the writeback
        # bundle and downstream diff/doc/comment all see the carried rule. Pure
        # YAML, no engine imports; runs host-side. Skips when no prior exists
        # (no re-gate report) and is a no-op when there is nothing to reclassify.
        if: steps.probe.outputs.verdict == 'pass' && steps.prior.outputs.prev_outputs != ''
        env:
          ENGINE: ${{ inputs.engine }}
          SAFE_VER: ${{ steps.version.outputs.safe_version }}
        run: |
          REGATE="/tmp/engine-rules-alarms/${ENGINE}.regate.json"
          if [[ ! -f "$REGATE" ]]; then
            echo "No re-gate report at ${REGATE}; nothing to persist."
            exit 0
          fi
          SSOT="engine_versions/${ENGINE}/${SAFE_VER}/outputs"
          uv run python -m scripts.engine_producers.build_corpus \
            --engine "${ENGINE}" \
            --fold-reclassified "$REGATE" \
            --canonical-out "${SSOT}/rules.proposed.yaml"
          # Re-derive the src/ shadow from the now-folded SSOT proposed corpus
          # (rules only; the schemas cell owns schema.discovered.json sync).
          uv run python scripts/engine_producers/regen_engine_corpus.py \
            --write --only rules --engine "${ENGINE}"

      - name: Stage-1 LLM diagnose (GPU runner only)
        # Design section 8 / P2b: invoke the diagnose subsystem (llem
        # diagnose-bump) as a GATED proposer and fold its gate-confirmed entries
        # into the SSOT proposed corpus (the CR1 fold path, --fold-diagnose).
        #
        # VENUE (honest): the diagnose call needs a local GPU + the ollama
        # server (qwen2.5-coder:32b), which only the self-hosted GPU runner has.
        # GitHub-hosted runners have NO GPU, so this step is GATED on
        # `inputs.runner == 'self-hosted'` - the same way engine-pipeline already
        # routes GPU-requiring cells (vllm/tensorrt -> self-hosted). On hosted CI
        # (transformers cell, ubuntu-latest) and when no self-hosted GPU runner is
        # present at all (PR #690 - the gpu job SKIPS), the step DOES NOT RUN and
        # the bump proceeds without the LLM diagnosis. The maintainer can run
        # `llem diagnose-bump` locally and the gate-confirmed proposals feed this
        # SAME --fold-diagnose path. This is dormant-until-a-GPU-runner-exists.
        #
        # 1a (carried triage) is alarm-conditional: it runs only when the decay
        # re-gate left a non-empty post-Rung-0 residual. 1b (gap-diagnose) runs
        # only when run-gap-diagnose is set (off by default - 1b is every-bump and
        # costs a GPU-minute). The proposer's output goes through the EXISTING gate
        # in the engine container; only gate-confirmed entries fold into proposed.
        # Nothing auto-merges - the folded entries ride the bump-PR data diff.
        id: diagnose
        if: steps.probe.outputs.verdict == 'pass' && inputs.runner == 'self-hosted'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
          SAFE_VER: ${{ steps.version.outputs.safe_version }}
          PREV_OUTPUTS: ${{ steps.prior.outputs.prev_outputs }}
          RUN_GAP: ${{ inputs.run-gap-diagnose }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine-rules-diagnose
          # The old (previous-pin) version, derived from the prev_outputs path
          # (engine_versions/<e>/v<safe>/outputs -> <safe> -> dotted). Empty when
          # no prior exists - 1a is then skipped anyway.
          OLD_VER=""
          if [[ -n "$PREV_OUTPUTS" ]]; then
            SAFE_PREV=$(basename "$(dirname "$PREV_OUTPUTS")")
            OLD_VER="${SAFE_PREV#v}"
            OLD_VER="${OLD_VER//_/.}"
          fi
          OUT_CARRIED="/tmp/engine-rules-diagnose/${ENGINE}.carried.proposed.yaml"
          OUT_GAP="/tmp/engine-rules-diagnose/${ENGINE}.gap.proposed.yaml"
          REGATE="/tmp/engine-rules-alarms/${ENGINE}.regate.json"
          SSOT="engine_versions/${ENGINE}/${SAFE_VER}/outputs"
          PROPOSED="${SSOT}/rules.proposed.yaml"

          CONFIRMED_TOTAL=0
          REVIEW_TOTAL=0
          UNCONFIRMED_TOTAL=0

          # Extract the new pin's engine source tree from the container so the
          # proposer can read it on the host. tensorrt's source is already on the
          # host (fetched as a tarball); transformers/vllm live in the image's
          # site-packages. The cited/surface file paths are package-relative
          # (e.g. transformers/generation/configuration_utils.py), so --source-root
          # is the parent that holds the engine package dir.
          SRC_ROOT="/tmp/engine-rules-diagnose/${ENGINE}-src"
          rm -rf "$SRC_ROOT"
          mkdir -p "$SRC_ROOT"
          if [[ "$ENGINE" == "tensorrt" ]]; then
            cp -r "/tmp/trt-llm-${VER}/." "$SRC_ROOT/"
          else
            PKG_PARENT=$(docker run --rm --entrypoint python3 "$IMAGE" -c \
              "import ${ENGINE}, pathlib; print(pathlib.Path(${ENGINE}.__file__).parent.parent)")
            docker run --rm --entrypoint bash "$IMAGE" -c \
              "cd '${PKG_PARENT}' && tar -cf - ${ENGINE}" | tar -xf - -C "$SRC_ROOT"
          fi

          run_diagnose() {
            # $1 = mode label for logs; remaining args = llem diagnose-bump opts.
            local label="$1"; shift
            local logf="/tmp/engine-rules-diagnose/${ENGINE}.${label}.log"
            echo "::group::diagnose (${label})"
            set +e
            uv run llem diagnose-bump \
              --engine "$ENGINE" \
              --image "$IMAGE" \
              --new-version "$VER" \
              --source-root "$SRC_ROOT" \
              "$@" 2>"$logf"
            local rc=$?
            set -e
            cat "$logf" >&2
            echo "::endgroup::"
            # Tally the for-review / unconfirmed counts the CLI logs to stderr so
            # the gate-report comment can surface them. The diagnose CLI exits 2
            # only on a hard DiagnoseError (bad input / model / gate); a clean run
            # with zero confirmed entries exits 0 and writes nothing.
            if [[ $rc -ne 0 && $rc -ne 2 ]]; then
              echo "::error::diagnose (${label}) exited ${rc}"
              return "$rc"
            fi
            local review unconf
            review=$(sed -n 's/.* \([0-9]\+\) for review (silent dormancy).*/\1/p' "$logf" | tail -n1)
            unconf=$(sed -n 's/.* \([0-9]\+\) unconfirmed (not written).*/\1/p' "$logf" | tail -n1)
            REVIEW_TOTAL=$((REVIEW_TOTAL + ${review:-0}))
            UNCONFIRMED_TOTAL=$((UNCONFIRMED_TOTAL + ${unconf:-0}))
          }

          fold_fragment() {
            # $1 = the diagnose --out fragment. Fold its gate-confirmed entries
            # into the SSOT proposed corpus (existing id wins; CR1 fold twin).
            local frag="$1"
            [[ -f "$frag" ]] || return 0
            local n
            n=$(yq '.invariants | length' "$frag" 2>/dev/null || echo 0)
            [[ "${n:-0}" -gt 0 ]] || return 0
            uv run python -m scripts.engine_producers.build_corpus \
              --engine "$ENGINE" \
              --fold-diagnose "$frag" \
              --canonical-out "$PROPOSED"
            CONFIRMED_TOTAL=$((CONFIRMED_TOTAL + n))
          }

          # 1a carried-failure triage: alarm-conditional. Only when the decay
          # re-gate left a non-empty post-Rung-0 residual (and a prior pin exists).
          RESIDUAL=0
          if [[ -f "$REGATE" ]]; then
            RESIDUAL=$(jq -r '.reconciliation.counts.residual // 0' "$REGATE")
          fi
          if [[ -n "$PREV_OUTPUTS" && "${RESIDUAL:-0}" -gt 0 ]]; then
            # Map each residual rule id to the source file it cites
            # (miner_source.path in the carried corpus) for diff-scoping.
            CARRIED="${PREV_OUTPUTS}/rules.proposed.yaml"
            CITED_ARGS=()
            while IFS= read -r f; do
              [[ -n "$f" && "$f" != "null" ]] && CITED_ARGS+=(--cited-file "$f")
            done < <(
              jq -r '.reconciliation.residual[].id' "$REGATE" | while read -r rid; do
                yq -r ".invariants[] | select(.id == \"${rid}\") | .miner_source.path" "$CARRIED"
              done | sort -u
            )
            if [[ ${#CITED_ARGS[@]} -gt 0 ]]; then
              run_diagnose carried \
                --mode carried \
                --regate-report "$REGATE" \
                --carried-corpus "$CARRIED" \
                --old-version "$OLD_VER" \
                "${CITED_ARGS[@]}" \
                --out "$OUT_CARRIED"
              fold_fragment "$OUT_CARRIED"
            else
              echo "1a: residual rules cite no resolvable source path; skipping carried triage."
            fi
          else
            echo "1a carried triage skipped: residual=${RESIDUAL:-0}, prev_outputs='${PREV_OUTPUTS}' (no decay residual to triage)."
          fi

          # 1b gap-diagnose: configurable (default off; opt-in per run because it
          # is every-bump and costs a GPU-minute). Surface = the mined config
          # surface; we feed the engine package's config module(s) as the glob.
          if [[ "$RUN_GAP" == "true" ]]; then
            SCHEMA="${ENGINES_DIR}/${ENGINE}/schema.discovered.json"
            SURFACE_ARGS=()
            while IFS= read -r f; do
              rel="${f#${SRC_ROOT}/}"
              SURFACE_ARGS+=(--surface-file "$rel")
            done < <(find "${SRC_ROOT}/${ENGINE}" -path "*config*.py" -type f 2>/dev/null | sort)
            if [[ -f "$SCHEMA" && ${#SURFACE_ARGS[@]} -gt 0 ]]; then
              run_diagnose gap \
                --mode gap \
                --schema "$SCHEMA" \
                "${SURFACE_ARGS[@]}" \
                --out "$OUT_GAP"
              fold_fragment "$OUT_GAP"
            else
              echo "1b gap-diagnose skipped: schema present=$([[ -f "$SCHEMA" ]] && echo yes || echo no), surface files=${#SURFACE_ARGS[@]}."
            fi
          else
            echo "1b gap-diagnose skipped: run-gap-diagnose input is '${RUN_GAP}' (opt-in; off by default)."
          fi

          # If anything folded, re-derive the src/ shadow so the diagnosed
          # proposals ride the diff/doc/comment/writeback (CR1 fold twin).
          if [[ "$CONFIRMED_TOTAL" -gt 0 ]]; then
            uv run python scripts/engine_producers/regen_engine_corpus.py \
              --write --only rules --engine "${ENGINE}"
          fi

          {
            echo "confirmed=${CONFIRMED_TOTAL}"
            echo "for_review=${REVIEW_TOTAL}"
            echo "unconfirmed=${UNCONFIRMED_TOTAL}"
          } >> "$GITHUB_OUTPUT"

      - name: Surface trend (blindness heuristic, host)
        # Design section 6 signal 2: a pure-artefact census diff of the prior
        # pin's outputs/ against the current pin's. No engine imports; runs
        # host-side. Skips when no prior exists.
        if: steps.probe.outputs.verdict == 'pass' && steps.prior.outputs.prev_outputs != ''
        env:
          ENGINE: ${{ inputs.engine }}
          PREV_OUTPUTS: ${{ steps.prior.outputs.prev_outputs }}
        run: |
          mkdir -p /tmp/engine-rules-alarms
          # The derived shadow under src/ is the current side: regen produced it
          # from this pin's SSOT outputs, so it holds all three artefacts (a
          # byte-identical projection) and is always present after mine+validate.
          uv run python scripts/diff_engine_surface.py \
            "${PREV_OUTPUTS}" "${ENGINES_DIR}/${ENGINE}" \
            --out "/tmp/engine-rules-alarms/${ENGINE}.surface.json"

      - name: Regenerate rules digest
        if: steps.probe.outputs.verdict == 'pass'
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          uv run python scripts/generate_rules_doc.py \
            --engine "${ENGINE}" \
            --out "docs/reference/engines/invariants-${ENGINE}.md"

      - name: Classify diff (proposed + validated)
        if: steps.probe.outputs.verdict == 'pass'
        id: diff
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set +e
          uv run python scripts/diff_engine_rules.py \
            "/tmp/engine-invariants-diff/${ENGINE}.validated.old.yaml" \
            "${ENGINES_DIR}/${ENGINE}/rules.validated.yaml" \
            --out "/tmp/engine-invariants-diff/${ENGINE}.validated.md" \
            --title "${ENGINE^} validated invariants diff"
          VENDORED_EXIT=$?
          set -e

          PROPOSED_CHANGED=true
          if diff -q "/tmp/engine-invariants-diff/${ENGINE}.proposed.old.yaml" \
                    "${ENGINES_DIR}/${ENGINE}/rules.proposed.yaml" >/dev/null 2>&1; then
            PROPOSED_CHANGED=false
          fi

          VENDORED_CHANGED=true
          if diff -q "/tmp/engine-invariants-diff/${ENGINE}.validated.old.yaml" \
                    "${ENGINES_DIR}/${ENGINE}/rules.validated.yaml" >/dev/null 2>&1; then
            VENDORED_CHANGED=false
          fi

          if [[ "$PROPOSED_CHANGED" == "false" && "$VENDORED_CHANGED" == "false" ]]; then
            CLASSIFICATION="no-changes"
          elif [[ $VENDORED_EXIT -eq 1 ]]; then
            CLASSIFICATION="breaking"
          else
            CLASSIFICATION="safe"
          fi
          echo "classification=${CLASSIFICATION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Engine invariants - ${ENGINE}"
            echo
            if [[ "$CLASSIFICATION" == "no-changes" ]]; then
              echo "_No changes to proposed or validated invariants._"
            else
              if [[ "$PROPOSED_CHANGED" == "true" ]]; then
                echo "### Proposed corpus diff"
                echo
                echo '```diff'
                diff -u --label "${ENGINE}.proposed.yaml" --label "${ENGINE}.proposed.yaml" \
                        "/tmp/engine-invariants-diff/${ENGINE}.proposed.old.yaml" \
                        "${ENGINES_DIR}/${ENGINE}/rules.proposed.yaml" | head -n 200 || true
                echo '```'
                echo
              fi
              if [[ -f "/tmp/engine-invariants-diff/${ENGINE}.validated.md" ]]; then
                cat "/tmp/engine-invariants-diff/${ENGINE}.validated.md"
              fi
            fi
          } > "/tmp/engine-invariants-diff/${ENGINE}.summary.md"

      - name: Probe-fail comment (skip downstream)
        if: steps.probe.outputs.verdict == 'fail' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr-number }}
          MARKER: "bot-id: invariants-${{ inputs.engine }}-probe-blocked"
          REPO: ${{ github.repository }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          REPORT="/tmp/llem-probe-out/probe-${ENGINE}.json"
          MISSING_COUNT=$(jq -r '.landmarks_missing | length' "$REPORT")
          DRIFT_COUNT=$(jq -r '.fingerprint_drift | length' "$REPORT")
          ALIAS_COUNT=$(jq -r '.landmarks_aliased | length' "$REPORT")
          {
            echo "<!-- ${MARKER} -->"
            echo "## Engine invariants - ${ENGINE} (probe-blocked)"
            echo
            echo "**Probe failed:** ${MISSING_COUNT} landmarks no longer resolve under ${ENGINE}==${VER}."
            echo
            echo "Missing landmarks (${MISSING_COUNT}):"
            echo
            jq -r '.landmarks_missing[] | "- `" + . + "`"' "$REPORT"
            echo
            if [[ "$DRIFT_COUNT" -gt 0 ]]; then
              echo "<details><summary>Fingerprint drift (${DRIFT_COUNT} landmarks)</summary>"
              echo
              jq -r '.fingerprint_drift[] | "- `" + . + "`"' "$REPORT"
              echo
              echo "</details>"
              echo
            fi
            if [[ "$ALIAS_COUNT" -gt 0 ]]; then
              echo "<details><summary>Aliased landmarks (${ALIAS_COUNT})</summary>"
              echo
              jq -r '.landmarks_aliased[] | "- `" + . + "`"' "$REPORT"
              echo
              echo "</details>"
              echo
            fi
            echo "Downstream mine + validate skipped; no corpus changes committed against this PR."
            echo
            echo "**To unblock**, one of:"
            echo
            echo "- Patch LANDMARKS in the fallback producer the dispatcher resolved (the stderr log in the probe step names the version it used). One set covers both library versions if the symbols still resolve there."
            echo "- Vendor a fresh \`engine_versions/${ENGINE}/v\$(safe(${VER}))/producers/\` directory by copying the fallback dir and patching LANDMARKS for the new library API."
            echo
            echo "CI stays red until the probe verdict flips to \`pass\`."
          } | scripts/ci/upsert_pr_comment.sh
          gh pr edit "$PR" --add-label "probe-blocked" 2>/dev/null || true

      - name: Upload diff artefact
        if: steps.probe.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: engine-invariants-diff-${{ inputs.engine }}
          path: |
            /tmp/engine-invariants-diff/${{ inputs.engine }}.proposed.old.yaml
            /tmp/engine-invariants-diff/${{ inputs.engine }}.validated.old.yaml
            /tmp/engine-invariants-diff/${{ inputs.engine }}.summary.md

      - name: Upload writeback artefact
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.app-token.outputs.token != '' && inputs.pr-number != '' && inputs.pr-head-repo == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: invariants-writeback-${{ inputs.engine }}
          path: |
            engine_versions/${{ inputs.engine }}/${{ steps.version.outputs.safe_version }}/outputs/rules.proposed.yaml
            engine_versions/${{ inputs.engine }}/${{ steps.version.outputs.safe_version }}/outputs/rules.validated.yaml
            ${{ env.ENGINES_DIR }}/${{ inputs.engine }}/rules.proposed.yaml
            ${{ env.ENGINES_DIR }}/${{ inputs.engine }}/rules.validated.yaml
            docs/reference/engines/invariants-${{ inputs.engine }}.md
          # SSOT paths first (the produced canonical outputs), then the derived
          # src/ shadow. Both always exist after a passing mine - the SSOT from
          # the miners, the shadow from regen_engine_corpus - but ``warn`` keeps
          # a missing optional doc from failing the bundle. current.yaml is NOT
          # in the writeback bundle: it is Renovate-writable input only, and the
          # dispatcher + probe pair never need to mutate it.
          if-no-files-found: warn

      - name: Post gate report comment (decay alarm + surface trend + diff)
        # ONE upserted comment per engine carrying the per-bump gate report
        # (design section 5 step 6): proposed/validated counts, the carried-
        # catalogue re-gate acceptance with the Rung-0 healed/residual split,
        # the surface trend, and the proposed/validated diff summary - the
        # alarm sections present only when a prior pin exists. A major bump
        # leads with the expected-churn warning. Today no prior exists, so the
        # body is the counts + diff (+ a "no prior" note).
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr-number }}
          MARKER: "bot-id: rules-${{ inputs.engine }}"
          REPO: ${{ github.repository }}
          ENGINE: ${{ inputs.engine }}
          VER: ${{ steps.version.outputs.version }}
          MAJOR_BUMP: ${{ steps.prior.outputs.major_bump }}
          PREV_OUTPUTS: ${{ steps.prior.outputs.prev_outputs }}
          DIAGNOSE_CONFIRMED: ${{ steps.diagnose.outputs.confirmed }}
          DIAGNOSE_REVIEW: ${{ steps.diagnose.outputs.for_review }}
          DIAGNOSE_UNCONFIRMED: ${{ steps.diagnose.outputs.unconfirmed }}
        run: |
          PROPOSED="${ENGINES_DIR}/${ENGINE}/rules.proposed.yaml"
          VALIDATED="${ENGINES_DIR}/${ENGINE}/rules.validated.yaml"
          PROPOSED_N=$(yq '.invariants | length' "$PROPOSED")
          VALIDATED_N=$(yq '.cases | length' "$VALIDATED")
          REGATE="/tmp/engine-rules-alarms/${ENGINE}.regate.json"
          SURFACE="/tmp/engine-rules-alarms/${ENGINE}.surface.json"
          PROBE_REPORT="/tmp/llem-probe-out/probe-${ENGINE}.json"
          DRIFT_COUNT=$(jq -r '.fingerprint_drift | length' "$PROBE_REPORT")
          ALIAS_COUNT=$(jq -r '.landmarks_aliased | length' "$PROBE_REPORT")
          {
            echo "<!-- ${MARKER} -->"
            echo "## Engine rules gate report - ${ENGINE} (${VER})"
            echo
            if [[ "$MAJOR_BUMP" == "true" ]]; then
              echo "> **Major version bump.** Expect ~2x more churn than a minor"
              echo "> (study: 53% vs 76-100% field persistence) and the carried-"
              echo "> catalogue alarm is unvalidated on majors - review source-level."
              echo
            fi
            echo "- Proposed invariants: \`${PROPOSED_N}\`"
            echo "- Validated cases: \`${VALIDATED_N}\`"
            echo
            if [[ -f "$REGATE" ]]; then
              ACC=$(jq -r '.acceptance_rate' "$REGATE")
              TOTAL=$(jq -r '.total' "$REGATE")
              CONFIRMED=$(jq -r '.counts.confirmed' "$REGATE")
              FAILED=$(jq -r '.counts.failed' "$REGATE")
              INFRA=$(jq -r '.counts.infra_error' "$REGATE")
              echo "### Decay alarm (carried catalogue re-gate)"
              echo
              echo "Carried from \`${PREV_OUTPUTS}/rules.proposed.yaml\`."
              echo
              echo "Acceptance \`${ACC}\` - ${CONFIRMED}/${TOTAL} confirmed, ${FAILED} failed, ${INFRA} infra-error."
              # Rung 0: split the raw failures into self-healed (the same run's
              # re-mine already re-encoded the rule) vs genuine decay residual.
              HEALED=$(jq -r '.reconciliation.counts.healed // 0' "$REGATE")
              RECLASSIFIED=$(jq -r '.reconciliation.counts.reclassified // 0' "$REGATE")
              RESIDUAL=$(jq -r '.reconciliation.counts.residual // 0' "$REGATE")
              if jq -e '.reconciliation' "$REGATE" >/dev/null 2>&1; then
                echo
                echo "Rung 0 reconciliation: **${HEALED} healed**, **${RECLASSIFIED} reclassified** (dormant_silent carry), **${RESIDUAL} residual** (decay candidates)."
                if [[ "$HEALED" -gt 0 ]]; then
                  echo
                  echo "<details><summary>Healed (gate re-confirmed in the same re-mine)</summary>"
                  echo
                  jq -r '.reconciliation.healed[]
                    | if .kind == "healed_template_drift"
                      then "- `" + .id + "` template drift: `" + .old_template + "` -> `" + .new_template + "`"
                      else "- `" + .id + "` morphed -> `" + .new_id + "`"
                      end' "$REGATE"
                  echo
                  echo "</details>"
                fi
                if [[ "$RECLASSIFIED" -gt 0 ]]; then
                  echo
                  echo "<details><summary>Reclassified (dormant announcement decayed -> dormant_silent, carried into proposed)</summary>"
                  echo
                  jq -r '.reconciliation.reclassified[] | "- `" + .id + "` announcement dropped upstream; field still ignored, carried forward as silent dormancy"' "$REGATE"
                  echo
                  echo "</details>"
                fi
                if [[ "$RESIDUAL" -gt 0 ]]; then
                  echo
                  echo "<details><summary>Residual (decay candidates - rule genuinely gone)</summary>"
                  echo
                  jq -r '.reconciliation.residual[] | "- `" + .id + "` - " + .reason' "$REGATE"
                  echo
                  echo "</details>"
                fi
              elif [[ "$FAILED" -gt 0 ]]; then
                echo
                echo "<details><summary>Failed (rule no longer holds)</summary>"
                echo
                jq -r '.entries[] | select(.verdict=="failed") | "- `" + .id + "` - " + .reason' "$REGATE"
                echo
                echo "</details>"
              fi
              if [[ "$INFRA" -gt 0 ]]; then
                echo
                echo "<details><summary>Infra-error (probe no longer constructs)</summary>"
                echo
                jq -r '.entries[] | select(.verdict=="infra_error") | "- `" + .id + "` - " + .reason' "$REGATE"
                echo
                echo "</details>"
              fi
              echo
            fi
            if [[ -f "$SURFACE" ]]; then
              echo "### Surface trend"
              echo
              FLAGS=$(jq -r '.shrinkage_flags | length' "$SURFACE")
              if [[ "$FLAGS" -gt 0 ]]; then
                echo "Shrinkage flags (possible walker regression):"
                echo
                jq -r '.shrinkage_flags[] | "- " + .' "$SURFACE"
              else
                echo "No shrinkage flags."
              fi
              echo
            fi
            # Stage-1 LLM diagnose proposals (P2b). The diagnose step only runs on
            # a self-hosted GPU runner; on hosted CI it is skipped, so these env
            # values are empty and the subsection is omitted (no misleading
            # "0 confirmed" on a bump that never ran the diagnose).
            if [[ -n "${DIAGNOSE_CONFIRMED}${DIAGNOSE_REVIEW}${DIAGNOSE_UNCONFIRMED}" ]]; then
              echo "### Stage-1 LLM diagnose proposals"
              echo
              echo "Gate-confirmed entries folded into \`rules.proposed.yaml\` (provenance"
              echo "\`llm_diagnose\`) - review them in the data diff; nothing auto-merges."
              echo
              echo "- Gate-confirmed (folded): \`${DIAGNOSE_CONFIRMED:-0}\`"
              echo "- For review (silent dormancy, not construction-confirmable): \`${DIAGNOSE_REVIEW:-0}\`"
              echo "- Unconfirmed (gate rejected, not written): \`${DIAGNOSE_UNCONFIRMED:-0}\`"
              echo
            fi
            if [[ ! -f "$REGATE" && ! -f "$SURFACE" ]]; then
              echo "_No prior vendored pin: decay alarm + surface trend skipped"
              echo "(populated once the version window backfills)._"
              echo
            fi
            # Proposed/validated diff summary (formerly the separate
            # invariants-<engine>-diff comment, now folded in - one comment per
            # engine).
            if [[ -f "/tmp/engine-invariants-diff/${ENGINE}.summary.md" ]]; then
              cat "/tmp/engine-invariants-diff/${ENGINE}.summary.md"
            fi
            if [[ "$DRIFT_COUNT" -gt 0 || "$ALIAS_COUNT" -gt 0 ]]; then
              echo
              echo "<details><summary>Probe diagnostics</summary>"
              echo
              if [[ "$DRIFT_COUNT" -gt 0 ]]; then
                echo "- Fingerprint drift: ${DRIFT_COUNT} landmarks moved between versions"
              fi
              if [[ "$ALIAS_COUNT" -gt 0 ]]; then
                echo "- Aliased landmarks: ${ALIAS_COUNT} resolve via re-export (canonical paths shifted upstream; harmless)"
              fi
              echo
              echo "Full per-landmark detail in the DriftReport JSON artefact and \`engine_versions/${ENGINE}.compat.json\`."
              echo
              echo "</details>"
            fi
          } | scripts/ci/upsert_pr_comment.sh

      - name: Clean up stale probe-blocked comment (probe now passes)
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr-number }}
          MARKER: "bot-id: invariants-${{ inputs.engine }}-probe-blocked"
          REPO: ${{ github.repository }}
          MODE: delete
        run: scripts/ci/upsert_pr_comment.sh

      - name: Clean up stale per-pipeline diff comment (folded into gate report)
        # The diff summary now rides the rules-<engine> gate-report comment; an
        # older invariants-<engine>-diff comment from before the fold must be
        # removed so the PR carries one comment per engine, not two.
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr-number }}
          MARKER: "bot-id: invariants-${{ inputs.engine }}-diff"
          REPO: ${{ github.repository }}
          MODE: delete
        run: scripts/ci/upsert_pr_comment.sh

      - name: Apply per-pipeline label
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
          CLASSIFICATION: ${{ steps.diff.outputs.classification }}
        run: |
          for L in invariants-changed invariants-breaking invariants-safe probe-blocked; do
            gh pr edit "$PR_NUMBER" --remove-label "$L" 2>/dev/null || true
          done
          case "$CLASSIFICATION" in
            breaking)  gh pr edit "$PR_NUMBER" --add-label "invariants-breaking" --add-label "invariants-changed" 2>/dev/null || true ;;
            safe)      gh pr edit "$PR_NUMBER" --add-label "invariants-safe" --add-label "invariants-changed" 2>/dev/null || true ;;
            no-changes) ;;
          esac

      - name: Apply major-bump label
        # A semver MAJOR crossing over the previous pin gets a label so the
        # mandatory-review policy (design section 5) is visible at a glance;
        # the gate-report comment leads with the expected-churn warning.
        # Only an engine that RESOLVED a prior pin may touch the label: cells
        # fan out per engine on one PR, and an engine with no prior
        # (prev_outputs empty, major_bump vacuously false) must not clobber
        # the label another engine's genuine major crossing just applied.
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != '' && steps.prior.outputs.prev_outputs != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
          MAJOR_BUMP: ${{ steps.prior.outputs.major_bump }}
        run: |
          if [[ "$MAJOR_BUMP" == "true" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "major-bump" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --remove-label "major-bump" 2>/dev/null || true
          fi

      - name: Apply cross-pipeline rollup label
        if: steps.probe.outputs.verdict == 'pass' && inputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
          CLASSIFICATION: ${{ steps.diff.outputs.classification }}
        run: scripts/ci/apply_rollup_label.sh

      - name: Probe-fail gate (red CI)
        # Probe-fail must show as a red CI check: PRs cannot merge with a
        # stale corpus. The probe-blocked comment above explains how to
        # resolve. The 'accept-probe-fail' PR label bypasses this gate for
        # known-drift cases (admin escalation; tracked in #547 etc.).
        if: steps.probe.outputs.verdict == 'fail' && !contains(github.event.pull_request.labels.*.name, 'accept-probe-fail')
        run: |
          echo "::error::Probe failed; downstream mining was skipped. CI is red until the probe-blocked comment is resolved."
          exit 1
