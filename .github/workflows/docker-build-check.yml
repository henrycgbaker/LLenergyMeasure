name: Docker Build Check

# Validates the transformers engine Docker image builds successfully
# (no push). Catches broken Dockerfile.transformers before release. Uses
# registry cache for speed.
#
# vLLM and TensorRT-LLM are not built here: they run inside upstream
# images directly via runtime bind-mount. Their CI smoke is provided by
# the engine-invariants and engine-schemas workflows.

on:
  workflow_call: {}
  workflow_dispatch: {}
  pull_request:
    paths:
      - "docker/**"
      - "pyproject.toml"
      - "uv.lock"

env:
  REGISTRY: ghcr.io

jobs:
  docker-build-check:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        # Cold FA3 from-source compile + transformers + accelerate +
        # bitsandbytes intermediate files exceed the ubuntu-latest runner's
        # ~14 GB free space. Removing pre-installed dotnet/android/ghc/CodeQL
        # frees ~30-50 GB, enough headroom for the build.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v4

      # Login for cache pull (read-only - no push)
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build transformers image
        # Default `INSTALL_FA3=true` (set in Dockerfile.transformers) — this
        # check exercises the production-equivalent image, including the
        # from-source FA3 build path.
        # MAX_JOBS=2 caps parallel nvcc workers — Dockerfile default 32
        # assumes ~128 GB RAM headroom; ubuntu-latest runners have 16 GB
        # and OOM-kill the runner above ~4 parallel workers. 2 keeps peak
        # memory under 8 GB, well within the runner's budget.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.transformers
          target: runtime
          push: false
          build-args: |
            MAX_JOBS=2
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/transformers:latest
