name: Update engine schemas

# Per-concern workflow for the engine-schemas layer. Each per-engine job
# probes the introspector module's landmarks, discovers parameter schemas
# inside the SSOT-driven Docker image, regenerates the curation digest doc,
# and atomically commits artefacts back to the PR branch.
#
# Trigger asymmetry across engines is expressed via multi-trigger + per-job
# `if:` gating rather than file proliferation. One workflow file covers all
# three engines:
#
#   transformers : workflow_run-gated on Publish engine image (transformers),
#                  which itself chains off Build engine image success. The
#                  heavy first-party Docker build happens once in
#                  build-engine-image.yml (cache export only) and is
#                  republished as a runtime image by publish-engine-image.yml;
#                  this job pulls that runtime image and runs probe +
#                  discover + writeback.
#   vllm         : pull_request: paths-gated. Pulls upstream
#                  vllm/vllm-openai:v${VER} directly (no first-party build)
#                  so it doesn't depend on the build/push pipeline.
#   tensorrt     : pull_request: paths-gated. Pulls upstream
#                  nvcr.io/nvidia/tensorrt-llm/release:${VER} directly.
#
# Per-engine runner choice:
#   transformers : ubuntu-latest (CPU). transformers introspector is CPU-safe.
#   vllm         : self-hosted GPU runner inside llenergymeasure:vllm-${VER}
#                  (the host uv.lock used to break vllm's torch via tensorrt-
#                  llm 0.21.0's transitive constraints; engines now run
#                  exclusively in their own image — see #437, #464).
#   tensorrt     : self-hosted GPU runner inside llenergymeasure:tensorrt-
#                  ${VER}; TRT-LLM 0.21.0 loads CUDA bindings on import.
#
# Pipeline ordering: Build → Schemas → Invariants. Schemas writes back
# first; invariants rebases against schemas's commit. Schemas no longer
# needs to wait for invariants (the previous parallel-rebuild shape made
# the cross-wait necessary; sequential ordering removes it).
#
# Determinism contract:
#   The LLENERGY_DISCOVERY_FROZEN_AT env var is set from the author date
#   of the most recent commit touching any INPUT path. The anchor is
#   stable across the workflow's own commit-back, so re-runs on unchanged
#   source emit byte-identical JSON. This determinism is THE prevention
#   against the synchronize-loop the watchdog catches.
#
# Documented gap (issue #515 vs trigger-asymmetry):
#
# The transformers cell is gated workflow_run + workflow_dispatch only
# (NOT pull_request). PR edits to this workflow file therefore exercise
# the vllm + tensorrt cells (via the dorny filter) but NOT the
# transformers cell on PR-time. Transformers gets re-tested by the
# workflow_run chain after publish-engine-image succeeds — so workflow
# changes are validated against the transformers cell on the next
# Build → Push cycle, not within the same PR.
#
# This is by design: the transformers cell needs the freshly-built
# runtime image (transformers-cache:transformers-VER), which only
# exists after publish-engine-image succeeds. PR-time transformers
# testing without a real image would be a half-test.
#
# The actionlint job in ci.yml provides shape-validation coverage for
# the transformers cell at PR time, so YAML-level regressions are
# caught immediately.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "engine_versions/vllm.yaml"
      - "engine_versions/tensorrt.yaml"
      - "scripts/engine_introspectors/**"
      - "src/llenergymeasure/config/discovered_schemas/**"
      - ".github/workflows/engine-schemas.yml"
  workflow_run:
    # Chain off the PUSH workflow (which only fires after a successful
    # build), not the build directly: schemas-transformers needs to pull
    # the runtime image from GHCR, which doesn't exist until push lands.
    workflows: ["Publish engine image (transformers)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      engine:
        description: "Engine to probe + discover"
        required: true
        type: choice
        options:
          - transformers
          - vllm
          - tensorrt
          - all
      pr_number:
        description: "PR number to comment on and label (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  # Shared with update-engine-invariants.yml. See that file's concurrency
  # block for full rationale (#505): one group serialises both writeback
  # workflows on a single PR head; the writeback step's
  # `git pull --rebase --autostash` absorbs the queued sibling's commit
  # on dequeue.
  group: engine-coupling-${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha || github.head_ref || github.ref }}
  cancel-in-progress: false   # writeback target: never cancel mid-flight

env:
  SCHEMAS_DIR: src/llenergymeasure/config/discovered_schemas

jobs:
  filter:
    # Per-engine isolation. On pull_request, dorny/paths-filter sets one
    # output per engine based on which engine-specific paths changed.
    # Each engine cell gates `if: needs.filter.outputs.<engine> == 'true'`.
    # Skipped on workflow_run / workflow_dispatch — those gate via event-
    # name + dispatch inputs as before.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      transformers: ${{ steps.changes.outputs.transformers }}
      vllm: ${{ steps.changes.outputs.vllm }}
      tensorrt: ${{ steps.changes.outputs.tensorrt }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # Each engine filter MUST include this workflow file + the
          # dedup helper so workflow-level changes self-test all engines
          # (issue #515).
          filters: |
            transformers:
              - 'engine_versions/transformers.yaml'
              - 'docker/Dockerfile.transformers'
              - 'scripts/engine_introspectors/transformers_*.py'
              - 'scripts/engine_introspectors/_*.py'
              - 'src/llenergymeasure/config/discovered_schemas/transformers.json'
              - '.github/workflows/update-engine-schemas.yml'
              - 'scripts/ci/upsert_pr_comment.sh'
            vllm:
              - 'engine_versions/vllm.yaml'
              - 'scripts/engine_introspectors/vllm_*.py'
              - 'scripts/engine_introspectors/_*.py'
              - 'src/llenergymeasure/config/discovered_schemas/vllm.json'
              - '.github/workflows/update-engine-schemas.yml'
              - 'scripts/ci/upsert_pr_comment.sh'
            tensorrt:
              - 'engine_versions/tensorrt.yaml'
              - 'scripts/engine_introspectors/tensorrt_*.py'
              - 'scripts/engine_introspectors/_*.py'
              - 'src/llenergymeasure/config/discovered_schemas/tensorrt.json'
              - '.github/workflows/update-engine-schemas.yml'
              - 'scripts/ci/upsert_pr_comment.sh'

  schemas-transformers:
    # Selected on workflow_run (Engine Image Push success) or
    # workflow_dispatch with engine=transformers/all. Skipped on
    # pull_request: the transformers cell needs the pre-built runtime
    # image, which engine-image-push.yml produces after engine-image-
    # build.yml exports the cache.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && (inputs.engine == 'transformers' || inputs.engine == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Mint llem-ci-bot App token
        # Short-lived (~1 hour) GitHub App token. Events it produces are
        # NOT subject to the default GITHUB_TOKEN recursive-workflow guard,
        # so the commit-back below can legitimately retrigger downstream
        # CI. Skipped on fork PRs (secrets are not exposed in workflow_run
        # contexts triggered from forks) so the workflow still runs read-
        # only for external contributors.
        id: app-token
        if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        # workflow_run runs on the default branch by default. Explicitly
        # check out the head SHA of the run that triggered us so the
        # discover + writeback operate on the right code. workflow_dispatch
        # falls back to github.ref.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve transformers version from SSOT
        id: version
        run: |
          VER=$(yq '.library.current_version' engine_versions/transformers.yaml)
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve transformers version from engine_versions/transformers.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=llenergymeasure:transformers-${VER}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number (for comments + labels + writeback)
        id: pr
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            HEAD_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_REPO="${{ github.repository }}"
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "head_repo=${HEAD_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "head_repo=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR (read-only, for image pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built transformers image and tag locally
        run: |
          if [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            UPSTREAM="ghcr.io/${{ github.repository }}/transformers-cache:transformers-${{ steps.version.outputs.version }}"
          else
            UPSTREAM="ghcr.io/${{ github.repository }}/transformers:transformers-${{ steps.version.outputs.version }}"
          fi
          if ! docker image inspect "$UPSTREAM" >/dev/null 2>&1; then
            docker pull "$UPSTREAM"
          else
            echo "Image $UPSTREAM already cached locally; skipping pull."
          fi
          docker tag "$UPSTREAM" "${{ steps.version.outputs.image }}"

      - name: Compute stable discovery anchor
        id: anchor
        run: |
          PATHS=(
            "engine_versions/transformers.yaml"
            "docker/Dockerfile.transformers"
            "scripts/engine_introspectors/transformers_introspector.py"
            "scripts/engine_introspectors/_common.py"
            "scripts/engine_introspectors/__init__.py"
            "scripts/engine_introspectors/__main__.py"
          )
          DATE=$(git log -1 --format=%aI -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Probe — landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          mkdir -p /tmp/llem-probe-out
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v /tmp/llem-probe-out:/llem-probe-out:rw \
            -w /repo \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts._probe --engine transformers --producer schemas \
              --output /llem-probe-out/probe-transformers.json
          VERDICT=$(jq -r '.verdict' /tmp/llem-probe-out/probe-transformers.json)
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"

      - name: Update last_probe in SSOT
        # Mutate engine_versions/transformers.yaml's last_probe block from
        # the just-emitted ProbeReport. Runs whenever the probe step
        # produced output (pass or fail) so the SSOT records the verdict
        # + fingerprint each run. Atomic writeback (below) commits the
        # SSOT diff alongside the discovered-schema artefacts when the
        # probe passes; on probe-fail the local edit is dropped with the
        # workspace, but the in-job log captures the recorded verdict.
        # #497.
        if: always() && steps.probe.outcome == 'success'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v /tmp/llem-probe-out:/llem-probe-out:ro \
            -w /repo \
            --entrypoint bash \
            "$IMAGE" \
            -c 'python3 scripts/update_last_probe.py --engine transformers < /llem-probe-out/probe-transformers.json'

      - name: Save current schema for diffing
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          mkdir -p /tmp/engine-schemas-diff
          OLD="${SCHEMAS_DIR}/transformers.json"
          DEST="/tmp/engine-schemas-diff/transformers.old.json"
          if [[ -f "$OLD" ]]; then
            cp "$OLD" "$DEST"
          else
            echo '{}' > "$DEST"
          fi

      - name: Discover schema inside container
        if: steps.probe.outputs.verdict == 'pass'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ANCHOR_DATE: ${{ steps.anchor.outputs.date }}
        run: |
          docker run --rm \
            -e LLENERGY_DISCOVERY_FROZEN_AT="${ANCHOR_DATE}" \
            -e PYTHONDONTWRITEBYTECODE \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts.engine_introspectors \
              --engine transformers \
              --image-ref "${IMAGE}" \
              --output "${SCHEMAS_DIR}/transformers.json"

      - name: Set up Python (host) for doc-gen + diff
        if: steps.probe.outputs.verdict == 'pass'
        # Doc generator + differ run on the host (no engine import needed,
        # but they DO import llenergymeasure.* + scripts.engine_miners.*).
        # `uv sync --dev` installs the lean host project (no engine extras).
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-schemas-transformers-docgen-3.12
          python-version: "3.12"

      - name: Install lean host project for doc-gen
        if: steps.probe.outputs.verdict == 'pass'
        run: uv sync --dev

      - name: Regenerate schemas digest
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          uv run python scripts/generate_curation_doc.py --engine transformers

      - name: Classify diff
        if: steps.probe.outputs.verdict == 'pass'
        id: diff
        run: |
          set +e
          uv run python scripts/diff_discovered_schemas.py \
            /tmp/engine-schemas-diff/transformers.old.json \
            "${SCHEMAS_DIR}/transformers.json" \
            > /tmp/engine-schemas-diff/transformers.diff.json
          DIFF_EXIT=$?
          set -e

          if diff -q /tmp/engine-schemas-diff/transformers.old.json \
                    "${SCHEMAS_DIR}/transformers.json" >/dev/null 2>&1; then
            CLASSIFICATION="no-changes"
          elif [[ $DIFF_EXIT -eq 1 ]]; then
            CLASSIFICATION="breaking"
          else
            CLASSIFICATION="safe"
          fi
          echo "classification=${CLASSIFICATION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Engine schemas — transformers"
            echo
            if [[ "$CLASSIFICATION" == "no-changes" ]]; then
              echo "_No changes to discovered schema._"
            else
              SUMMARY=$(jq -r '.summary // "schema diff produced"' /tmp/engine-schemas-diff/transformers.diff.json 2>/dev/null || echo "schema diff produced")
              echo "${SUMMARY}"
              echo
              echo "<details><summary>Structured diff</summary>"
              echo
              echo '```json'
              jq '.' /tmp/engine-schemas-diff/transformers.diff.json 2>/dev/null | head -n 200 || true
              echo '```'
              echo
              echo "</details>"
            fi
          } > /tmp/engine-schemas-diff/transformers.summary.md

      - name: Probe-fail comment (skip downstream)
        if: steps.probe.outputs.verdict == 'fail' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-transformers-probe-blocked"
          REPO: ${{ github.repository }}
        run: |
          {
            echo "<!-- ${MARKER} -->"
            echo "## Engine schemas — transformers (probe-blocked)"
            echo
            echo "**Probe failed.** Introspector landmarks no longer resolve under the installed library."
            echo
            echo "**Missing landmarks:**"
            echo
            jq -r '.landmarks_missing[] | "- `" + . + "`"' /tmp/llem-probe-out/probe-transformers.json
            echo
            echo "**Downstream discovery was skipped.** No schema changes were committed against this PR."
            echo
            echo "**To unblock,** choose one of:"
            echo
            echo "- **Patch the introspector module's landmarks** — required when the library has genuinely renamed or removed the missing symbols. The introspector code needs updating to match the new library API."
            echo "- **Run \`@llem-ci-bot /approve-reuse transformers schemas\`** — widens the SSOT pin envelope to declare \"the existing introspector code is valid for this library version too.\" Only useful when the library bumped *past* the introspector's previously-validated version range but the landmarks still resolve."
            echo
            echo "**The probe is the canonical gate** — \`/approve-reuse\` does not bypass it. It only widens the version-pin so the version check stops blocking. If landmarks were genuinely renamed, only an introspector-module patch will turn the probe green. CI stays red until the probe verdict flips to \`pass\`."
          } | scripts/ci/upsert_pr_comment.sh
          gh pr edit "$PR" --add-label "probe-blocked" 2>/dev/null || true

      - name: Upload diff artefact
        if: steps.probe.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: engine-schemas-diff-transformers
          path: |
            /tmp/engine-schemas-diff/transformers.old.json
            /tmp/engine-schemas-diff/transformers.diff.json
            /tmp/engine-schemas-diff/transformers.summary.md
            ${{ env.SCHEMAS_DIR }}/transformers.json

      - name: Post per-pipeline comment
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-transformers-diff"
          REPO: ${{ github.repository }}
        run: |
          {
            echo "<!-- ${MARKER} -->"
            cat /tmp/engine-schemas-diff/transformers.summary.md
          } | scripts/ci/upsert_pr_comment.sh

      - name: Clean up stale probe-blocked comment (probe now passes)
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-transformers-probe-blocked"
          REPO: ${{ github.repository }}
          MODE: delete
        run: scripts/ci/upsert_pr_comment.sh

      - name: Apply per-pipeline label
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          for L in schemas-changed schemas-breaking schemas-safe probe-blocked; do
            gh pr edit "$PR_NUMBER" --remove-label "$L" 2>/dev/null || true
          done
          case "${{ steps.diff.outputs.classification }}" in
            breaking)  gh pr edit "$PR_NUMBER" --add-label "schemas-breaking" --add-label "schemas-changed" 2>/dev/null || true ;;
            safe)      gh pr edit "$PR_NUMBER" --add-label "schemas-safe" --add-label "schemas-changed" 2>/dev/null || true ;;
            no-changes) ;;
          esac

      - name: Atomic writeback
        # Schemas writes back first (sequential ordering Build → Schemas →
        # Invariants); invariants rebases against this commit when it
        # runs. No cross-wait required.
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.app-token.outputs.token != '' && steps.pr.outputs.number != '' && steps.pr.outputs.head_repo == github.repository
        run: |
          git config user.name  "llem-ci-bot[bot]"
          git config user.email "${{ secrets.APP_ID }}+llem-ci-bot[bot]@users.noreply.github.com"

          git add \
            "${SCHEMAS_DIR}/transformers.json" \
            engine_versions/transformers.yaml \
            docs/generated/curation-transformers.md

          if git diff --cached --quiet; then
            echo "No engine-schemas artefact changes to commit."
            exit 0
          fi

          git commit -m "chore(schemas): refresh transformers discovered schema"
          git push --force-with-lease

      - name: Apply cross-pipeline rollup label
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          if [[ "${{ steps.diff.outputs.classification }}" != "breaking" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "safe-bump" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --remove-label "safe-bump" 2>/dev/null || true
          fi

      - name: Probe-fail gate (red CI)
        if: steps.probe.outputs.verdict == 'fail'
        run: |
          echo "::error::Probe failed; downstream mining was skipped. CI is red until the probe-blocked comment is resolved."
          exit 1

  schemas-vllm:
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'pull_request' && needs.filter.result == 'success' && needs.filter.outputs.vllm == 'true')
        || (github.event_name == 'workflow_dispatch' && (inputs.engine == 'vllm' || inputs.engine == 'all'))
      )
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "/repo/src:/repo"
    steps:
      - name: Mint llem-ci-bot App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Clean workspace (fix root-owned files from prior Docker runs)
        # Container-written artefacts persist as root-owned on the self-
        # hosted runner and break subsequent checkouts otherwise. Mirrors
        # gpu-ci.yml + engine-invariants.yml.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            alpine sh -c "find /workspace -not -user $(id -u) -delete 2>/dev/null || true"

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve vLLM version from SSOT
        id: version
        run: |
          VER=$(yq '.library.current_version' engine_versions/vllm.yaml)
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve vllm version from engine_versions/vllm.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=llenergymeasure:vllm-${VER}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number (for comments + labels + writeback)
        id: pr
        # The vllm cell only fires on pull_request + workflow_dispatch.
        # Capture PR number + head repo into step outputs so comment /
        # label / writeback steps can gate on `steps.pr.outputs.number`
        # uniformly with the transformers cell (#544).
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_REPO="${{ github.repository }}"
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "head_repo=${HEAD_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "head_repo=" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Docker Hub auth availability
        # `secrets.*` cannot be referenced from a step `if:`; capture
        # the token's presence into a step output via an env-bridge so
        # the auth step below can gate on it cleanly.
        id: dockerhub_auth
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Docker Hub (if token configured)
        # Self-hosted runners pulling 15-50 GB upstream images
        # anonymously can hit Docker Hub rate limits. Auth gated on
        # secret presence so external contributors / unconfigured forks
        # don't fail; missing secret silently skips this step.
        if: steps.dockerhub_auth.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull vLLM upstream image and tag locally
        # vLLM publishes canonical images at vllm/vllm-openai:v${VER}.
        # Pull directly and re-tag to the convenience local tag the rest
        # of this job consumes; the llenergymeasure package is mounted at
        # runtime via PYTHONPATH rather than baked into a first-party
        # overlay image.
        run: |
          UPSTREAM="vllm/vllm-openai:v${{ steps.version.outputs.version }}"
          if ! docker image inspect "$UPSTREAM" >/dev/null 2>&1; then
            docker pull "$UPSTREAM"
          else
            echo "Image $UPSTREAM already cached locally; skipping pull."
          fi
          docker tag "$UPSTREAM" "${{ steps.version.outputs.image }}"

      - name: Compute stable discovery anchor
        id: anchor
        run: |
          PATHS=(
            "engine_versions/vllm.yaml"
            "scripts/engine_introspectors/vllm_introspector.py"
            "scripts/engine_introspectors/_common.py"
            "scripts/engine_introspectors/__init__.py"
            "scripts/engine_introspectors/__main__.py"
          )
          DATE=$(git log -1 --format=%aI -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Probe — landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          mkdir -p /tmp/llem-probe-out
          docker run --rm --gpus all \
            --user $(id -u):$(id -g) \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -v "${{ github.workspace }}:/repo" \
            -v /tmp/llem-probe-out:/llem-probe-out:rw \
            -w /repo \
            -e PYTHONPATH \
            -e PYTHONDONTWRITEBYTECODE \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts._probe --engine vllm --producer schemas \
              --output /llem-probe-out/probe-vllm.json
          VERDICT=$(jq -r '.verdict' /tmp/llem-probe-out/probe-vllm.json)
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"

      - name: Update last_probe in SSOT
        # See schemas-transformers cell for rationale (#497). Runs in the
        # vLLM image. `--user` keeps the rewritten engine_versions/vllm.yaml
        # owned by the runner so subsequent host-side steps can read +
        # commit it.
        if: always() && steps.probe.outcome == 'success'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -v "${{ github.workspace }}:/repo" \
            -v /tmp/llem-probe-out:/llem-probe-out:ro \
            -w /repo \
            -e PYTHONPATH \
            --entrypoint bash \
            "$IMAGE" \
            -c 'python3 scripts/update_last_probe.py --engine vllm < /llem-probe-out/probe-vllm.json'

      - name: Save current schema for diffing
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          mkdir -p /tmp/engine-schemas-diff
          OLD="${SCHEMAS_DIR}/vllm.json"
          DEST="/tmp/engine-schemas-diff/vllm.old.json"
          if [[ -f "$OLD" ]]; then
            cp "$OLD" "$DEST"
          else
            echo '{}' > "$DEST"
          fi

      - name: Discover schema inside container
        if: steps.probe.outputs.verdict == 'pass'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ANCHOR_DATE: ${{ steps.anchor.outputs.date }}
        run: |
          docker run --rm --gpus all \
            --user $(id -u):$(id -g) \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -e LLENERGY_DISCOVERY_FROZEN_AT="${ANCHOR_DATE}" \
            -e PYTHONDONTWRITEBYTECODE \
            -e PYTHONPATH \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts.engine_introspectors \
              --engine vllm \
              --image-ref "${IMAGE}" \
              --output "${SCHEMAS_DIR}/vllm.json"

      - name: Set up Python (host) for doc-gen + diff
        if: steps.probe.outputs.verdict == 'pass'
        # Doc generator + differ run on the host (no GPU needed, but they
        # DO import llenergymeasure.* + scripts.engine_miners.*).
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-schemas-vllm-docgen-3.12
          python-version: "3.12"

      - name: Install lean host project for doc-gen
        if: steps.probe.outputs.verdict == 'pass'
        run: uv sync --dev

      - name: Regenerate schemas digest
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          uv run python scripts/generate_curation_doc.py --engine vllm

      - name: Classify diff
        if: steps.probe.outputs.verdict == 'pass'
        id: diff
        run: |
          set +e
          uv run python scripts/diff_discovered_schemas.py \
            /tmp/engine-schemas-diff/vllm.old.json \
            "${SCHEMAS_DIR}/vllm.json" \
            > /tmp/engine-schemas-diff/vllm.diff.json
          DIFF_EXIT=$?
          set -e

          if diff -q /tmp/engine-schemas-diff/vllm.old.json \
                    "${SCHEMAS_DIR}/vllm.json" >/dev/null 2>&1; then
            CLASSIFICATION="no-changes"
          elif [[ $DIFF_EXIT -eq 1 ]]; then
            CLASSIFICATION="breaking"
          else
            CLASSIFICATION="safe"
          fi
          echo "classification=${CLASSIFICATION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Engine schemas — vllm"
            echo
            if [[ "$CLASSIFICATION" == "no-changes" ]]; then
              echo "_No changes to discovered schema._"
            else
              SUMMARY=$(jq -r '.summary // "schema diff produced"' /tmp/engine-schemas-diff/vllm.diff.json 2>/dev/null || echo "schema diff produced")
              echo "${SUMMARY}"
              echo
              echo "<details><summary>Structured diff</summary>"
              echo
              echo '```json'
              jq '.' /tmp/engine-schemas-diff/vllm.diff.json 2>/dev/null | head -n 200 || true
              echo '```'
              echo
              echo "</details>"
            fi
          } > /tmp/engine-schemas-diff/vllm.summary.md

      - name: Probe-fail comment (skip downstream)
        if: steps.probe.outputs.verdict == 'fail' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-vllm-probe-blocked"
          REPO: ${{ github.repository }}
        run: |
          {
            echo "<!-- ${MARKER} -->"
            echo "## Engine schemas — vllm (probe-blocked)"
            echo
            echo "**Probe failed.** Introspector landmarks no longer resolve under the installed library."
            echo
            echo "**Missing landmarks:**"
            echo
            jq -r '.landmarks_missing[] | "- `" + . + "`"' /tmp/llem-probe-out/probe-vllm.json
            echo
            echo "**Downstream discovery was skipped.** No schema changes were committed against this PR."
            echo
            echo "**To unblock,** choose one of:"
            echo
            echo "- **Patch the introspector module's landmarks** — required when the library has genuinely renamed or removed the missing symbols. The introspector code needs updating to match the new library API."
            echo "- **Run \`@llem-ci-bot /approve-reuse vllm schemas\`** — widens the SSOT pin envelope to declare \"the existing introspector code is valid for this library version too.\" Only useful when the library bumped *past* the introspector's previously-validated version range but the landmarks still resolve."
            echo
            echo "**The probe is the canonical gate** — \`/approve-reuse\` does not bypass it. It only widens the version-pin so the version check stops blocking. If landmarks were genuinely renamed, only an introspector-module patch will turn the probe green. CI stays red until the probe verdict flips to \`pass\`."
          } | scripts/ci/upsert_pr_comment.sh
          gh pr edit "$PR" --add-label "probe-blocked" 2>/dev/null || true

      - name: Upload diff artefact
        if: steps.probe.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: engine-schemas-diff-vllm
          path: |
            /tmp/engine-schemas-diff/vllm.old.json
            /tmp/engine-schemas-diff/vllm.diff.json
            /tmp/engine-schemas-diff/vllm.summary.md
            ${{ env.SCHEMAS_DIR }}/vllm.json

      - name: Post per-pipeline comment
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-vllm-diff"
          REPO: ${{ github.repository }}
        run: |
          {
            echo "<!-- ${MARKER} -->"
            cat /tmp/engine-schemas-diff/vllm.summary.md
          } | scripts/ci/upsert_pr_comment.sh

      - name: Clean up stale probe-blocked comment (probe now passes)
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-vllm-probe-blocked"
          REPO: ${{ github.repository }}
          MODE: delete
        run: scripts/ci/upsert_pr_comment.sh

      - name: Apply per-pipeline label
        if: steps.probe.outputs.verdict == 'pass' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          for L in schemas-changed schemas-breaking schemas-safe probe-blocked; do
            gh pr edit "$PR_NUMBER" --remove-label "$L" 2>/dev/null || true
          done
          case "${{ steps.diff.outputs.classification }}" in
            breaking)  gh pr edit "$PR_NUMBER" --add-label "schemas-breaking" --add-label "schemas-changed" 2>/dev/null || true ;;
            safe)      gh pr edit "$PR_NUMBER" --add-label "schemas-safe" --add-label "schemas-changed" 2>/dev/null || true ;;
            no-changes) ;;
          esac

      - name: Atomic writeback
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.app-token.outputs.token != '' && steps.pr.outputs.number != '' && steps.pr.outputs.head_repo == github.repository
        run: |
          git config user.name  "llem-ci-bot[bot]"
          git config user.email "${{ secrets.APP_ID }}+llem-ci-bot[bot]@users.noreply.github.com"

          # Pull in any sibling-pipeline writeback that landed first.
          git pull --rebase --autostash

          git add \
            "${SCHEMAS_DIR}/vllm.json" \
            engine_versions/vllm.yaml \
            docs/generated/curation-vllm.md

          if git diff --cached --quiet; then
            echo "No engine-schemas artefact changes to commit."
            exit 0
          fi

          git commit -m "chore(schemas): refresh vllm discovered schema"
          git push --force-with-lease

      - name: Apply cross-pipeline rollup label
        if: steps.probe.outputs.verdict == 'pass' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          if [[ "${{ steps.diff.outputs.classification }}" != "breaking" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "safe-bump" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --remove-label "safe-bump" 2>/dev/null || true
          fi

      - name: Probe-fail gate (red CI)
        # Probe-fail must show as a red CI check: PRs cannot merge with a
        # stale corpus. The probe-blocked comment above explains how to
        # resolve (/approve-reuse to widen the SSOT envelope, or landmark
        # patch); this gate makes that resolution mandatory rather than
        # advisory.
        if: steps.probe.outputs.verdict == 'fail'
        run: |
          echo "::error::Probe failed; downstream mining was skipped. CI is red until the probe-blocked comment is resolved."
          exit 1

  schemas-tensorrt:
    # tensorrt static introspector reads source files from
    # /tmp/trt-llm-${VER}/ for the same reasons as invariants-tensorrt
    # (see that cell's comment, and #472 / #500). The probe + discover
    # steps bind-mount a host-side tarball extraction rather than
    # introspecting the installed NGC package, decoupling source
    # resolution from NGC image internals.
    needs: filter
    if: >-
      always()
      && (
        (github.event_name == 'pull_request' && needs.filter.result == 'success' && needs.filter.outputs.tensorrt == 'true')
        || (github.event_name == 'workflow_dispatch' && (inputs.engine == 'tensorrt' || inputs.engine == 'all'))
      )
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "/repo/src:/repo"
      LD_LIBRARY_PATH: "/usr/local/cuda/compat/lib.real:/usr/local/cuda/compat/lib:/usr/local/tensorrt/lib"
    steps:
      - name: Mint llem-ci-bot App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Clean workspace (fix root-owned files from prior Docker runs)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            alpine sh -c "find /workspace -not -user $(id -u) -delete 2>/dev/null || true"

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve TRT-LLM version from SSOT
        id: version
        run: |
          VER=$(yq '.library.current_version' engine_versions/tensorrt.yaml)
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve tensorrt version from engine_versions/tensorrt.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=llenergymeasure:tensorrt-${VER}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number (for comments + labels + writeback)
        id: pr
        # The tensorrt cell only fires on pull_request + workflow_dispatch.
        # Capture PR number + head repo into step outputs so comment /
        # label / writeback steps can gate on `steps.pr.outputs.number`
        # uniformly with the transformers cell (#544).
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_REPO="${{ github.repository }}"
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "head_repo=${HEAD_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "head_repo=" >> "$GITHUB_OUTPUT"
          fi

      # Self-hosted runners must have nvcr.io credentials configured (see docs/development.md).
      - name: Pull TRT-LLM upstream image and tag locally
        # NGC publishes canonical TRT-LLM images at
        # nvcr.io/nvidia/tensorrt-llm/release:${VER}. Pull directly and
        # re-tag to the convenience local tag the rest of this job
        # consumes; the llenergymeasure package is mounted at runtime
        # via PYTHONPATH rather than baked into a first-party overlay.
        run: |
          UPSTREAM="nvcr.io/nvidia/tensorrt-llm/release:${{ steps.version.outputs.version }}"
          if ! docker image inspect "$UPSTREAM" >/dev/null 2>&1; then
            docker pull "$UPSTREAM"
          else
            echo "Image $UPSTREAM already cached locally; skipping pull."
          fi
          docker tag "$UPSTREAM" "${{ steps.version.outputs.image }}"

      - name: Compute stable discovery anchor
        id: anchor
        run: |
          PATHS=(
            "engine_versions/tensorrt.yaml"
            "scripts/engine_introspectors/tensorrt_introspector.py"
            "scripts/engine_introspectors/_common.py"
            "scripts/engine_introspectors/__init__.py"
            "scripts/engine_introspectors/__main__.py"
          )
          DATE=$(git log -1 --format=%aI -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Fetch tensorrt-llm source tarball (host)
        # Static introspector reads source from /tmp/trt-llm-${VER}/ for
        # the same reasons as invariants-tensorrt — see that cell's
        # comment. URL template lives in `engine_versions/tensorrt.yaml`
        # under `source_tarball.url_template` (#532). Skip the fetch when
        # the tree is already extracted at this version (sibling
        # invariants-tensorrt cell or a prior re-run of this PR may have
        # populated it on the self-hosted runner).
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DEST="/tmp/trt-llm-${VER}"
          if [[ -d "${DEST}/tensorrt_llm" ]]; then
            echo "Source tree already present at ${DEST}; skipping fetch."
            exit 0
          fi
          URL_TEMPLATE=$(yq '.source_tarball.url_template' engine_versions/tensorrt.yaml)
          if [[ -z "$URL_TEMPLATE" || "$URL_TEMPLATE" == "null" ]]; then
            echo "Could not resolve source_tarball.url_template from engine_versions/tensorrt.yaml" >&2
            exit 1
          fi
          URL="${URL_TEMPLATE//\{version\}/${VER}}"
          mkdir -p "${DEST}"
          curl -fsSL "${URL}" \
            | tar -xz -C "${DEST}" --strip-components=1
          test -d "${DEST}/tensorrt_llm"

      - name: Probe — landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VER: ${{ steps.version.outputs.version }}
        # Source tree is on the host at /tmp/trt-llm-${VER}/ (extracted in
        # the previous step) and bind-mounted into the container at the
        # same path. LD_LIBRARY_PATH override so libtensorrt_llm.so finds
        # bundled CUDA compat libs.
        run: |
          mkdir -p /tmp/llem-probe-out
          docker run --rm --gpus all \
            --user $(id -u):$(id -g) \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -e LD_LIBRARY_PATH \
            -e PYTHONPATH \
            -e PYTHONDONTWRITEBYTECODE \
            -v "${{ github.workspace }}:/repo" \
            -v "/tmp/trt-llm-${VER}:/tmp/trt-llm-${VER}:ro" \
            -v /tmp/llem-probe-out:/llem-probe-out:rw \
            -w /repo \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts._probe --engine tensorrt --producer schemas \
              --output /llem-probe-out/probe-tensorrt.json
          VERDICT=$(jq -r '.verdict' /tmp/llem-probe-out/probe-tensorrt.json)
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"

      - name: Update last_probe in SSOT
        # See schemas-transformers cell for rationale (#497). Runs in the
        # TRT-LLM image; `--user` matches the surrounding discover step's
        # pattern so the rewritten engine_versions/tensorrt.yaml stays
        # runner-owned.
        if: always() && steps.probe.outcome == 'success'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -v "${{ github.workspace }}:/repo" \
            -v /tmp/llem-probe-out:/llem-probe-out:ro \
            -w /repo \
            -e LD_LIBRARY_PATH \
            -e PYTHONPATH \
            --entrypoint bash \
            "$IMAGE" \
            -c 'python3 scripts/update_last_probe.py --engine tensorrt < /llem-probe-out/probe-tensorrt.json'

      - name: Save current schema for diffing
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          mkdir -p /tmp/engine-schemas-diff
          OLD="${SCHEMAS_DIR}/tensorrt.json"
          DEST="/tmp/engine-schemas-diff/tensorrt.old.json"
          if [[ -f "$OLD" ]]; then
            cp "$OLD" "$DEST"
          else
            echo '{}' > "$DEST"
          fi

      - name: Discover schema inside container
        if: steps.probe.outputs.verdict == 'pass'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ANCHOR_DATE: ${{ steps.anchor.outputs.date }}
          TRTLLM_VER: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --gpus all \
            --user $(id -u):$(id -g) \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -e LD_LIBRARY_PATH \
            -e LLENERGY_DISCOVERY_FROZEN_AT="${ANCHOR_DATE}" \
            -e PYTHONDONTWRITEBYTECODE \
            -e PYTHONPATH \
            -v "${{ github.workspace }}:/repo" \
            -v "/tmp/trt-llm-${TRTLLM_VER}:/tmp/trt-llm-${TRTLLM_VER}:ro" \
            -w /repo \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts.engine_introspectors \
              --engine tensorrt \
              --image-ref "${IMAGE}" \
              --output "${SCHEMAS_DIR}/tensorrt.json"

      - name: Set up Python (host) for doc-gen + diff
        if: steps.probe.outputs.verdict == 'pass'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-schemas-tensorrt-docgen-3.12
          python-version: "3.12"

      - name: Install lean host project for doc-gen
        if: steps.probe.outputs.verdict == 'pass'
        run: uv sync --dev

      - name: Regenerate schemas digest
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          uv run python scripts/generate_curation_doc.py --engine tensorrt

      - name: Classify diff
        if: steps.probe.outputs.verdict == 'pass'
        id: diff
        run: |
          set +e
          uv run python scripts/diff_discovered_schemas.py \
            /tmp/engine-schemas-diff/tensorrt.old.json \
            "${SCHEMAS_DIR}/tensorrt.json" \
            > /tmp/engine-schemas-diff/tensorrt.diff.json
          DIFF_EXIT=$?
          set -e

          if diff -q /tmp/engine-schemas-diff/tensorrt.old.json \
                    "${SCHEMAS_DIR}/tensorrt.json" >/dev/null 2>&1; then
            CLASSIFICATION="no-changes"
          elif [[ $DIFF_EXIT -eq 1 ]]; then
            CLASSIFICATION="breaking"
          else
            CLASSIFICATION="safe"
          fi
          echo "classification=${CLASSIFICATION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Engine schemas — tensorrt"
            echo
            if [[ "$CLASSIFICATION" == "no-changes" ]]; then
              echo "_No changes to discovered schema._"
            else
              SUMMARY=$(jq -r '.summary // "schema diff produced"' /tmp/engine-schemas-diff/tensorrt.diff.json 2>/dev/null || echo "schema diff produced")
              echo "${SUMMARY}"
              echo
              echo "<details><summary>Structured diff</summary>"
              echo
              echo '```json'
              jq '.' /tmp/engine-schemas-diff/tensorrt.diff.json 2>/dev/null | head -n 200 || true
              echo '```'
              echo
              echo "</details>"
            fi
          } > /tmp/engine-schemas-diff/tensorrt.summary.md

      - name: Probe-fail comment (skip downstream)
        if: steps.probe.outputs.verdict == 'fail' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-tensorrt-probe-blocked"
          REPO: ${{ github.repository }}
        run: |
          {
            echo "<!-- ${MARKER} -->"
            echo "## Engine schemas — tensorrt (probe-blocked)"
            echo
            echo "**Probe failed.** Introspector landmarks no longer resolve under the installed library."
            echo
            echo "**Missing landmarks:**"
            echo
            jq -r '.landmarks_missing[] | "- `" + . + "`"' /tmp/llem-probe-out/probe-tensorrt.json
            echo
            echo "**Downstream discovery was skipped.** No schema changes were committed against this PR."
            echo
            echo "**To unblock,** choose one of:"
            echo
            echo "- **Patch the introspector module's landmarks** — required when the library has genuinely renamed or removed the missing symbols. The introspector code needs updating to match the new library API."
            echo "- **Run \`@llem-ci-bot /approve-reuse tensorrt schemas\`** — widens the SSOT pin envelope to declare \"the existing introspector code is valid for this library version too.\" Only useful when the library bumped *past* the introspector's previously-validated version range but the landmarks still resolve."
            echo
            echo "**The probe is the canonical gate** — \`/approve-reuse\` does not bypass it. It only widens the version-pin so the version check stops blocking. If landmarks were genuinely renamed, only an introspector-module patch will turn the probe green. CI stays red until the probe verdict flips to \`pass\`."
          } | scripts/ci/upsert_pr_comment.sh
          gh pr edit "$PR" --add-label "probe-blocked" 2>/dev/null || true

      - name: Upload diff artefact
        if: steps.probe.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: engine-schemas-diff-tensorrt
          path: |
            /tmp/engine-schemas-diff/tensorrt.old.json
            /tmp/engine-schemas-diff/tensorrt.diff.json
            /tmp/engine-schemas-diff/tensorrt.summary.md
            ${{ env.SCHEMAS_DIR }}/tensorrt.json

      - name: Post per-pipeline comment
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-tensorrt-diff"
          REPO: ${{ github.repository }}
        run: |
          {
            echo "<!-- ${MARKER} -->"
            cat /tmp/engine-schemas-diff/tensorrt.summary.md
          } | scripts/ci/upsert_pr_comment.sh

      - name: Clean up stale probe-blocked comment (probe now passes)
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "bot-id: schemas-tensorrt-probe-blocked"
          REPO: ${{ github.repository }}
          MODE: delete
        run: scripts/ci/upsert_pr_comment.sh

      - name: Apply per-pipeline label
        if: steps.probe.outputs.verdict == 'pass' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          for L in schemas-changed schemas-breaking schemas-safe probe-blocked; do
            gh pr edit "$PR_NUMBER" --remove-label "$L" 2>/dev/null || true
          done
          case "${{ steps.diff.outputs.classification }}" in
            breaking)  gh pr edit "$PR_NUMBER" --add-label "schemas-breaking" --add-label "schemas-changed" 2>/dev/null || true ;;
            safe)      gh pr edit "$PR_NUMBER" --add-label "schemas-safe" --add-label "schemas-changed" 2>/dev/null || true ;;
            no-changes) ;;
          esac

      - name: Atomic writeback
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.app-token.outputs.token != '' && steps.pr.outputs.number != '' && steps.pr.outputs.head_repo == github.repository
        run: |
          git config user.name  "llem-ci-bot[bot]"
          git config user.email "${{ secrets.APP_ID }}+llem-ci-bot[bot]@users.noreply.github.com"

          # Pull in any sibling-pipeline writeback that landed first.
          git pull --rebase --autostash

          git add \
            "${SCHEMAS_DIR}/tensorrt.json" \
            engine_versions/tensorrt.yaml \
            docs/generated/curation-tensorrt.md

          if git diff --cached --quiet; then
            echo "No engine-schemas artefact changes to commit."
            exit 0
          fi

          git commit -m "chore(schemas): refresh tensorrt discovered schema"
          git push --force-with-lease

      - name: Apply cross-pipeline rollup label
        if: steps.probe.outputs.verdict == 'pass' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          if [[ "${{ steps.diff.outputs.classification }}" != "breaking" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "safe-bump" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --remove-label "safe-bump" 2>/dev/null || true
          fi

      - name: Probe-fail gate (red CI)
        # Probe-fail must show as a red CI check: PRs cannot merge with a
        # stale corpus. The probe-blocked comment above explains how to
        # resolve (/approve-reuse to widen the SSOT envelope, or landmark
        # patch); this gate makes that resolution mandatory rather than
        # advisory.
        if: steps.probe.outputs.verdict == 'fail'
        run: |
          echo "::error::Probe failed; downstream mining was skipped. CI is red until the probe-blocked comment is resolved."
          exit 1
