        run: |
          docker run --rm --gpus all \
            -e LD_LIBRARY_PATH="/usr/local/cuda/compat/lib.real:/usr/local/cuda/compat/lib:/usr/local/tensorrt/lib" \
            -e PYTHONPATH=/repo/src:/repo \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${{ github.workspace }}:/repo" \
            -v "/tmp/trt-llm-${VER}:/tmp/trt-llm-${VER}:ro" \
            -w /repo \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts._probe --engine tensorrt --producer invariants \
