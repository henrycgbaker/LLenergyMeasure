name: Engine Invariants — Probe + Mine + Vendor

# Per-concern workflow for the engine-invariants layer. Each per-engine job
# probes the producer module's landmarks, mines the rules corpus, vendor-
# replays it against the live library, regenerates the invariants digest
# doc, and atomically commits all four artefacts back to the PR branch.
#
# Trigger asymmetry across engines is expressed via multi-trigger + per-job
# `if:` gating rather than file proliferation. One workflow file covers all
# three engines:
#
#   transformers : workflow_run-gated on Engine Image Build (transformers).
#                  The heavy first-party Docker build happens once in
#                  engine-image-build.yml; this job pulls the resulting
#                  image and runs probe + mine + vendor + writeback.
#   vllm         : pull_request: paths-gated. Pulls upstream
#                  vllm/vllm-openai:v${VER} directly (no first-party build)
#                  so it doesn't depend on engine-image-build.yml.
#   tensorrt     : pull_request: paths-gated. Pulls upstream
#                  nvcr.io/nvidia/tensorrt-llm/release:${VER} directly.
#
# Per-engine runner choice:
#   transformers : ubuntu-latest (CPU). transformers miners are CPU-safe.
#   vllm         : self-hosted GPU runner inside llenergymeasure:vllm-${VER}.
#                  vLLM miners ARE CPU-safe but the unified host uv.lock
#                  used to break vllm's torch via tensorrt-llm 0.21.0's
#                  transitive constraints (#437, #464); engines now run
#                  exclusively in their own image, so this lane never
#                  touches the host lock.
#   tensorrt     : self-hosted GPU runner inside llenergymeasure:tensorrt-
#                  ${VER}; TRT-LLM 0.21.0 loads CUDA bindings on import so
#                  CPU runners cannot import the library at all.
#
# Determinism contract:
#   The LLENERGY_MINER_FROZEN_AT and LLENERGY_VENDOR_FROZEN_AT env vars are
#   set from the author date of the most recent commit touching any INPUT
#   path (miner modules, lift modules, build_corpus, vendor script, refresh
#   helper, SSOT yaml). The anchor is stable across the workflow's own
#   commit-back (which only touches OUTPUT paths), so re-runs on unchanged
#   source emit byte-identical YAML. This determinism is THE prevention
#   against the synchronize-loop the watchdog catches.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "engine_versions/vllm.yaml"
      - "engine_versions/tensorrt.yaml"
      - "scripts/engine_miners/**"
      - "scripts/vendor_rules.py"
      - "scripts/_invariant_vendor_common.py"
      - "scripts/refresh_invariant_rules.sh"
      - "configs/engine_invariants/**"
      - ".github/workflows/engine-invariants.yml"
  workflow_run:
    workflows: ["Engine Image Build (transformers)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      engine:
        description: "Engine to probe + mine + vendor"
        required: true
        type: choice
        options:
          - transformers
          - vllm
          - tensorrt
          - all
      pr_number:
        description: "PR number to comment on and label (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  # workflow_run.head_sha distinguishes per-PR runs for the transformers
  # cell; pull_request runs use github.head_ref. Combine both so the group
  # string stays stable across trigger sources.
  group: engine-invariants-${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha || github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CORPUS_DIR: configs/engine_invariants

jobs:
  invariants-transformers:
    # Selected on workflow_run (Engine Image Build success) or
    # workflow_dispatch with engine=transformers/all. Skipped on
    # pull_request: the transformers cell needs the pre-built image,
    # which engine-image-build.yml produces first.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && (inputs.engine == 'transformers' || inputs.engine == 'all'))
    runs-on: ubuntu-latest
    # No build step here — pure probe + mine + vendor. 30 min is generous.
    timeout-minutes: 30
    steps:
      - name: Mint llem-ci-bot App token
        # Short-lived (~1 hour) GitHub App token. Events it produces are
        # NOT subject to the default GITHUB_TOKEN recursive-workflow guard,
        # so the commit-back below can legitimately retrigger downstream
        # CI. Skipped on fork PRs (secrets are not exposed in workflow_run
        # contexts triggered from forks) so the workflow still runs read-
        # only for external contributors.
        id: app-token
        if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout PR head
        # workflow_run runs on the default branch by default. Explicitly
        # check out the head SHA of the run that triggered us so the mine
        # + writeback operate on the right code. workflow_dispatch falls
        # back to github.ref.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve transformers version from SSOT
        id: version
        run: |
          VER=$(yq '.library.current_version' engine_versions/transformers.yaml)
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve transformers version from engine_versions/transformers.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=llenergymeasure:transformers-${VER}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number (for comments + labels + writeback)
        id: pr
        # workflow_run.pull_requests is empty for cross-fork PRs; gracefully
        # downgrade to no-comment / no-writeback in that case. Same-repo
        # PRs and push events provide what we need. workflow_dispatch can
        # supply pr_number via input.
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            HEAD_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_REPO="${{ github.repository }}"
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "head_repo=${HEAD_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "head_repo=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR (read-only, for image pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built transformers image and tag locally
        # PR-triggered upstream runs publish to the transformers-cache repo;
        # push-triggered upstream runs publish to the canonical repo's
        # per-version tag. Either way we re-tag to the local convenience
        # tag the rest of this job consumes.
        run: |
          if [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            UPSTREAM="ghcr.io/${{ github.repository }}/transformers-cache:transformers-${{ steps.version.outputs.version }}"
          else
            UPSTREAM="ghcr.io/${{ github.repository }}/transformers:transformers-${{ steps.version.outputs.version }}"
          fi
          docker pull "$UPSTREAM"
          docker tag "$UPSTREAM" "${{ steps.version.outputs.image }}"

      - name: Compute stable mining + vendor anchor
        id: anchor
        run: |
          PATHS=(
            "engine_versions/transformers.yaml"
            "docker/Dockerfile.transformers"
            "scripts/engine_miners/transformers_static_miner.py"
            "scripts/engine_miners/transformers_dynamic_miner.py"
            "scripts/engine_miners/transformers_miner.py"
            "scripts/engine_miners/build_corpus.py"
            "scripts/engine_miners/_base.py"
            "scripts/engine_miners/_pydantic_lift.py"
            "scripts/engine_miners/_msgspec_lift.py"
            "scripts/engine_miners/_dataclass_lift.py"
            "scripts/engine_miners/_fixpoint_test.py"
            "scripts/vendor_rules.py"
            "scripts/_invariant_vendor_common.py"
            "scripts/refresh_invariant_rules.sh"
          )
          SHA=$(git log -1 --format=%H -- "${PATHS[@]}")
          DATE=$(git log -1 --format=%aI -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          echo "sha=${SHA:-${{ github.event.workflow_run.head_sha || github.sha }}}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Probe — landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts._probe --engine transformers --producer invariants \
            > /tmp/probe-transformers.json
          VERDICT=$(jq -r '.verdict' /tmp/probe-transformers.json)
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"

      - name: Save current YAMLs for diffing
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          mkdir -p /tmp/engine-invariants-diff
          for KIND in proposed vendored; do
            OLD_YAML="${CORPUS_DIR}/transformers.${KIND}.yaml"
            DEST="/tmp/engine-invariants-diff/transformers.${KIND}.old.yaml"
            if [[ -f "$OLD_YAML" ]]; then
              cp "$OLD_YAML" "$DEST"
            else
              : > "$DEST"
            fi
          done

      - name: Mine + vendor inside container
        if: steps.probe.outputs.verdict == 'pass'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ANCHOR_SHA: ${{ steps.anchor.outputs.sha }}
          ANCHOR_DATE: ${{ steps.anchor.outputs.date }}
        run: |
          docker run --rm \
            -e LLENERGY_MINER_FROZEN_AT="${ANCHOR_DATE}" \
            -e LLENERGY_VENDOR_FROZEN_AT="${ANCHOR_DATE}" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint bash \
            "$IMAGE" \
            -c "
              set -euo pipefail
              python3 -m scripts.engine_miners.build_corpus --engine transformers
              python3 scripts/vendor_rules.py \
                --engine transformers \
                --corpus '${CORPUS_DIR}/transformers.proposed.yaml' \
                --out '${CORPUS_DIR}/transformers.vendored.yaml' \
                --vendor-commit '${ANCHOR_SHA}' \
                --fail-on-divergence
            "

      - name: Set up Python (host) for doc-gen + diff
        if: steps.probe.outputs.verdict == 'pass'
        # Doc generator + differ run on the host (no engine import needed,
        # but they DO import llenergymeasure.* + scripts.engine_miners.*).
        # `uv sync --dev` installs the lean host project (no engine extras).
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-invariants-transformers-docgen-3.12
          python-version: "3.12"

      - name: Install lean host project for doc-gen
        if: steps.probe.outputs.verdict == 'pass'
        run: uv sync --dev

      - name: Regenerate invariants digest doc
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          uv run python scripts/generate_invariants_doc.py \
            --engine transformers \
            --out docs/generated/invariants-transformers.md

      - name: Classify diff (proposed + vendored)
        if: steps.probe.outputs.verdict == 'pass'
        id: diff
        run: |
          set +e
          uv run python scripts/diff_engine_invariants.py \
            /tmp/engine-invariants-diff/transformers.vendored.old.yaml \
            "${CORPUS_DIR}/transformers.vendored.yaml" \
            --out /tmp/engine-invariants-diff/transformers.vendored.md \
            --title "Transformers vendored invariants diff"
          VENDORED_EXIT=$?
          set -e

          PROPOSED_CHANGED=true
          if diff -q /tmp/engine-invariants-diff/transformers.proposed.old.yaml \
                    "${CORPUS_DIR}/transformers.proposed.yaml" >/dev/null 2>&1; then
            PROPOSED_CHANGED=false
          fi

          VENDORED_CHANGED=true
          if diff -q /tmp/engine-invariants-diff/transformers.vendored.old.yaml \
                    "${CORPUS_DIR}/transformers.vendored.yaml" >/dev/null 2>&1; then
            VENDORED_CHANGED=false
          fi

          if [[ "$PROPOSED_CHANGED" == "false" && "$VENDORED_CHANGED" == "false" ]]; then
            CLASSIFICATION="no-changes"
          elif [[ $VENDORED_EXIT -eq 1 ]]; then
            CLASSIFICATION="breaking"
          else
            CLASSIFICATION="safe"
          fi
          echo "classification=${CLASSIFICATION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Engine invariants — transformers"
            echo
            if [[ "$CLASSIFICATION" == "no-changes" ]]; then
              echo "_No changes to proposed or vendored invariants._"
            else
              if [[ "$PROPOSED_CHANGED" == "true" ]]; then
                echo "### Proposed corpus diff"
                echo
                echo '```diff'
                diff -u /tmp/engine-invariants-diff/transformers.proposed.old.yaml \
                        "${CORPUS_DIR}/transformers.proposed.yaml" | head -n 200 || true
                echo '```'
                echo
              fi
              if [[ -f /tmp/engine-invariants-diff/transformers.vendored.md ]]; then
                cat /tmp/engine-invariants-diff/transformers.vendored.md
              fi
            fi
          } > /tmp/engine-invariants-diff/transformers.summary.md

      - name: Probe-fail comment (skip downstream)
        if: steps.probe.outputs.verdict == 'fail' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          {
            echo "## Engine invariants — transformers (probe-blocked)"
            echo
            echo "**Probe failed.** Producer landmarks no longer resolve under the installed library."
            echo
            echo "**Missing landmarks:**"
            echo
            jq -r '.landmarks_missing[] | "- `" + . + "`"' /tmp/probe-transformers.json
            echo
            echo "**Downstream mine + vendor steps were skipped.** No corpus changes were committed against this PR."
            echo
            echo "**To unblock,** choose one of:"
            echo
            echo "- **Patch the producer module's landmarks** — required when the library has genuinely renamed or removed the missing symbols. The miner code needs updating to match the new library API."
            echo "- **Run \`@llem-ci-bot /approve-reuse transformers invariants\`** — widens the SSOT pin envelope to declare \"the existing miner code is valid for this library version too.\" Only useful when the library bumped *past* the miner's previously-validated version range but the landmarks still resolve."
            echo
            echo "**The probe is the canonical gate** — \`/approve-reuse\` does not bypass it. It only widens the version-pin so the version check stops blocking. If landmarks were genuinely renamed, only a producer-module patch will turn the probe green. CI stays red until the probe verdict flips to \`pass\`."
          } | gh pr comment "$PR_NUMBER" --body-file -
          gh pr edit "$PR_NUMBER" --add-label "probe-blocked" 2>/dev/null || true

      - name: Upload diff artefact
        if: steps.probe.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: engine-invariants-diff-transformers
          path: |
            /tmp/engine-invariants-diff/transformers.proposed.old.yaml
            /tmp/engine-invariants-diff/transformers.vendored.old.yaml
            /tmp/engine-invariants-diff/transformers.summary.md
            ${{ env.CORPUS_DIR }}/transformers.proposed.yaml
            ${{ env.CORPUS_DIR }}/transformers.vendored.yaml

      - name: Post per-pipeline comment (suppress on empty)
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --body-file /tmp/engine-invariants-diff/transformers.summary.md

      - name: Apply per-pipeline label
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          for L in invariants-changed invariants-breaking invariants-safe probe-blocked; do
            gh pr edit "$PR_NUMBER" --remove-label "$L" 2>/dev/null || true
          done
          case "${{ steps.diff.outputs.classification }}" in
            breaking)  gh pr edit "$PR_NUMBER" --add-label "invariants-breaking" --add-label "invariants-changed" 2>/dev/null || true ;;
            safe)      gh pr edit "$PR_NUMBER" --add-label "invariants-safe" --add-label "invariants-changed" 2>/dev/null || true ;;
            no-changes) ;;
          esac

      - name: Atomic writeback
        # Sequential pipeline ordering (build → schemas → invariants) means
        # invariants is always the second writer; pull --rebase --autostash
        # absorbs the schemas writeback that landed first.
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.app-token.outputs.token != '' && steps.pr.outputs.number != '' && steps.pr.outputs.head_repo == github.repository
        run: |
          git config user.name  "llem-ci-bot[bot]"
          git config user.email "${{ secrets.APP_ID }}+llem-ci-bot[bot]@users.noreply.github.com"

          # Pull in any sibling-pipeline writeback that landed first.
          git pull --rebase --autostash

          git add \
            "${CORPUS_DIR}/transformers.proposed.yaml" \
            "${CORPUS_DIR}/transformers.vendored.yaml" \
            docs/generated/invariants-transformers.md

          if git diff --cached --quiet; then
            echo "No engine-invariants artefact changes to commit."
            exit 0
          fi

          git commit -m "chore(invariants): refresh transformers proposed + vendored corpus"
          git push --force-with-lease

      - name: Apply cross-pipeline rollup label
        if: steps.probe.outputs.verdict == 'pass' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          if [[ "${{ steps.diff.outputs.classification }}" != "breaking" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "safe-bump" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --remove-label "safe-bump" 2>/dev/null || true
          fi

      - name: Probe-fail gate (red CI)
        # Probe-fail must show as a red CI check: PRs cannot merge with a
        # stale corpus. The probe-blocked comment above explains how to
        # resolve (/approve-reuse to widen the SSOT envelope, or landmark
        # patch); this gate makes that resolution mandatory rather than
        # advisory.
        if: steps.probe.outputs.verdict == 'fail'
        run: |
          echo "::error::Probe failed; downstream mining was skipped. CI is red until the probe-blocked comment is resolved."
          exit 1

  invariants-vllm:
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && (inputs.engine == 'vllm' || inputs.engine == 'all'))
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Mint llem-ci-bot App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Clean workspace (fix root-owned files from prior Docker runs)
        # Container-written artefacts persist as root-owned on the self-
        # hosted runner and break subsequent checkouts otherwise. Mirrors
        # gpu-ci.yml.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            alpine sh -c "find /workspace -not -user $(id -u) -delete 2>/dev/null || true"

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve vLLM version from SSOT
        id: version
        run: |
          VER=$(yq '.library.current_version' engine_versions/vllm.yaml)
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve vllm version from engine_versions/vllm.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=llenergymeasure:vllm-${VER}" >> "$GITHUB_OUTPUT"

      - name: Detect Docker Hub auth availability
        # `secrets.*` cannot be referenced from a step `if:`; capture
        # the token's presence into a step output via an env-bridge so
        # the auth step below can gate on it cleanly.
        id: dockerhub_auth
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Docker Hub (if token configured)
        # Self-hosted runners pulling 15-50 GB upstream images
        # anonymously can hit Docker Hub rate limits. Auth gated on
        # secret presence so external contributors / unconfigured forks
        # don't fail; missing secret silently skips this step.
        if: steps.dockerhub_auth.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull vLLM upstream image and tag locally
        # vLLM publishes canonical images at vllm/vllm-openai:v${VER}.
        # Pull directly and re-tag to the convenience local tag the rest
        # of this job consumes; the llenergymeasure package is mounted at
        # runtime via PYTHONPATH rather than baked into a first-party
        # overlay image.
        run: |
          UPSTREAM="vllm/vllm-openai:v${{ steps.version.outputs.version }}"
          docker pull "$UPSTREAM"
          docker tag "$UPSTREAM" "${{ steps.version.outputs.image }}"

      - name: Compute stable mining + vendor anchor
        id: anchor
        run: |
          PATHS=(
            "engine_versions/vllm.yaml"
            "scripts/engine_miners/vllm_static_miner.py"
            "scripts/engine_miners/vllm_dynamic_miner.py"
            "scripts/engine_miners/build_corpus.py"
            "scripts/engine_miners/_base.py"
            "scripts/engine_miners/_pydantic_lift.py"
            "scripts/engine_miners/_msgspec_lift.py"
            "scripts/engine_miners/_dataclass_lift.py"
            "scripts/engine_miners/_fixpoint_test.py"
            "scripts/vendor_rules.py"
            "scripts/_invariant_vendor_common.py"
            "scripts/refresh_invariant_rules.sh"
          )
          SHA=$(git log -1 --format=%H -- "${PATHS[@]}")
          DATE=$(git log -1 --format=%aI -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          echo "sha=${SHA:-${GITHUB_SHA}}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Probe — landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            -e PYTHONPATH=/repo/src:/repo \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python3 \
            "$IMAGE" \
            -m scripts._probe --engine vllm --producer invariants \
            > /tmp/probe-vllm.json
          VERDICT=$(jq -r '.verdict' /tmp/probe-vllm.json)
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"

      - name: Fix container-written file ownership (probe cache)
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            alpine sh -c "chown -R $(id -u):$(id -g) /workspace 2>/dev/null || true"

      - name: Save current YAMLs for diffing
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          mkdir -p /tmp/engine-invariants-diff
          for KIND in proposed vendored; do
            OLD_YAML="${CORPUS_DIR}/vllm.${KIND}.yaml"
            DEST="/tmp/engine-invariants-diff/vllm.${KIND}.old.yaml"
            if [[ -f "$OLD_YAML" ]]; then
              cp "$OLD_YAML" "$DEST"
            else
              : > "$DEST"
            fi
          done

      - name: Mine + vendor inside container
        if: steps.probe.outputs.verdict == 'pass'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          ANCHOR_SHA: ${{ steps.anchor.outputs.sha }}
          ANCHOR_DATE: ${{ steps.anchor.outputs.date }}
        run: |
          docker run --rm --gpus all \
            -e LLENERGY_MINER_FROZEN_AT="${ANCHOR_DATE}" \
            -e LLENERGY_VENDOR_FROZEN_AT="${ANCHOR_DATE}" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/repo/src:/repo \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint bash \
            "$IMAGE" \
            -c "
              set -euo pipefail
              python3 -m scripts.engine_miners.build_corpus --engine vllm
              python3 scripts/vendor_rules.py \
                --engine vllm \
                --corpus '${CORPUS_DIR}/vllm.proposed.yaml' \
                --out '${CORPUS_DIR}/vllm.vendored.yaml' \
                --vendor-commit '${ANCHOR_SHA}' \
                --fail-on-divergence
            "

      - name: Fix container-written file ownership (mine + vendor)
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            alpine sh -c "chown -R $(id -u):$(id -g) /workspace 2>/dev/null || true"

      - name: Set up Python (host) for doc-gen + diff
        if: steps.probe.outputs.verdict == 'pass'
        # Doc generator + differ run on the host (no GPU needed, but they
        # DO import llenergymeasure.* + scripts.engine_miners.*).
        # `uv sync --dev` installs the lean host project (no engine extras).
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: engine-invariants-vllm-docgen-3.12
          python-version: "3.12"

      - name: Install lean host project for doc-gen
        if: steps.probe.outputs.verdict == 'pass'
        run: uv sync --dev

      - name: Regenerate invariants digest doc
        if: steps.probe.outputs.verdict == 'pass'
        run: |
          uv run python scripts/generate_invariants_doc.py \
            --engine vllm \
            --out docs/generated/invariants-vllm.md

      - name: Classify diff (proposed + vendored)
        if: steps.probe.outputs.verdict == 'pass'
        id: diff
        run: |
          set +e
          uv run python scripts/diff_engine_invariants.py \
            /tmp/engine-invariants-diff/vllm.vendored.old.yaml \
            "${CORPUS_DIR}/vllm.vendored.yaml" \
            --out /tmp/engine-invariants-diff/vllm.vendored.md \
            --title "vLLM vendored invariants diff"
          VENDORED_EXIT=$?
          set -e

          PROPOSED_CHANGED=true
          if diff -q /tmp/engine-invariants-diff/vllm.proposed.old.yaml \
                    "${CORPUS_DIR}/vllm.proposed.yaml" >/dev/null 2>&1; then
            PROPOSED_CHANGED=false
          fi

          VENDORED_CHANGED=true
          if diff -q /tmp/engine-invariants-diff/vllm.vendored.old.yaml \
                    "${CORPUS_DIR}/vllm.vendored.yaml" >/dev/null 2>&1; then
            VENDORED_CHANGED=false
          fi

          if [[ "$PROPOSED_CHANGED" == "false" && "$VENDORED_CHANGED" == "false" ]]; then
            CLASSIFICATION="no-changes"
          elif [[ $VENDORED_EXIT -eq 1 ]]; then
            CLASSIFICATION="breaking"
          else
            CLASSIFICATION="safe"
          fi
          echo "classification=${CLASSIFICATION}" >> "$GITHUB_OUTPUT"

          {
            echo "## Engine invariants — vllm"
            echo
            if [[ "$CLASSIFICATION" == "no-changes" ]]; then
              echo "_No changes to proposed or vendored invariants._"
            else
              if [[ "$PROPOSED_CHANGED" == "true" ]]; then
                echo "### Proposed corpus diff"
                echo
                echo '```diff'
                diff -u /tmp/engine-invariants-diff/vllm.proposed.old.yaml \
                        "${CORPUS_DIR}/vllm.proposed.yaml" | head -n 200 || true
                echo '```'
                echo
              fi
              if [[ -f /tmp/engine-invariants-diff/vllm.vendored.md ]]; then
                cat /tmp/engine-invariants-diff/vllm.vendored.md
              fi
            fi
          } > /tmp/engine-invariants-diff/vllm.summary.md

      - name: Probe-fail comment (skip downstream)
        if: steps.probe.outputs.verdict == 'fail' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          {
            echo "## Engine invariants — vllm (probe-blocked)"
            echo
            echo "**Probe failed.** Producer landmarks no longer resolve under the installed library."
            echo
            echo "**Missing landmarks:**"
            echo
            jq -r '.landmarks_missing[] | "- `" + . + "`"' /tmp/probe-vllm.json
            echo
            echo "**Downstream mine + vendor steps were skipped.** No corpus changes were committed against this PR."
            echo
            echo "**To unblock,** choose one of:"
            echo
            echo "- **Patch the producer module's landmarks** — required when the library has genuinely renamed or removed the missing symbols. The miner code needs updating to match the new library API."
            echo "- **Run \`@llem-ci-bot /approve-reuse vllm invariants\`** — widens the SSOT pin envelope to declare \"the existing miner code is valid for this library version too.\" Only useful when the library bumped *past* the miner's previously-validated version range but the landmarks still resolve."
            echo
            echo "**The probe is the canonical gate** — \`/approve-reuse\` does not bypass it. It only widens the version-pin so the version check stops blocking. If landmarks were genuinely renamed, only a producer-module patch will turn the probe green. CI stays red until the probe verdict flips to \`pass\`."
          } | gh pr comment "$PR_NUMBER" --body-file -
          gh pr edit "$PR_NUMBER" --add-label "probe-blocked" 2>/dev/null || true

      - name: Upload diff artefact
        if: steps.probe.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: engine-invariants-diff-vllm
          path: |
            /tmp/engine-invariants-diff/vllm.proposed.old.yaml
            /tmp/engine-invariants-diff/vllm.vendored.old.yaml
            /tmp/engine-invariants-diff/vllm.summary.md
            ${{ env.CORPUS_DIR }}/vllm.proposed.yaml
            ${{ env.CORPUS_DIR }}/vllm.vendored.yaml

      - name: Post per-pipeline comment (suppress on empty)
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file /tmp/engine-invariants-diff/vllm.summary.md

      - name: Apply per-pipeline label
        if: steps.probe.outputs.verdict == 'pass' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          for L in invariants-changed invariants-breaking invariants-safe probe-blocked; do
            gh pr edit "$PR_NUMBER" --remove-label "$L" 2>/dev/null || true
          done
          case "${{ steps.diff.outputs.classification }}" in
            breaking)  gh pr edit "$PR_NUMBER" --add-label "invariants-breaking" --add-label "invariants-changed" 2>/dev/null || true ;;
            safe)      gh pr edit "$PR_NUMBER" --add-label "invariants-safe" --add-label "invariants-changed" 2>/dev/null || true ;;
            no-changes) ;;
          esac

      - name: Detect sibling workflow run for this SHA
        id: sibling
        if: steps.probe.outputs.verdict == 'pass' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          SIBLING_NAME="Engine Schemas — Probe + Discover"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${HEAD_SHA}&per_page=50" \
            --jq "[.workflow_runs[] | select(.name == \"${SIBLING_NAME}\")] | length")
          if [[ "${COUNT}" -gt 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sibling workflow ${SIBLING_NAME} did not fire for this SHA; skipping wait."
          fi

      - name: Wait for sibling pipeline to complete
        # CONTRACT: check-name below must match the schemas-vllm JOB ID
        # in engine-schemas.yml. See the transformers wait block above
        # for full ordering rationale.
        if: steps.probe.outputs.verdict == 'pass' && steps.sibling.outputs.exists == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          check-name: 'schemas-vllm'
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Atomic writeback
        if: steps.probe.outputs.verdict == 'pass' && steps.diff.outputs.classification != 'no-changes' && steps.app-token.outputs.token != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name  "llem-ci-bot[bot]"
          git config user.email "${{ secrets.APP_ID }}+llem-ci-bot[bot]@users.noreply.github.com"

          # Pull in any sibling-pipeline writeback that landed first.
          git pull --rebase --autostash

          git add \
            "${CORPUS_DIR}/vllm.proposed.yaml" \
            "${CORPUS_DIR}/vllm.vendored.yaml" \
            docs/generated/invariants-vllm.md

          if git diff --cached --quiet; then
            echo "No engine-invariants artefact changes to commit."
            exit 0
          fi

          git commit -m "chore(invariants): refresh vllm proposed + vendored corpus"
          git push --force-with-lease

      - name: Apply cross-pipeline rollup label
        if: steps.probe.outputs.verdict == 'pass' && (github.event_name == 'pull_request' || inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          if [[ "${{ steps.diff.outputs.classification }}" != "breaking" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "safe-bump" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --remove-label "safe-bump" 2>/dev/null || true
          fi

      - name: Probe-fail gate (red CI)
        # Probe-fail must show as a red CI check: PRs cannot merge with a
        # stale corpus. The probe-blocked comment above explains how to
        # resolve (/approve-reuse to widen the SSOT envelope, or landmark
        # patch); this gate makes that resolution mandatory rather than
        # advisory.
        if: steps.probe.outputs.verdict == 'fail'
        run: |
          echo "::error::Probe failed; downstream mining was skipped. CI is red until the probe-blocked comment is resolved."
          exit 1

  invariants-tensorrt:
    # tensorrt static miner reads source files from /tmp/trt-llm-${VER}/.
    # Earlier shapes resolved this from the installed NGC package via
    # tensorrt_llm.__file__ / __path__[0]; both broke as NGC's package
    # internals churned (#472, #500). The miner doesn't need the install
    # — it only needs source files — so we now download the canonical
    # GitHub release tarball on the runner host and bind-mount it into
    # the container. Decouples source resolution from NGC image internals.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && (inputs.engine == 'tensorrt' || inputs.engine == 'all'))
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Mint llem-ci-bot App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Clean workspace (fix root-owned files from prior Docker runs)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            alpine sh -c "find /workspace -not -user $(id -u) -delete 2>/dev/null || true"

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Resolve TRT-LLM version from SSOT
        id: version
        run: |
          VER=$(yq '.library.current_version' engine_versions/tensorrt.yaml)
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Could not resolve tensorrt version from engine_versions/tensorrt.yaml" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=llenergymeasure:tensorrt-${VER}" >> "$GITHUB_OUTPUT"

      # Self-hosted runners must have nvcr.io credentials configured (see docs/development.md).
      - name: Pull TRT-LLM upstream image and tag locally
        # NGC publishes canonical TRT-LLM images at
        # nvcr.io/nvidia/tensorrt-llm/release:${VER}. Pull directly and
        # re-tag to the convenience local tag the rest of this job
        # consumes; the llenergymeasure package is mounted at runtime
        # via PYTHONPATH rather than baked into a first-party overlay.
        run: |
          UPSTREAM="nvcr.io/nvidia/tensorrt-llm/release:${{ steps.version.outputs.version }}"
          docker pull "$UPSTREAM"
          docker tag "$UPSTREAM" "${{ steps.version.outputs.image }}"

      - name: Compute stable mining + vendor anchor
        id: anchor
        run: |
          PATHS=(
            "engine_versions/tensorrt.yaml"
            "scripts/engine_miners/tensorrt_static_miner.py"
            "scripts/engine_miners/tensorrt_miner.py"
            "scripts/engine_miners/build_corpus.py"
            "scripts/engine_miners/_base.py"
            "scripts/engine_miners/_pydantic_lift.py"
            "scripts/engine_miners/_msgspec_lift.py"
            "scripts/engine_miners/_dataclass_lift.py"
            "scripts/engine_miners/_fixpoint_test.py"
            "scripts/vendor_rules.py"
            "scripts/_invariant_vendor_common.py"
            "scripts/refresh_invariant_rules.sh"
          )
          SHA=$(git log -1 --format=%H -- "${PATHS[@]}")
          DATE=$(git log -1 --format=%aI -- "${PATHS[@]}")
          if [[ -z "${DATE}" ]]; then
            echo "::error::No git history found for any anchor input path; refusing to use wallclock fallback (would break determinism)." >&2
            exit 1
          fi
          echo "sha=${SHA:-${GITHUB_SHA}}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Fetch tensorrt-llm source tarball (host)
        # Download the canonical GitHub release tarball for the SSOT-pinned
        # version and extract it under /tmp/trt-llm-${VER}/. The static
        # miner reads source files from /tmp/trt-llm-${VER}/tensorrt_llm/.
        # The tarball location is bind-mounted into the container in the
        # probe + mine steps below, decoupling source resolution from
        # whatever the NGC image happens to expose via Python introspection.
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf "/tmp/trt-llm-${VER}"
          mkdir -p "/tmp/trt-llm-${VER}"
          curl -fsSL -o "/tmp/trt-llm-src-${VER}.tar.gz" \
            "https://github.com/NVIDIA/TensorRT-LLM/archive/refs/tags/v${VER}.tar.gz"
          tar -xzf "/tmp/trt-llm-src-${VER}.tar.gz" -C "/tmp/trt-llm-${VER}" --strip-components=1
          rm "/tmp/trt-llm-src-${VER}.tar.gz"
          test -d "/tmp/trt-llm-${VER}/tensorrt_llm"

      - name: Probe — landmark resolution check (in container)
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VER: ${{ steps.version.outputs.version }}
