            -v "${{ github.workspace }}":/workspace \
            alpine sh -c "chown -R $(id -u):$(id -g) /workspace 2>/dev/null || true"

      - name: Save current YAMLs for diffing
        if: steps.probe.outputs.verdict == 'pass'
