name: Build docs site

# Builds the Docusaurus site under website/ and deploys to GitHub Pages
# on push to main. PR runs build only (no deploy) so the docs build
# acts as an authoritative correctness gate, independent of Cloudflare
# Pages preview availability (see docs/contributing/preview-deployments.md).
#
# Path filters are asymmetric on purpose:
# - pull_request includes scripts/generate_api_docs.py because edits to
#   the custom stdlib-only API renderer can break the build, and only a
#   docs build run will catch that.
# - push to main does not, mirroring the deploy-side policy that API
#   reference drift on src changes is acceptable until the next
#   docs/website push (avoids triggering republish on every src commit).
#
# Path-trigger self-test: this workflow's own filename is included in
# both `on.pull_request.paths` and `on.push.paths` below, so edits fire
# the workflow at PR time and on merge.

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "scripts/generate_api_docs.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is declared per job, not workflow-wide: the two jobs need
# opposite policies. A single workflow-level `pages` group would make any
# ref's docs run cancel any other ref's in-flight run, so concurrent
# pushes showed up as spurious cancelled checks on unrelated PRs.

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    concurrency:
      # Read-only / stateless - safe to cancel in-flight runs, but keyed on
      # the ref so a build only ever supersedes an older build of the same
      # branch or PR.
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        # Base install only - no GPU extras needed. Brings in pyyaml,
        # pydantic, etc. so llenergymeasure is importable by the generator.
        run: pip install -e .

      - name: Generate API reference
        run: python scripts/generate_api_docs.py

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy docs site
    # Skipped on pull_request - PR runs are build-only, used as a
    # correctness gate. Fires on push to main (standard publish path)
    # and workflow_dispatch (manual republish lever).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # One Pages deployment at a time, globally across every ref; never
      # cancel a publish mid-flight (it can leave the site half-updated).
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
