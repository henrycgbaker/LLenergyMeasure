name: Study runner / manifest / resume
description: Issue with multi-experiment study orchestration, manifest, sweep state, or resume
labels: ["area:study"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - manifest (read / write / shape)
        - resume / checkpoint
        - sweep resolution (YAML -> ExperimentConfig list)
        - runner state (in-flight, retry, error handling)
        - other
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Type label for triage. Add the matching label after submission.
      options:
        - fix
        - poc-debug
        - feat
        - refactor
        - chore
        - test
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong, or what should change?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Study config, run command, manifest excerpt, or failing log
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Backend(s), partial-progress state, expected behaviour
